      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: shortcut-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: preflight-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Return exact receipt through readable check output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "preflight-evidence"
          path = root / "receipt.json"
          receipt = json.loads(path.read_text()) if path.exists() else {"status":"NOT_EXECUTED", "reason":"setup or payload failed; inspect original job logs", "host_commands":[]}
          text = dict(receipt)
          text["host_commands"] = [{k:v for k,v in r.items() if k not in ("stdout_tail","stderr_tail")} for r in receipt["host_commands"]]
          text["artifact_url"] = os.environ.get("ARTIFACT_URL","")
          text["artifact_digest"] = os.environ.get("ARTIFACT_DIGEST","")
          text["job_outcome"] = os.environ["PREFLIGHT_OUTCOME"]
          text["artifact_outcome"] = os.environ["ARTIFACT_OUTCOME"]
          body = json.dumps(text, ensure_ascii=False, indent=2)
          assert len(body.encode()) < 62000, "receipt exceeds check output limit; full evidence remains in artifact"
          ok = receipt["status"] == "PASS" and os.environ["PREFLIGHT_OUTCOME"] == "success" and os.environ["ARTIFACT_OUTCOME"] == "success"
          summary = "Isolated host preflight: %s. Product branch unchanged. Android not executed. Run %s attempt %s." % (
           "PASS" if ok else "FAIL_OR_NOT_EXECUTED", os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          request = {"name":"Shortcut preflight evidence", "head_sha":os.environ["GITHUB_SHA"],
           "status":"completed", "conclusion":"success" if ok else "failure",
           "external_id":os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"],
           "output":{"title":"Seven-file integration and 21 host gates", "summary":summary, "text":"```json\n" + body + "\n```"}}
          endpoint = "repos/" + os.environ["GITHUB_REPOSITORY"] + "/check-runs"
          def api(args, data=None):
              result = subprocess.run(["gh","api"] + args, input=data, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
              if result.returncode:
                  raise RuntimeError("CI receipt publication/readback failed: " + result.stderr[-3000:])
              return json.loads(result.stdout)
          created = api(["--method","POST",endpoint,"--input","-"], json.dumps(request))
          assert created["head_sha"] == request["head_sha"]
          readback = api([endpoint + "/" + str(created["id"])])
          assert readback["output"]["text"] == request["output"]["text"]
          assert readback["output"]["summary"] == summary and readback["conclusion"] == request["conclusion"]
          assert readback["external_id"] == request["external_id"] and readback["head_sha"] == request["head_sha"]
          print("PREFLIGHT_RECEIPT_EXACT_READBACK", readback["url"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary_file:
              summary_file.write(summary + "\n\n" + request["output"]["text"])
          if not ok:
              raise SystemExit(1)
          PY
