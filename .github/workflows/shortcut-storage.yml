          s=p.read_text()
          for old,new in [('return 0 if result.get("status")=="CAPTURED_NOT_ROOT_CAUSE" and not worker.is_alive() else 1', 'return 0 if (not worker.is_alive() and result.get("logcat",{}).get("status") in ("EXITED","STOPPED_AFTER_ORIGINAL")) else 1'), ('    fake.write_text("#!"+sys.executable+"\\nraise SystemExit(9)\\n")', '    fake.write_text("#!"+sys.executable+"\\nraise SystemExit(0)\\n")\n    assert m.run([sys.executable,"-c","import time;time.sleep(.2)"],str(fake),root/"no-crash-success")==0\n    assert json.loads((root/"no-crash-success/receipt.json").read_text())["status"]=="NO_CRASH_BYTES_NOT_VERIFIED"\n    fake.write_text("#!"+sys.executable+"\\nraise SystemExit(9)\\n")')]:
