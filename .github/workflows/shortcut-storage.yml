name: Bounded original directory transport experiment
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  checks: write
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    env:
      TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2b94a08c1f4ce9245d11971cd7a6993a10e4877a
          persist-credentials: false
      - name: Materialize pinned diagnostic and test first-failure bound
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib
          raw=lzma.decompress(base64.b64decode(""))
          assert hashlib.sha256(raw).hexdigest()=="4f45d7eda0607a5e2a31eca1864c0b55bb16d2a04609045321ed65c01f5fea16"
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"directory-probe"
          target.mkdir()
          for name,body in json.loads(raw).items():
              assert name in ("reproduction.py","test_reproduction.py")
              (target/name).write_text(body)
          PY
          python3 "$RUNNER_TEMP/directory-probe/test_reproduction.py"
      - name: Build prerequisites without signing credentials
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          curl --fail --location https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          curl --fail --location https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install --yes strace
      - name: Existing full host contracts before device work
        run: |
          set -euo pipefail
          python3 tools/verify_process_control.py selftest
          python3 tools/verify_process_control.py server-log-selftest
          python3 tools/verify_process_control.py isolated-selftest
          python3 tools/verify_process_control.py isolated-real-selftest
          python3 tools/verify_shortcuts.py selftest
      - name: Build exact disposable source with original build guard
        env:
          BUILD_429_EXECUTE: "true"
          BUILD_LOG: diagnostic-build.log
        run: |
          set -euo pipefail
          python3 tools/verify_shortcuts.py build 2>&1 | tee diagnostic-build-driver.log
      - name: Observe at most twenty original commands and stop on first failure
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/directory-probe/reproduction.py" 2>&1 | tee diagnostic-experiment.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: directory-experiment-api-${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            directory-experiment/
            diagnostic-*.log
            shortcut-build.json
            shortcut-build.log
            ci-runtime-identity.json
            emulator.log
          if-no-files-found: error
          retention-days: 14
      - name: Publish bounded readable diagnostic receipt and verify exact readback
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          UPLOAD_STATUS: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: python3 "$RUNNER_TEMP/directory-probe/reproduction.py" publish
