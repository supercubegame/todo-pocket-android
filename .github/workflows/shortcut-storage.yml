name: Recover exact ebd API34 original evidence
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover original artifact without product writes or device reruns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,pathlib,zlib
          raw=zlib.decompress(base64.b64decode(""))
          assert len(raw)==8761 and hashlib.sha256(raw).hexdigest()=="e1676e166d2f96ad4fc1651f5176cfd3e1c19407cdd7fcd2444f4eca13809b34"
          ast.parse(raw)
          pathlib.Path("recover.py").write_bytes(raw)
          PY
          python3 recover.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-ebd-api34
          path: original-ebd-api34/
          if-no-files-found: error
          retention-days: 14
