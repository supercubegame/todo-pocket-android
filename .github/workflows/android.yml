          import hashlib,json,os,sys,time,traceback
          from pathlib import Path
          sys.path.insert(0,'tools')
          sys.path.insert(0,os.environ['RUNNER_TEMP'])
          from export_native_probe import standalone_native
          import emulator_gate as gate
          import verify_exports
          from verify_schema3 import PAGED_BACKEND_LABELS,PAGED_PREVIEW_LABELS,require_registration,certificate,exception_evidence
          started=time.monotonic()
          result={'status':'FAIL','commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'api':gate.API,'scope':'PARALLEL_EXPORT_BACKEND_PREVIEW_AND_SYNTHETIC_NATIVE_MULTIPAGE_NOT_FULL_REGRESSION',
            'release_ready':False,'durable_upgrade_ready':False}
          calls=[]
          preflight={'phase':'EMULATOR_START'};result['preflight']=preflight
          def install_and_probe(adb):
            preflight['phase']='APK_DISCOVERY'
            apps=list(Path('build/outputs/apk/debug').glob('*.apk'))
            tests=list(Path('build/outputs/apk/androidTest/debug').glob('*.apk'))
            preflight.update(apps=list(map(str,apps)),tests=list(map(str,tests)))
            assert len(apps)==len(tests)==1,'expected exactly one product and one test APK'
            preflight['phase']='CERTIFICATES'
            app_cert=certificate(apps[0],gate);test_cert=certificate(tests[0],gate)
            preflight.update(app_certificate=app_cert,test_certificate=test_cert)
            assert app_cert==test_cert,'product/test APK certificate mismatch'
            preflight['phase']='BADGING'
            badging=gate.run([gate.SDK/'build-tools/35.0.0/aapt','dump','badging',apps[0]],capture=True).stdout
            preflight['badging']=badging[:4096]
            assert "name='"+gate.PKG+"'" in badging and "sdkVersion:'26'" in badging,'product package/minSdk mismatch'
            for apk in (apps[0],tests[0]):
              preflight.update(phase='INSTALL',apk=str(apk))
              gate.run([adb,'-s',gate.SERIAL,'install','-t',apk],timeout=120)
            preflight['phase']='REGISTRATION'
            require_registration(adb,gate,'probe','V12DeviceTest')
            preflight['phase']='INSTALLED_PATH'
            installed=gate.run([adb,'-s',gate.SERIAL,'shell','pm','path',gate.PKG],capture=True).stdout.strip()
            preflight['installed_path']=installed
            assert installed.startswith('package:') and '\n' not in installed,'installed APK path missing or ambiguous'
            from verify_adb_transfer import pull_exact
            preflight['phase']='INSTALLED_BYTES'
            expected=apps[0].read_bytes()
            preflight['installed_transfer']={}
            actual=pull_exact(adb,gate.SERIAL,installed[8:],expected,preflight['installed_transfer'])
            preflight.update(actual_bytes=len(actual),expected_bytes=len(expected),actual_sha256=hashlib.sha256(actual).hexdigest(),expected_sha256=hashlib.sha256(expected).hexdigest())
            assert actual==expected,'installed product bytes differ from built APK'
            calls.append('installed_exact_product')
            preflight['phase']='CODEC_AND_PREVIEW'
            verify_exports.android_codec(adb,gate)
            calls.append('codec_and_actual_preview')
            # The codec composes a later native callback for the FULL runner.
            # This separate job deliberately has a narrower named contract.
            # Restore only this job's receipt callback, never alter full jobs.
            gate.verify_native_ui=finish_probe
          def finish_probe(adb):
            preflight['phase']='CODEC_RECEIPT'
            assert calls==['installed_exact_product','codec_and_actual_preview']
            codec=json.loads(Path('native-ui/codec-result.json').read_text())
            assert codec['status']=='PASS' and codec['commit']==result['commit'] and codec['run_id']==result['run_id'] and codec['api']==gate.API
            paged=codec['paged_exports'];preview=paged['preview_ui']
            assert paged['status']=='PASS' and paged['labels']==PAGED_BACKEND_LABELS and paged['checks']==29
            assert preview['labels']==PAGED_PREVIEW_LABELS and preview['checks']==22
            assert paged['instrumentation']['product_apk_sha256']==hashlib.sha256(actual_product()).hexdigest()
            assert not Path('native-ui/native-result.json').exists(),'probe must not fabricate full native acceptance'
            result['codec']=codec
            preflight['phase']='NATIVE_SAF'
            result['native_image_pages']=standalone_native(adb,gate)
            calls.append('synthetic_native_saved')
            calls.append('receipt_verified')
            result.update(status='PASS',native_saf='SYNTHETIC_IMAGE_MULTIPAGE_ONLY')
          def actual_product():
            apps=list(Path('build/outputs/apk/debug').glob('*.apk'));assert len(apps)==1
            return apps[0].read_bytes()
          gate.verify_database=install_and_probe
          gate.verify_native_ui=finish_probe
          try:
            gate.main()
            assert calls==['installed_exact_product','codec_and_actual_preview','synthetic_native_saved','receipt_verified']
          except Exception as exc:
            result.update(status='FAIL',error=repr(exc),original_failure=exception_evidence(exc),traceback=traceback.format_exc()[-16000:]);raise
          finally:
            result.update(elapsed_seconds=round(time.monotonic()-started,3),stages=calls)
            if Path('export-native.json').exists():result['native_image_pages']=json.loads(Path('export-native.json').read_text())
            Path('export-probe.json').write_text(json.dumps(result,indent=2)+'\n')
            if Path('emulator.log').exists():
              Path('export-probe-emulator.log').write_bytes(Path('emulator.log').read_bytes())
            print('EXPORT_PROBE_RESULT '+json.dumps(result),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: export-probe-api-${{ matrix.api }}
          path: |
            isolated-trace-host.log
            export-probe.json
            export-probe.log
            export-probe-setup.log
            export-probe-build.log
            export-probe-emulator.log
            export-native.json
            export-native/*.png
            native-ui/codec-result.json
