name: Redispatch 6edde64 main acceptance
'on':
  push:
    branches:
      - ci/shortcut-storage-preflight-4d8742
permissions:
  actions: write
  contents: read
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  redispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_REF: feature/v1.2-activity-notes-ledger
      EXPECTED_SHA: 6edde64ebf12f8c44f7925c786a12e9cc1abe8a2
    steps:
      - name: Dispatch one fresh main acceptance run only when the product ref is still the exact commit
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCT_REF" --jq .object.sha)
          echo "product ref: $actual"
          test "$actual" = "$EXPECTED_SHA"
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/dispatches" -f ref="$PRODUCT_REF"
          echo "DISPATCHED android.yml for $EXPECTED_SHA; first failed run 45363012187 stays as evidence"
