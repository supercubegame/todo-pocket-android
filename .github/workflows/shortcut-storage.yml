name: Recover complete original startup failure log
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  original_failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover complete original log as data without rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,traceback
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"original-failure";out.mkdir()
          repo="repos/"+os.environ["GITHUB_REPOSITORY"]
          def api(path):
              r=subprocess.run(["gh","api",repo+path]+(["--allow-escape-sequences"] if path.endswith("/logs") else []),capture_output=True,timeout=60)
              if r.returncode: raise RuntimeError("read failed "+path+" "+r.stderr.decode(errors="replace")[-4000:])
              return r.stdout
          def publish(name,meta,text,ok):
              body={"name":name,"head_sha":os.environ["GITHUB_SHA"],"status":"completed","conclusion":"success" if ok else "failure",
                    "output":{"title":"Original failure recovery, not test acceptance","summary":json.dumps(meta),"text":"```text\n"+text+"\n```"}}
              assert len(body["output"]["text"].encode())<60000
              r=subprocess.run(["gh","api","--method","POST",repo+"/check-runs","--input","-"],input=json.dumps(body),text=True,capture_output=True,timeout=60,check=True)
              seen=json.loads(api("/check-runs/"+str(json.loads(r.stdout)["id"])))
              assert seen["head_sha"]==body["head_sha"] and seen["conclusion"]==body["conclusion"]
              assert all(seen["output"][k]==v for k,v in body["output"].items())
              print(seen["html_url"])
          try:
              run=json.loads(api("/actions/runs/38535075337"))
              job=json.loads(api("/actions/jobs/115757274638"))
              assert run["head_sha"]=="ab5162f847db4a2b88229b156c3702c31707a4ac" and run["run_attempt"]==1
              assert job["run_id"]==38535075337 and job["conclusion"]=="failure"
              raw=api("/actions/jobs/115757274638/logs")
              assert 0<len(raw)<=10485760
              (out/"original-host.log").write_bytes(raw)
              text="".join(c if ord(c)>=32 or c in "\n\t" else "\\x%02x"%ord(c) for c in raw.decode("utf-8","strict"))
              # Publish every character. No guessed step boundary or omitted head.
              parts=[text[i:i+10000] for i in range(0,len(text),10000)]
              assert "".join(parts)==text and 0<len(parts)<=100
              meta={"source_commit":run["head_sha"],"source_run":run["id"],"source_attempt":1,"source_job":job["id"],
                    "original_conclusion":"failure","bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),
                    "parts":len(parts),"scope":"COMPLETE_ORIGINAL_LOG_NO_RERUN_NO_PRODUCT_PUSH_NOT_TEST_PASS"}
              (out/"recovery.json").write_text(json.dumps(meta,indent=2))
              for i,part in enumerate(parts,1): publish(f"Original ab5162 log {i}/{len(parts)}",meta,part,True)
          except Exception:
              failure=traceback.format_exc().replace(os.environ["GH_TOKEN"],"[REDACTED]")
              (out/"recovery-error.txt").write_text(failure)
              publish("Original log recovery failed",{"scope":"NO_TEST_ACCEPTANCE"},failure,False)
              raise
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-original-ab5162-log
          path: ${{ runner.temp }}/original-failure/
          if-no-files-found: error
          retention-days: 14
