{
  "name": "Read-only original callback failure recovery",
  "on": {
    "push": {
      "branches": [
        "ci/shortcut-storage-preflight-4d8742"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read",
    "checks": "write"
  },
  "concurrency": {
    "group": "shortcut-business-bridge-delivery",
    "cancel-in-progress": false
  },
  "jobs": {
    "recover_original_failure": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Recover pinned original archives without rerunning devices",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,io,json,os,pathlib,subprocess,zipfile\n\nREPO=\"supercubegame/todo-pocket-android\"\nRUN=38725988182\nHEAD=\"5df73a51e744646adda4a161d929a97a2c1c3109\"\nARTIFACTS=[\n (11967699343,\"activation-host\",\"76c5de26d962b7e10e73b9be0424903036e21b26f7bd4da6fba8bd9bd7413f27\"),\n (11967814777,\"shortcut-device-api-26\",\"1e08f21e3560fdfc764d07a7c08fdc2741d1109967ab0a7d19771919688844c4\"),\n (11967869612,\"shortcut-device-api-34\",\"f77f6c73e9aae2d90de54155593c67e5a51df4bb6471bcd980ea375c9c8ebecf\")]\n\ndef api(path,value=None):\n    command=[\"gh\",\"api\",\"repos/\"+REPO+\"/\"+path]\n    if value is not None:command+=[\"--method\",\"POST\",\"--input\",\"-\"]\n    result=subprocess.run(command,input=None if value is None else json.dumps(value).encode(),\n                          capture_output=True,timeout=60,check=True)\n    return result.stdout\n\ndef checked_zip(raw,digest):\n    assert hashlib.sha256(raw).hexdigest()==digest,\"original artifact digest\"\n    z=zipfile.ZipFile(io.BytesIO(raw));names=z.namelist()\n    assert len(names)==len(set(names)) and len(names)<=300,\"archive member identity\"\n    assert sum(i.file_size for i in z.infolist())<=16*1024*1024,\"archive expanded budget\"\n    assert all(not n.startswith(\"/\") and \"..\" not in pathlib.PurePosixPath(n).parts for n in names),\"archive member path\"\n    assert z.testzip() is None,\"archive CRC\"\n    return z\n\ndef selftest():\n    def fixture(names):\n        out=io.BytesIO()\n        with zipfile.ZipFile(out,\"w\") as z:\n            for name in names:z.writestr(name,b\"fixture\")\n        return out.getvalue()\n    good=fixture([\"safe.txt\"]);digest=hashlib.sha256(good).hexdigest()\n    assert checked_zip(good,digest).read(\"safe.txt\")==b\"fixture\"\n    cases=[(good,\"0\"*64,\"digest\"),(fixture([\"../escape\"] ),None,\"path\"),\n           (fixture([\"/absolute\"]),None,\"path\"),(fixture([\"same\",\"same\"]),None,\"identity\")]\n    for raw,expected,reason in cases:\n        try:checked_zip(raw,expected or hashlib.sha256(raw).hexdigest())\n        except AssertionError as error:assert reason in str(error)\n        else:raise AssertionError(\"accepted bad archive \"+reason)\n    print(\"RECOVERY_ARCHIVE_GATE positive=1 negative=4\")\n\ndef publish(name,text):\n    assert len(text.encode())<55000,\"publication byte budget\"\n    value={\"name\":name,\"head_sha\":os.environ[\"GITHUB_SHA\"],\"status\":\"completed\",\n           \"conclusion\":\"success\",\"output\":{\"title\":\"ORIGINAL_EVIDENCE_RECOVERED_NOT_DEVICE_ACCEPTANCE\",\n           \"summary\":\"Read-only extraction from failed 5df73a run. Product pushes=0; device reruns=0; no repair accepted.\",\n           \"text\":text}}\n    made=json.loads(api(\"check-runs\",value))\n    seen=json.loads(api(\"check-runs/\"+str(made[\"id\"])))\n    assert seen[\"head_sha\"]==value[\"head_sha\"] and seen[\"conclusion\"]==value[\"conclusion\"]\n    assert all(seen[\"output\"][k]==v for k,v in value[\"output\"].items()),\"exact publication readback\"\n\ndef main():\n    selftest()\n    assert os.environ[\"GITHUB_REPOSITORY\"]==REPO and os.environ[\"GITHUB_RUN_ATTEMPT\"]==\"1\"\n    run=json.loads(api(\"actions/runs/\"+str(RUN)))\n    assert run[\"head_sha\"]==HEAD and run[\"run_attempt\"]==1 and run[\"conclusion\"]==\"failure\"\n    folder=pathlib.Path(\"original-callback-evidence\");folder.mkdir()\n    manifest={\"source_run\":RUN,\"source_head\":HEAD,\"device_reruns\":0,\"product_pushes\":0,\"artifacts\":[]}\n    for aid,name,digest in ARTIFACTS:\n        meta=json.loads(api(\"actions/artifacts/\"+str(aid)))\n        assert meta[\"name\"]==name and not meta[\"expired\"] and meta[\"digest\"]==\"sha256:\"+digest\n        assert meta[\"workflow_run\"][\"id\"]==RUN and meta[\"workflow_run\"][\"head_sha\"]==HEAD\n        raw=api(\"actions/artifacts/\"+str(aid)+\"/zip\")\n        assert len(raw)==meta[\"size_in_bytes\"]\n        z=checked_zip(raw,digest);(folder/(name+\".zip\")).write_bytes(raw)\n        members=[{\"name\":n,\"bytes\":z.getinfo(n).file_size,\"sha256\":hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist()]\n        manifest[\"artifacts\"].append({\"id\":aid,\"name\":name,\"sha256\":digest,\"members\":members})\n        if name==\"activation-host\":\n            receipts=[n for n in z.namelist() if n==\"receipt.json\"]\n            assert len(receipts)==1,\"original host receipt\"\n            receipt=json.loads(z.read(receipts[0]))\n            assert len(receipt[\"host_commands\"])==21\n            assert all(r[\"returncode\"]==0 and not r[\"timed_out\"] and r[\"attempts\"]==1 for r in receipt[\"host_commands\"])\n            compact={k:v for k,v in receipt.items() if k!=\"host_commands\"}\n            compact[\"host_commands\"]=[{k:v for k,v in r.items() if k not in (\"stdout_tail\",\"stderr_tail\")} for r in receipt[\"host_commands\"]]\n            publish(\"Original 5df host identity and 21 receipts\",\"```json\\n\"+json.dumps(compact,ensure_ascii=False,indent=2)+\"\\n```\")\n            for base in (\"Schema4Store.java\",\"AppDatabase.java\",\"TodayScreen.java\"):\n                matches=[n for n in z.namelist() if n==\"candidate/src/main/java/com/supercubegame/pockettodo/\"+base]\n                assert len(matches)==1,(\"exact candidate member\",base,matches)\n                data=z.read(matches[0]);identity=receipt[\"candidate_files\"][\"src/main/java/com/supercubegame/pockettodo/\"+base]\n                assert len(data)==identity[\"bytes\"] and hashlib.sha256(data).hexdigest()==identity[\"sha256\"]\n                assert hashlib.sha1(b\"blob \"+str(len(data)).encode()+b\"\\0\"+data).hexdigest()==identity[\"blob\"]\n                lines=data.decode().splitlines();selected=set()\n                for i,line in enumerate(lines):\n                    if any(term in line for term in (\"ActivationPlan\",\"prepareShortcutActivation\",\"prepareActivation\",\"activation-backups\")):\n                        selected.update(range(max(0,i-12),min(len(lines),i+100)))\n                assert selected,\"actual activation source\"\n                text=\"\\n\".join(str(i+1)+\": \"+lines[i] for i in sorted(selected))\n                publish(\"Original 5df activation source \"+base,\"Source identity: \"+json.dumps(identity)+\"\\nNumbered source windows, not full file.\\n```java\\n\"+text+\"\\n```\")\n        else:\n            selected=[]\n            for n in z.namelist():\n                if n.endswith((\".txt\",\".json\",\".log\")) and z.getinfo(n).file_size<30000:\n                    data=z.read(n)\n                    if b\"activation callback exactly one completed backup\" in data:\n                        selected.append({\"name\":n,\"text\":data.decode(errors=\"strict\")})\n            assert selected,\"original callback first failure\"\n            publish(\"Original 5df callback failure \"+name,\"```json\\n\"+json.dumps(selected,ensure_ascii=False,indent=2)+\"\\n```\")\n    (folder/\"manifest.json\").write_text(json.dumps(manifest,indent=2))\n    publish(\"Original 5df recovery archive identities\",\"```json\\n\"+json.dumps(manifest,indent=2)+\"\\n```\")\n\nif __name__==\"__main__\":main()\nPY\n"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "original-5df-callback-evidence",
            "path": "original-callback-evidence/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
