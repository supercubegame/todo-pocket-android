                      assert result.returncode!=0 and "AssertionError: "+label in result.stderr,(label,result.stdout,result.stderr)
                      print("NATIVE_CLICK_MUTANT_REJECTED",label)
              assert sum(LABELS.values(),[])==ACCEPTED and len(ACCEPTED)==20
              print("TODO_NATIVE_HOST",json.dumps(dict(positive=2,negative=total,validator_mutants=3,java="SYNTAX_ONLY_NOT_ANDROID")))
          
          def android():
              namespace=dict(vars(backend));namespace.update(JAVA=JAVA,REQUIRED=LABELS,SCOPE=SCOPE)
              exec(compile(inspect.getsource(backend.observe),"<native-parser>","exec"),namespace)
              driver=inspect.getsource(backend.android)
              assert driver.count('ROOT/"todo-device"')==1 and driver.count('native_ui="NOT_IMPLEMENTED"')==1
              driver=driver.replace('ROOT/"todo-device"','ROOT/"todo-native"').replace('native_ui="NOT_IMPLEMENTED"','native_ui="WIDGET_CALLBACKS_NOT_PHYSICAL_TOUCH"')
              exec(compile(driver,"<native-device-driver>","exec"),namespace)
              import emulator_gate as gate
              isolated_native(gate,namespace["android"])
          
          def report():
              import urllib.request
              from verify_evidence import publish
              source,run,attempt=(os.environ[k] for k in ("GITHUB_SHA","GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT"))
              needs=json.loads(os.environ["NEEDS_JSON"]);passed=all(needs.get(k,{}).get("result")=="success" for k in ("todo_host","todo_device"))
              devices={}
              for api in (26,34):
                  folder=Path("collected-todos")/("todo-device-api-"+str(api));row={"status":"FAIL"};devices[str(api)]=row
                  try:
                      v=json.loads((folder/"todo-native/result.json").read_text());m=json.loads((folder/"todo-apk.json").read_text())
                      logs={p:(folder/"todo-native"/(p+".log")).read_text() for p in (*LABELS,"diagnostic")}
                      validate(v,m,logs,api,source,run,attempt);row.update(status="PASS",evidence=v,manifest=m)
                  except (OSError,ValueError,AssertionError,KeyError,TypeError,IndexError) as e:passed=False;row["error"]=repr(e)
                  row["diagnostics"]={}
                  for name in ("result.json","build.log","diagnostic.log","seed.log","deleted.log","undone.log"):
                      try:
                          data=(folder/"todo-native"/name).read_bytes();row["diagnostics"][name]=dict(bytes=len(data),truncated=len(data)>12000,tail=data[-12000:].decode("utf-8","replace"))
                      except OSError as e:row["diagnostics"][name]={"error":repr(e)}
