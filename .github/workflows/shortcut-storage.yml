name: Read-only recovery of 271d1fe acceptance evidence
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read artifacts and logs of run 39123038507 only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,re,subprocess,sys,traceback,zipfile
          R="supercubegame/todo-pocket-android"
          RUN=39123038507
          HEAD="271d1fe5d7ce239b516f18cbb9528f030ac581ab"
          APK="d22b5b3161b51b63891568401ec3b09e44b0a93f5feb0fd6ae76066a25fc5c18"
          out=pathlib.Path("recovery-271d1fe")
          out.mkdir()
          rep={"run":RUN,"head":HEAD,"expected_apk_sha256":APK,"stage":"start","error":None,"artifacts":[],"apk_members":[],"saved_apk":None,"jobs":[]}
          # first recovery run 45319227076 already verified every listed artifact digest and found no APK member
          def gh(*args,data=None,extra=()):
              p=subprocess.run(["gh","api",*extra,*args],capture_output=True,timeout=600,input=data)
              if p.returncode:
                  raise RuntimeError("gh api "+" ".join(args)+" exit "+str(p.returncode)+": "+p.stderr.decode("utf-8","replace")[-1500:])
              return p.stdout
          def work():
              base="repos/"+R+"/actions/runs/"+str(RUN)
              rep["stage"]="run"
              run=json.loads(gh(base))
              rep["run_facts"]={k:run.get(k) for k in ("head_sha","run_attempt","status","conclusion")}
              assert run["head_sha"]==HEAD and run["run_attempt"]==1 and run["conclusion"]=="success"
              rep["stage"]="artifacts"
              for a in json.loads(gh(base+"/artifacts?per_page=100"))["artifacts"]:
                  row={"name":a["name"],"id":a["id"],"expired":a["expired"],"listed_digest":a["digest"]}
                  rep["artifacts"].append(row)
                  assert a["expired"] is False
                  rep["apk_members"].append([a["name"],a["size_in_bytes"]])
              rep["stage"]="jobs"
              for j in json.loads(gh(base+"/jobs?per_page=100"))["jobs"]:
                  row={"name":j["name"],"id":j["id"],"conclusion":j["conclusion"]}
                  rep["jobs"].append(row)
                  up=j["name"].startswith("upgrade")
                  if up or j["name"]=="database (34)":
                      log=gh("repos/"+R+"/actions/jobs/"+str(j["id"])+"/logs",extra=("--allow-escape-sequences",)).decode("utf-8","replace")
                      (out/("job-"+str(j["id"])+".log")).write_text(log)
                      rx=re.compile(r"upgrade|versionCode|signer|sha256|PASS|FAIL" if up else r"artifact|\.apk|preview|Package tested|upload",re.I)
                      lines=[l[:260] for l in log.splitlines() if rx.search(l)]
                      row["log_bytes"]=len(log)
                      row["matched"]=lines[:90]+["..."]+lines[-50:] if len(lines)>140 else lines
              rep["stage"]="done"
          try:
              work()
          except BaseException:
              rep["error"]=traceback.format_exc()[-3000:]
          text=json.dumps(rep,indent=1,ensure_ascii=False)
          (out/"report.json").write_text(text)
          found="APK_FOUND" if rep["saved_apk"] else "APK_NOT_FOUND"
          if rep["error"]:
              found="RECOVERY_ERROR_AT_"+rep["stage"]
          body={"name":"Recovery 271d1fe evidence","head_sha":os.environ["GITHUB_SHA"],"status":"completed","conclusion":"neutral" if rep["error"] else "success","output":{"title":found,"summary":"Read-only recovery; no product, device or phone change.","text":"```json\n"+text[:60000]+"\n```"}}
          gh("repos/"+R+"/check-runs","-X","POST","--input","-",data=json.dumps(body).encode())
          print(found,flush=True)
          sys.exit(1 if rep["error"] else 0)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-271d1fe
          path: recovery-271d1fe/
          if-no-files-found: error
          retention-days: 14
