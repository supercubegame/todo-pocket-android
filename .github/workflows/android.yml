          PAGE_CHECK=r'''
          import java.awt.image.BufferedImage;
          import javax.imageio.ImageIO;
          import java.io.File;
          public class ExportPageCheck {
           static void check(BufferedImage p,boolean first){
            if(p==null||p.getWidth()!=595||p.getHeight()!=842)throw new AssertionError("page dimensions");
            int ink=0;
            for(int y=0;y<842;y++)for(int x=0;x<595;x++){
             int c=p.getRGB(x,y);
             if((c>>>24)!=255)throw new AssertionError("alpha");
             if(first&&x>=36&&x<132&&y>=36&&y<132){
              if(c!=0xff21785f)throw new AssertionError("selected image pixel");continue;
             }
             if(c!=0xffffffff){
              int r=(c>>16)&255,g=(c>>8)&255,b=c&255;
              if(r!=g||g!=b)throw new AssertionError("unexpected color or extra image");
              if(x<36||x>=559||y<36||y>=806||(first&&y<144))throw new AssertionError("unexpected content region");
              ink++;
             }
            }
            if(ink==0)throw new AssertionError("empty text page");
           }
           static BufferedImage fixture(boolean first){
