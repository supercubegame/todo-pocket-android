      - name: Capture device screen ownership on the Android main thread
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/callback-predecessor/shortcut_host-19.sh"
      - name: Verify actual Android rotation recreation and finish with consent pending
        run: |
          set -euo pipefail
