           ('driver=driver.replace(anchor,anchor+"'+chr(92)+'n"+insert,1)', 'driver=driver.replace(anchor,anchor+"'+chr(92)*2+'n"+insert,1)'),
           ('static boolean isolatedActivationTest;")'+chr(92)+"n"+chr(92)+"'+anchor,1)", 'static boolean isolatedActivationTest;")'+chr(92)*2+"n"+chr(92)+"'+anchor,1)")
          ]
          for old,new in pairs:
           assert text.count(old)==1
           text=text.replace(old,new,1)
          fixed=text.encode()
          assert len(fixed)==29382 and blob(fixed)=="7ded9ebe7dca9e669e6dd4f6b906191f1ef957a0"
          assert hashlib.sha256(fixed).hexdigest()=="8ba546250800b9d2f752cf70446f11de83bdebd137acde6cf771621b5f576d2d"
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"exact-activation-scripts"
          folder.mkdir()
          lines=text.splitlines();scripts=[]
          for i,line in enumerate(lines):
           if line=="        run: |":
            body=[]
            for tail in lines[i+1:]:
             if tail and not tail.startswith("          "):break
             body.append(tail[10:] if tail else "")
            scripts.append("\n".join(body)+"\n")
          assert len(scripts)==11
