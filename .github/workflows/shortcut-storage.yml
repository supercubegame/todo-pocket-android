name: Isolated shortcut business bridge delivery
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: write
  actions: write
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  bridge_delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 159cfae1935f3e7cfef054a07d05a9a4aec17740
          path: source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f2ea66f56d99061b7331514c3ff339615c004a9f
          path: delivery-base
          persist-credentials: false
      - name: Select Java 17 and assert isolated one-attempt trigger
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "supercubegame/todo-pocket-android"
          test "$GITHUB_REF" = "refs/heads/ci/shortcut-storage-preflight-4d8742"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Materialize hash-bound test-first integration payload
        run: |
          python3 - <<'PY'
          import ast,base64,hashlib,json,lzma,os,pathlib,re
          prior=(pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"delivery-base/.github/workflows/shortcut-storage.yml").read_bytes()
          assert hashlib.sha256(prior).hexdigest()=="bd54f1cf61868a86cc685bf15f790be13d09c9bb69589b397f12cd6935955e82"
          encoded=re.findall(r'raw=lzma.decompress\(base64.b64decode\("([^"]+)",validate=True\)\)',prior.decode())
          assert len(encoded)==1
          raw=lzma.decompress(base64.b64decode(encoded[0],validate=True))
          assert hashlib.sha256(raw).hexdigest()=="8dd639a57f5e5b886ae3742d55bda4944c13b1a6dea9aa0b542eae03380d4a08"
          bundle=json.loads(raw)
          changes=[('len(diff["files"])==7', 'len(diff["files"])==len(candidates)'), ('feat: integrate opt-in shortcut business and guarded backup bridge', 'test: correct bridge labels and guard actual Java assertion call sites')]
          for old,new in changes:
              assert bundle["runner.py"].count(old)==1
              bundle["runner.py"]=bundle["runner.py"].replace(old,new,1)
          raw=lzma.decompress(base64.b64decode("",validate=True))
          assert hashlib.sha256(raw).hexdigest()=="cca3b6424ff2e414cc550b59d77a651c4f5381f22b76806dc7be21b48a38c6f8"
          bundle.update(json.loads(raw))
          raw=json.dumps(bundle,ensure_ascii=False,separators=(",",":")).encode()
          assert hashlib.sha256(raw).hexdigest()=="5b30ec059343dec971f7d9efa942b118337220fbfc7241766aa3fb642fa1ff30"
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"shortcut-business-payload"
          assert not folder.exists();folder.mkdir()
          for name,text in bundle.items():
              assert pathlib.Path(name).name==name
              if name.endswith(".py"):ast.parse(text)
              (folder/name).write_bytes(text.encode())
          out=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"bridge-evidence"
          out.mkdir(exist_ok=False)
          (out/"payload.json").write_bytes(raw)
          PY
      - name: Full-source RED GREEN all host gates and atomic guarded submission
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/shortcut-business-payload/label_driver.py" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/shortcut-business-payload" "$GITHUB_WORKSPACE/bridge-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: shortcut-business-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: bridge-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact readable evidence including original failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_OUTCOME: ${{ steps.integration.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/shortcut-business-payload/label_driver.py"; then
            python3 "$RUNNER_TEMP/shortcut-business-payload/label_driver.py" publish "$GITHUB_WORKSPACE/bridge-evidence"
          else
            python3 - <<'PY'
          import json,os,subprocess
          request={"name":"Shortcut business bridge delivery evidence","head_sha":os.environ["GITHUB_SHA"],"status":"completed","conclusion":"failure","external_id":os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"],"output":{"title":"SETUP_FAILED_NOT_TESTED","summary":"No integration or product submission executed; inspect original setup logs."}}
          endpoint="repos/"+os.environ["GITHUB_REPOSITORY"]+"/check-runs"
          r=subprocess.run(["gh","api","--method","POST",endpoint,"--input","-"],input=json.dumps(request),text=True,capture_output=True,timeout=60,check=True)
          made=json.loads(r.stdout)
          seen=json.loads(subprocess.check_output(["gh","api",endpoint+"/"+str(made["id"])],text=True,timeout=60))
          assert seen["conclusion"]=="failure" and seen["head_sha"]==request["head_sha"] and seen["output"]["summary"]==request["output"]["summary"]
          print("SETUP_FAILURE_RECEIPT_EXACT_READBACK",seen["html_url"])
          raise SystemExit(1)
          PY
          fi
