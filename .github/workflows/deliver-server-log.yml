name: Bounded server log delivery validation
on:
  push:
    branches: [diagnostic/server-log-delivery-20261008]
    paths: [.github/workflows/deliver-server-log.yml]
permissions:
  contents: read
concurrency:
  group: bounded-server-log-delivery-20261008
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'supercubegame/todo-pocket-android' && github.ref == 'refs/heads/diagnostic/server-log-delivery-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Require actual tracer without retry
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null 2>&1; then
            timeout 90s sudo apt-get -o Acquire::Retries=0 update
            timeout 60s sudo apt-get -o Acquire::Retries=0 install --no-install-recommends -y strace
          fi
          strace --version
      - name: Verify pinned candidate and isolated permission before product write
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import urllib.request
          
          REPO = "supercubegame/todo-pocket-android"
          BASE = "0c4f5d8707a79d4b28ff4f8ed28b12ce659e04b8"
          BRANCH = "diagnostic/server-log-delivery-20261008"
          PRODUCT = "feature/v1.2-activity-notes-ledger"
          WORKFLOW = ".github/workflows/deliver-server-log.yml"
          FILES = {
              "tools/verify_process_control.py": ("7198109c1058f7e278404cce4670c4ab6e31a879", "e900ed523d101d47052de49b94f997b8551442dc", 168785, "77fc58adb43c5f6f1f7e4b3965a0a40a7460dec17503630d9ce0c33dbcdc69a2"),
              ".github/workflows/android.yml": ("a6ed32ff2405f36ea41b0afeef98c25feb66b0ee", "a4c8e9384f88270b8562c17a3000d0cf877cd019", 125133, "c25f747aa232c76f1a87c975e88ab680fa6824d2924b186efabebb75f161b32e"),
          }
          WORKFLOWS = ("android.yml", "note-drafts.yml", "todo-management.yml", "custom-fields.yml", "category-drag.yml", "app-catalog.yml")
          PAYLOAD = ""
          
          
          def blob(data):
              return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          
          
          def exact(path, data):
              _, identity, size, sha256 = FILES[path]
              assert len(data) == size and blob(data) == identity
              assert hashlib.sha256(data).hexdigest() == sha256
          
          
          def context(env):
              assert env["GITHUB_REPOSITORY"] == REPO
              assert env["GITHUB_REF"] == "refs/heads/"+BRANCH
              assert env["GITHUB_EVENT_NAME"] == "push"
              assert env["GITHUB_RUN_ATTEMPT"] == "1", "One-shot delivery; no reruns"
          
          
          def require_base(head):
              assert head == BASE, "Product head changed; stop without writing it"
          
          
          def sequence(check, probe, verify_probe, product, verify_product, dispatch):
              check()
              probe()  # Permission refusal raises here; no fallback API or credential.
              verify_probe()
              check()
              product()
              verify_product()
              dispatch()
          
          
          def controls():
              good = {"GITHUB_REPOSITORY":REPO, "GITHUB_REF":"refs/heads/"+BRANCH,
                      "GITHUB_EVENT_NAME":"push", "GITHUB_RUN_ATTEMPT":"1"}
              context(good); require_base(BASE)
              for key in good:
                  changed=dict(good);changed[key]="wrong"
                  try: context(changed)
                  except AssertionError: pass
                  else: raise AssertionError("Context rejection missing")
              try: require_base("changed")
              except AssertionError: pass
              else: raise AssertionError("Head guard missing")
              calls=[]
              def step(name, fail=False):
                  def invoke():
                      calls.append(name)
                      if fail: raise PermissionError("synthetic refusal")
                  return invoke
              sequence(*[step(name) for name in ("check","probe","verify_probe","product","verify_product","dispatch")])
              assert calls == ["check","probe","verify_probe","check","product","verify_product","dispatch"]
              for blocked in ("probe", "verify_probe", "product", "verify_product"):
                  calls.clear()
                  try: sequence(*[step(name,name==blocked) for name in ("check","probe","verify_probe","product","verify_product","dispatch")])
                  except PermissionError: pass
                  else: raise AssertionError("Refusal swallowed")
                  assert calls[-1] == blocked and "dispatch" not in calls
                  if blocked in ("probe","verify_probe"): assert "product" not in calls
              print("DELIVERY_CONTROLS context=5 permission/order=5 PASS")
          
          
          controls()
          # LOCAL_CONTROLS_END
          context(os.environ)
          HEAD = os.environ["GITHUB_SHA"]
          ROOT = Path.cwd()
          OUT = Path(os.environ["RUNNER_TEMP"])/"server-log-delivery"
          OUT.mkdir(exist_ok=True)
          TOKEN = os.environ["GH_TOKEN"]
          receipt = {"status":"NOT_SUBMITTED", "base":BASE, "bootstrap":HEAD,
                     "diagnostic_branch":BRANCH, "product_branch":PRODUCT, "files":FILES,
                     "run":os.environ["GITHUB_RUN_ID"], "release_ready":False, "durable_upgrade_ready":False}
          
          
          def save():
              (OUT/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as stream:
                  stream.write("Status: "+receipt["status"]+"\n\n")
                  for key in ("probe_commit","product_commit"):
                      if key in receipt:
                          stream.write(key+": https://github.com/"+REPO+"/commit/"+receipt[key]+"\n\n")
          
          
          def run(args, *, data=None, env=None, timeout=30):
              value=subprocess.run(args,input=data,stdout=subprocess.PIPE,stderr=subprocess.PIPE,
                                   timeout=timeout,env=env)
              if value.returncode:
                  # Never print token, auth config or all environment values.
                  error=value.stderr.decode(errors="replace").replace(TOKEN,"[REDACTED]")
                  raise RuntimeError("command failed ("+str(value.returncode)+"): "+error[-4000:])
              return value.stdout
          
          
          def git(*args, data=None, env=None):
              return run(["git",*args],data=data,env=env).decode().strip()
          
          
          def remote(branch):
              rows=git("ls-remote","origin","refs/heads/"+branch).splitlines()
              assert len(rows)==1 and rows[0].split()[1]=="refs/heads/"+branch, "Exact ref missing"
              return rows[0].split()[0]
          
          
          def api(route, data=None, limit=1048576, raw=False):
              assert not route.startswith("/") and "://" not in route
              request=urllib.request.Request("https://api.github.com/repos/"+REPO+"/"+route,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={"Authorization":"Bearer "+TOKEN,
                           "Accept":"application/vnd.github.raw+json" if raw else "application/vnd.github+json"})
              with urllib.request.urlopen(request,timeout=30) as response:
                  body=response.read(limit+1)
              assert len(body)<=limit, "Response overflow"
              return body if raw else (json.loads(body) if body else None)
          
          
          def verify_remote(commit):
              for path in FILES:
                  raw=api("contents/"+path+"?ref="+commit,limit=FILES[path][2],raw=True)
                  exact(path,raw)
              return True
          
          
          def push(commit, branch):
              auth=base64.b64encode(("x-access-token:"+TOKEN).encode()).decode()
              env=dict(os.environ, GIT_CONFIG_COUNT="1",
                       GIT_CONFIG_KEY_0="http.https://github.com/.extraheader",
                       GIT_CONFIG_VALUE_0="AUTHORIZATION: basic "+auth)
              value=subprocess.run(["git","push","origin",commit+":refs/heads/"+branch],
                                   stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,timeout=60)
              (OUT/("push-"+("probe" if branch==BRANCH else "product")+".log")).write_text(
                  (value.stdout+value.stderr).decode(errors="replace").replace(TOKEN,"[REDACTED]").replace(auth,"[REDACTED]"))
              assert value.returncode==0, "PUSH_REFUSED: stop; no alternate transport or credential"
          
          
          def make_commit(parent, include_helper):
              index=OUT/("probe.index" if include_helper else "product.index")
              assert not index.exists()
              env=dict(os.environ,GIT_INDEX_FILE=str(index),
                       GIT_AUTHOR_NAME="github-actions[bot]",GIT_COMMITTER_NAME="github-actions[bot]",
                       GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com",
                       GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com")
              git("read-tree",parent,env=env)
              for path,(_,identity,_,_) in FILES.items():
                  assert git("hash-object","-w","--stdin",data=(ROOT/path).read_bytes())==identity
                  git("update-index","--add","--cacheinfo","100644",identity,path,env=env)
              tree=git("write-tree",env=env)
              commit=git("commit-tree",tree,"-p",parent,
                         data=b"ci: capture bounded existing ADB server log with identity guards\n",env=env)
              assert set(git("diff-tree","--no-commit-id","--name-only","-r",commit).splitlines())==set(FILES)
              helper=run(["git","ls-tree",commit,"--",WORKFLOW]).strip()
              assert bool(helper) is include_helper, "Helper must never enter product tree"
              return commit
          
          
          try:
              assert git("rev-parse","HEAD")==HEAD
              assert git("rev-parse",HEAD+"^")==BASE, "Unexpected bootstrap parent"
              assert git("diff-tree","--no-commit-id","--name-only","-r",HEAD)==WORKFLOW
              require_base(remote(PRODUCT))
              assert remote(BRANCH)==HEAD
              for path,(original,_,_,_) in FILES.items():
                  assert blob((ROOT/path).read_bytes())==original
              packed=base64.b64decode(PAYLOAD,validate=True)
              with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
                  patch=stream.read(65537)
              assert len(patch)==26186, "Unexpected patch length"
              expected_headers={"a/"+path+" b/"+path for path in FILES}
              # git apply --numstat lists paths before any application.
              listed=run(["git","apply","--numstat","-"],data=patch).decode().splitlines()
              assert {line.split("\t")[-1] for line in listed}==set(FILES) and len(listed)==2
              run(["git","apply","--check","-"],data=patch)
              run(["git","apply","-"],data=patch)
              for path in FILES: exact(path,(ROOT/path).read_bytes())
              assert set(git("diff","--name-only").splitlines())==set(FILES)
              for name in WORKFLOWS:
                  header=(ROOT/".github/workflows"/name).read_text().split("permissions:",1)[0]
                  assert "  workflow_dispatch:\n" in header, "Existing CI dispatch unavailable"
              for entry in ("selftest","connection-selftest","directory-selftest","isolated-selftest",
                            "absence-selftest","server-log-selftest","isolated-real-selftest"):
                  value=subprocess.run(["python3","tools/verify_process_control.py",entry],
                                       stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=120)
                  (OUT/(entry+".log")).write_bytes(value.stdout)
                  assert value.returncode==0, "Host gate failed: "+entry
              for path in FILES: exact(path,(ROOT/path).read_bytes())
              probe=make_commit(HEAD,True)
              product=make_commit(BASE,False)
              receipt.update(status="HOST_VERIFIED_PERMISSION_PROBE_PENDING",probe_commit=probe,product_commit=product)
              save()
              def check():
                  require_base(remote(PRODUCT))
              def probe_write():
                  assert remote(BRANCH)==HEAD
                  receipt["status"]="PROBE_PUSH_STARTED"; save()
                  push(probe,BRANCH)
              def probe_verify():
                  assert remote(BRANCH)==probe
                  verify_remote(probe)
                  receipt["status"]="ISOLATED_PERMISSION_PROBE_VERIFIED"; save()
              def product_write():
                  receipt["status"]="PRODUCT_PUSH_STARTED"; save()
                  push(product,PRODUCT)
              def product_verify():
                  assert remote(PRODUCT)==product
                  verify_remote(product)
                  receipt["status"]="PRODUCT_SUBMITTED_EXACT_REMOTE_VERIFIED"; save()
              def dispatch():
                  results=[]
                  receipt["dispatch"]=results
                  for name in WORKFLOWS:
                      assert remote(PRODUCT)==product, "Head changed before dispatch"
                      try:
                          api("actions/workflows/"+name+"/dispatches",{"ref":PRODUCT})
                          results.append({"workflow":name,"status":"ACCEPTED_NOT_COMPLETED","expected_commit":product})
                      except Exception as exc:
                          results.append({"workflow":name,"status":"FAILED","error_type":type(exc).__name__})
                      save()
                  assert all(row["status"]=="ACCEPTED_NOT_COMPLETED" for row in results), "Dispatch incomplete"
                  receipt["status"]="SUBMITTED_REMOTE_VERIFIED_CI_DISPATCH_ACCEPTED_NOT_ACCEPTANCE"; save()
              sequence(check,probe_write,probe_verify,product_write,product_verify,dispatch)
          except BaseException as exc:
              receipt["failed_stage"]=receipt["status"]
              receipt["status"]="STOPPED_NO_FALLBACK"
              receipt["error_type"]=type(exc).__name__
              receipt["error"]=str(exc).replace(TOKEN,"[REDACTED]")[-4000:]
              save()
              raise
          PY
      - name: Preserve delivery or refusal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-log-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/server-log-delivery/
          if-no-files-found: warn
