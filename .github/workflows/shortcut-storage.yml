name: Bounded original directory transport experiment
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  checks: write
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    env:
      TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2b94a08c1f4ce9245d11971cd7a6993a10e4877a
          persist-credentials: false
      - name: Materialize exact pinned experiment with tested remote quoting repair
        run: |
          python3 - <<'PY'
          import ast,base64,hashlib,json,lzma,os,pathlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/a4166c54e9094ee5d03a484b66a2be8cfd0bd471/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as response:
              original=response.read(11189)
          assert len(original)==11188 and hashlib.sha256(original).hexdigest()=="59cf9a17e5b1b8eca7bea2152bfa9f0cd2194d27a704353cc0acf78a750ce9df"
          lines=original.decode().splitlines()
          line=next(x for x in lines if x.strip().startswith("raw=lzma.decompress("))
          node=ast.parse(line.strip()).body[0].value
          raw=lzma.decompress(base64.b64decode(ast.literal_eval(node.args[0].args[0])))
          assert hashlib.sha256(raw).hexdigest()=="4f45d7eda0607a5e2a31eca1864c0b55bb16d2a04609045321ed65c01f5fea16"
          bundle=json.loads(raw)
          assert set(bundle)=={"reproduction.py","test_reproduction.py"}
          a='shell("setprop","persist.adb.trace_mask","shell sockets transport")';b='shell("setprop","persist.adb.trace_mask","\'shell sockets transport\'")'
          assert bundle["reproduction.py"].count(a)==1
          bundle["reproduction.py"]=bundle["reproduction.py"].replace(a,b)
          a='    value["command_count"]=len(value.pop("commands",[]))';b='    commands=value.pop("commands",[])\n    value["command_count"]=len(commands)\n    value["failed_commands"]=[]\n    for entry in commands:\n        if entry.get("returncode")==0 and not entry.get("timed_out"):continue\n        detail=dict(entry)\n        for name in ("stdout","stderr"):\n            info=entry.get(name)\n            if info:\n                raw=(path.parent/info["file"]).read_bytes()\n                assert ident(raw)=={k:info[k] for k in ("bytes","sha256")}\n                detail[name]=dict(info,tail=raw[-4000:].decode(errors="replace"),tail_truncated=len(raw)>4000)\n        value["failed_commands"].append(detail)'
          assert bundle["reproduction.py"].count(a)==1
          bundle["reproduction.py"]=bundle["reproduction.py"].replace(a,b)
          bundle["test_reproduction.py"]+='import shlex\ncalls=[n for n in ast.walk(main) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name)\n       and n.func.id=="shell" and n.args and isinstance(n.args[0],ast.Constant) and n.args[0].value=="setprop"]\nassert len(calls)==1\nargs=[ast.literal_eval(a) for a in calls[0].args]\nassert shlex.split(" ".join(args))==["setprop","persist.adb.trace_mask","shell sockets transport"],"REMOTE_SHELL_VALUE_SPLIT"\nprint("REMOTE_SHELL_PROPERTY single-value wire model PASS; not Android proof")\ndef remote_arguments(arguments):\n    wire=" ".join(arguments)\n    # Real POSIX shell with a fake setprop, not Android execution.\n    capture=\'setprop() { printf "%s\\\\n" "$#" "$1" "$2"; }; \'\n    p=subprocess.run(["sh","-c",capture+wire],capture_output=True,text=True,check=True)\n    return p.stdout\nassert remote_arguments(args)=="2\\npersist.adb.trace_mask\\nshell sockets transport\\n"\nmutant=list(args);mutant[-1]=shlex.split(args[-1])[0]\nassert mutant!=args and remote_arguments(mutant)=="4\\npersist.adb.trace_mask\\nshell\\n"\nassert shlex.split(" ".join(mutant))!=["setprop","persist.adb.trace_mask","shell sockets transport"]\nexercise()\nprint("REMOTE_SHELL_PROPERTY actual POSIX shell PASS; quote-removal mutant rejected; Android untested")\nimport tempfile,os,json\nfrom unittest.mock import patch\nwith tempfile.TemporaryDirectory() as temp:\n    oldcwd=os.getcwd();os.chdir(temp)\n    try:\n        evidence=Path("directory-experiment");evidence.mkdir()\n        raw=b"original setup stderr\\n"+b"x"*4100\n        (evidence/"stderr.bin").write_bytes(raw)\n        receipt={"status":"SETUP_FAILED_NOT_TESTED","commands":[\n            {"returncode":1,"stderr":dict(file="stderr.bin",**m.ident(raw))}],\n            "observations":[]}\n        (evidence/"receipt.json").write_text(json.dumps(receipt))\n        sent=[]\n        def post(*a,**kw):\n            sent.append(json.loads(kw["input"]))\n            return subprocess.CompletedProcess(a,0,\'{"id":1}\',"")\n        def get(*a,**kw):\n            return json.dumps(dict(sent[-1],url="test-only"))\n        env={"JOB_STATUS":"failure","UPLOAD_STATUS":"success","TEST_API":"26",\n             "GITHUB_SHA":"test","GITHUB_RUN_ID":"1","GITHUB_RUN_ATTEMPT":"1"}\n        with patch.dict(os.environ,env),patch.object(m.subprocess,"run",post),patch.object(m.subprocess,"check_output",get):\n            m.publish()\n        view=json.loads(sent[-1]["output"]["text"][8:-4])\n        assert view["failed_commands"][0]["stderr"]["tail"]=="x"*4000\n        assert view["failed_commands"][0]["stderr"]["tail_truncated"] is True\n        assert view["command_count"]==1 and view["observations"]==[]\n        assert sent[-1]["conclusion"]=="failure"\n        assert (evidence/"stderr.bin").read_bytes()==raw\n    finally:os.chdir(oldcwd)\nprint("SETUP_FAILURE publication actual entry PASS; full original preserved; bounded tail readable")\n'
          expected={'reproduction.py': '69418d1d9cd4894a02eb886eb5df9d4a2194051504785a791fb3ffc50ee015ca', 'test_reproduction.py': '8d4a7c11ac84d2c8ab6701e733ad026bef0d53b7fd421d2c82d4ebaa9313eddb'}
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"directory-probe"
          target.mkdir()
          (target/"original-workflow.yml").write_bytes(original)
          for name,body in bundle.items():
              assert hashlib.sha256(body.encode()).hexdigest()==expected[name],"patched diagnostic bytes differ"
              compile(body,name,"exec")
              (target/name).write_text(body)
          print("PINNED_QUOTE_REPAIR_EXACT_BYTES",expected)
          PY
          python3 "$RUNNER_TEMP/directory-probe/test_reproduction.py"
      - name: Build prerequisites without signing credentials
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          curl --fail --location https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          curl --fail --location https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install --yes strace
      - name: Existing full host contracts before device work
        run: |
          set -euo pipefail
          python3 tools/verify_process_control.py selftest
          python3 tools/verify_process_control.py server-log-selftest
          python3 tools/verify_process_control.py isolated-selftest
          python3 tools/verify_process_control.py isolated-real-selftest
          python3 tools/verify_shortcuts.py selftest
      - name: Build exact disposable source with original build guard
        env:
          BUILD_429_EXECUTE: "true"
          BUILD_LOG: diagnostic-build.log
        run: |
          set -euo pipefail
          python3 tools/verify_shortcuts.py build 2>&1 | tee diagnostic-build-driver.log
      - name: Observe at most twenty original commands and stop on first failure
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/directory-probe/reproduction.py" 2>&1 | tee diagnostic-experiment.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: directory-experiment-api-${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            directory-experiment/
            diagnostic-*.log
            shortcut-build.json
            shortcut-build.log
            ci-runtime-identity.json
            emulator.log
          if-no-files-found: error
          retention-days: 14
      - name: Publish bounded readable diagnostic receipt and verify exact readback
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          UPLOAD_STATUS: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: python3 "$RUNNER_TEMP/directory-probe/reproduction.py" publish
