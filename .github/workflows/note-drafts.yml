name: Independent note draft verification
on:
  push:
    branches: [feature/v1.2-activity-notes-ledger]
  pull_request:
    branches: [main, feature/v1.1-edit-backup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Existing draft contracts and independent report controls
        run: |
          set -euo pipefail
          python3 tools/verify_note_drafts.py selftest 2>&1 | tee draft-host.log
          python3 tools/verify_ui_observer.py selftest 2>&1 | tee -a draft-host.log
          python3 tools/verify_process_control.py connection-selftest 2>&1 | tee -a draft-host.log
          python3 - <<'PY' 2>&1 | tee -a draft-host.log
          from pathlib import Path
          import os, subprocess, textwrap
          text=Path('.github/workflows/note-drafts.yml').read_text()
          start='          # DRAFT_REPORT_BEGIN\n'
          end='          # DRAFT_REPORT_END\n'
          assert text.count(start)==text.count(end)==1
          code=textwrap.dedent(text.split(start,1)[1].split(end,1)[0])
          compile(code,'draft-report','exec')
          env=dict(os.environ,DRAFT_REPORT_SELFTEST='1')
          subprocess.run(['python3','-c',code],env=env,check=True,timeout=60)
          a='          # DRAFT_NATIVE_BEGIN\n';b='          # DRAFT_NATIVE_END\n'
          assert text.count(a)==text.count(b)==1
          native=textwrap.dedent(text.split(a,1)[1].split(b,1)[0])
          compile(native,'draft-native','exec')
          import ast
          tree=ast.parse(native)
          fixture=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='create_category_fixture']
          assert len(fixture)==1, 'fresh native fixture must create its own category'
          def exercise(node):
              scope={}
              exec(compile(ast.Module(body=[node],type_ignores=[]),'category-fixture','exec'),scope)
              calls=[]
              def capture(name):
                  return lambda *args,**kwargs:calls.append((name,args,kwargs))
              scope['create_category_fixture'](*(capture(k) for k in ('tap','fill','button','ready','find')))
              assert calls==[('tap',('新建分类',),{}),('fill',('分类名称','DraftCategory'),{}),
                  ('button',(True,),{}),('ready',(),{}),('find',(),{'text':'DraftCategory','content-desc':'category-name-1'})]
          exercise(fixture[0])
          import copy
          for index in range(5):
              mutant=copy.deepcopy(fixture[0]);del mutant.body[index]
              try:exercise(mutant)
              except AssertionError:pass
              else:raise AssertionError('missing category fixture step accepted')
          native_fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='native')
          calls=[n for n in ast.walk(native_fn) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='create_category_fixture']
          assert len(calls)==1 and [n.id for n in calls[0].args]==['tap','fill','button','ready','find']
          print('DRAFT_CATEGORY_FIXTURE host_sequence=1 compiled_omission_mutants=5 PASS; not Android execution')
          setup=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='configure_literal_input'),None)
          assert setup is not None, 'literal whitespace input requires explicit emulator punctuation setup'
          def exercise_input(node,ci='true',qemu='1',after='0',fail=False):
              scope={'os':type('Env',(),{'environ':{'GITHUB_ACTIONS':ci}})}
              exec(compile(ast.Module(body=[node],type_ignores=[]),'input-fixture','exec'),scope)
              calls=[];receipt={}
              def shell(*args):
                  calls.append(args)
                  if args==('getprop','ro.kernel.qemu'):return qemu+'\n'
                  if args==('settings','get','system','text_auto_punctuate'):
                      return ('1' if len(calls)==2 else after)+'\n'
                  assert args==('settings','put','system','text_auto_punctuate','0')
                  if fail:raise RuntimeError('injected settings failure')
                  return ''
              scope['configure_literal_input'](shell,receipt)
              return calls,receipt
          def input_contract(node):
              calls,receipt=exercise_input(node)
              assert calls==[('getprop','ro.kernel.qemu'),('settings','get','system','text_auto_punctuate'),
                  ('settings','put','system','text_auto_punctuate','0'),('settings','get','system','text_auto_punctuate')]
              assert receipt=={'scope':'DISPOSABLE_EMULATOR_INPUT_NOT_DEFAULT_KEYBOARD_ACCEPTANCE','before':'1','after':'0'}
              for kwargs in ({'ci':'false'},{'qemu':'0'},{'after':'1'},{'fail':True}):
                  try:exercise_input(node,**kwargs)
                  except (AssertionError,RuntimeError):pass
                  else:raise AssertionError('unsafe or failed input setup accepted')
          input_contract(setup)
          for index in range(len(setup.body)):
              mutant=copy.deepcopy(setup);del mutant.body[index]
              try:input_contract(mutant)
              except (AssertionError,KeyError,NameError):pass
              else:raise AssertionError(('input setup omission accepted',index))
          print('DRAFT_INPUT_FIXTURE host_positive=1 negative=4 omission_mutants='+str(len(setup.body))+' PASS; not Android execution')
          literal=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='enter_literal_text'),None)
          assert literal is not None, 'literal input needs a tested editing sequence'
          def literal_contract(node):
              scope={}
              exec(compile(ast.Module(body=[node],type_ignores=[]),'literal-edit','exec'),scope)
              for value in ('','Canonical','  Draft kept  ',' ', '  ', 'A ', 'A   ', '  A B  '):
                  text='';cursor=0;calls=[]
                  def shell(*args):
                      nonlocal text,cursor
                      calls.append(args)
                      if args==('input','keyevent','KEYCODE_MOVE_HOME'):cursor=0;return
                      assert args[:2]==('input','text') and len(args)==3
                      for char in args[2].replace('%s',' '):
                          text=text[:cursor]+char+text[cursor:];cursor+=1
                          # Independent model of the observed double-space conversion.
                          if cursor>=3 and text[cursor-2:cursor]=='  ' and text[cursor-3].isalnum():
                              text=text[:cursor-2]+'. '+text[cursor:]
                  scope['enter_literal_text'](shell,value)
                  assert text==value, (value,text,calls)
                  if value=='  Draft kept  ':
                      assert calls==[('input','text','%s%s'),('input','keyevent','KEYCODE_MOVE_HOME'),('input','text','%s%sDraft%skept')]
          literal_contract(literal)
          mutants=[]
          for path in ('suffix','home','prefix'):
              m=copy.deepcopy(literal)
              branch=next(n for n in ast.walk(m) if isinstance(n,ast.If) and len(n.body)==3)
              del branch.body[('suffix','home','prefix').index(path)];mutants.append(m)
          m=copy.deepcopy(literal);m.body=ast.parse("if value: shell('input','text',value.replace(' ','%s'))").body;mutants.append(m)
          for m in mutants:
              try:literal_contract(m)
              except AssertionError:pass
              else:raise AssertionError('broken literal editing sequence accepted')
          fills=[n for n in ast.walk(native_fn) if isinstance(n,ast.FunctionDef) and n.name=='fill'];assert len(fills)==1
          wired=[n for n in ast.walk(fills[0]) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='enter_literal_text']
          assert len(wired)==1 and [n.id for n in wired[0].args]==['shell','value']
          print('DRAFT_LITERAL_EDIT host_cases=8 compiled_mutants=4 PASS; modeled key events, Android pending')
          dump_fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='read_ui_dump')
          dump_scope={}
          exec(compile(ast.Module(body=[dump_fn],type_ignores=[]),'ui-dump','exec'),dump_scope)
          def dump_case(message,fail_read=False):
              calls=[];receipt={}
              def shell(*args):
                  calls.append(args)
                  if args[0]=='rm':return ''
                  if args[0]=='uiautomator':return message
                  assert args==('cat','/sdcard/draft-native.xml')
                  if fail_read:raise RuntimeError('missing XML')
                  return '<hierarchy/>'
              raw=dump_scope['read_ui_dump'](shell,receipt)
              assert raw=='<hierarchy/>' and receipt=={'output':message}
              assert calls==[('rm','-f','/sdcard/draft-native.xml'),('uiautomator','dump','/sdcard/draft-native.xml'),('cat','/sdcard/draft-native.xml')]
          success='UI hierchary dumped to: /sdcard/draft-native.xml\n'
          dump_case(success)
          for message,fail_read in [('',False),('ERROR: could not get idle state.',False),(success.replace('draft-native','wrong'),False),(success,True)]:
              try:dump_case(message,fail_read)
              except (AssertionError,RuntimeError):pass
              else:raise AssertionError('failed or missing UI dump accepted')
          print('DRAFT_UI_DUMP host_positive=1 negative=4 PASS; no dump retry')
          diagnostic=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='capture_draft_failure'),None)
          assert diagnostic is not None, 'native failures require bounded diagnostics before emulator teardown'
          def diagnostic_contract(node,broken_capture=False,broken_write=False):
              calls=[];saved={}
              original={'status':'FAIL','command_failure':{'returncode':255,'stdout':'','stderr':''}}
              receipt=copy.deepcopy(original)
              class Target:
                  def write_text(self,text):
                      calls.append('write')
                      if broken_write:raise OSError('write sentinel')
                      saved['text']=text
              class Folder:
                  def __truediv__(self,name):
                      assert name=='failure-diagnostics.json';return Target()
              connection_reader=object()
              def capture(adb,serial,*,host_connection_reader):
                  assert host_connection_reader is connection_reader
                  assert (adb,serial)==('adb','emulator-5554');calls.append('capture')
                  if broken_capture:raise RuntimeError('capture sentinel')
                  return {'status':'OBSERVED_NOT_ACCEPTANCE','combined_collection_budget_seconds':51}
              import json
              scope={'capture_crash_logs':capture,'capture_adb_connection':connection_reader,'json':json}
              exec(compile(ast.Module(body=[node],type_ignores=[]),'failure-diagnostic','exec'),scope)
              scope['capture_draft_failure']('adb','emulator-5554',receipt,Folder())
              assert receipt['status']==original['status'] and receipt['command_failure']==original['command_failure']
              assert calls==(['capture'] if broken_capture else ['capture','write'])
              if broken_capture or broken_write:
                  assert 'diagnostic_error' in receipt and 'failure_diagnostics_file' not in receipt
              else:
                  assert receipt.get('failure_diagnostics_file')=='failure-diagnostics.json'
                  assert json.loads(saved['text'])=={'status':'OBSERVED_NOT_ACCEPTANCE','combined_collection_budget_seconds':51}
          for args in ({},{'broken_capture':True},{'broken_write':True}):diagnostic_contract(diagnostic,**args)
          for index in (0,1,2):
              mutant=copy.deepcopy(diagnostic)
              block=next(n for n in mutant.body if isinstance(n,ast.Try))
              del block.body[index]
              try:diagnostic_contract(mutant)
              except AssertionError:pass
              else:raise AssertionError('diagnostic collection omission accepted')
          guard=next(n for n in ast.walk(native_fn) if isinstance(n,ast.Try) and n.finalbody)
          assert len(guard.handlers)==1
          handler=guard.handlers[0]
          assert isinstance(handler.type,ast.Name) and handler.type.id=='Exception'
          assert len(handler.body)==2 and isinstance(handler.body[1],ast.Raise) and handler.body[1].exc is None
          call=handler.body[0].value
          assert isinstance(call,ast.Call) and isinstance(call.func,ast.Name) and call.func.id=='capture_draft_failure'
          assert ast.unparse(call)=='capture_draft_failure(adb, gate.SERIAL, result, out)'
          for success in (False,True):
              sentinel=RuntimeError('original failure');events=[]
              def fail():raise sentinel
              def collect(*args):
                  events.append('capture')
              probe=copy.deepcopy(guard);probe.body=ast.parse('pass' if success else 'fail()').body
              probe.finalbody=ast.parse("events.append('finally')").body
              scope=dict(fail=fail,events=events,capture_draft_failure=collect,adb='adb',
                  gate=type('Gate',(),{'SERIAL':'emulator-5554'}),result={},out=None)
              try:exec(compile(ast.Module(body=[probe],type_ignores=[]),'failure-propagation','exec'),scope)
              except RuntimeError as exc:assert not success and exc is sentinel
              else:assert success, 'original native failure swallowed'
              assert events==(['finally'] if success else ['capture','finally'])
          print('DRAFT_FAILURE_DIAGNOSTICS host_cases=3 omission_mutants=3 success_and_failure_order=PASS; diagnostic only, no retry')
          append_fn=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='validate_appended_text'),None)
          assert append_fn is not None, 'new-slot UI needs an exact append oracle'
          import re
          scope={'copy':copy,'re':re}
          exec(compile(ast.Module(body=[append_fn],type_ignores=[]),'append-oracle','exec'),scope)
          before=({'blocks':[(1,'note','old',0,'TEXT','Committed',None,'',0,None),
              (2,'note','image',1,'IMAGE','', 'asset','caption',0,None)],
              'revision':[(1,1,7)],'notes':[(1,'note',1,'Title')]},{'asset':'hash'})
          after=copy.deepcopy(before);newid='12345678-1234-4123-8123-123456789abc'
          after[0]['blocks'].append((3,'note',newid,2,'TEXT','Appended draft',None,'',0,None))
          after[0]['revision']=[(1,1,8)]
          assert scope['validate_appended_text'](before,after,'note')==newid
          bad=[]
          for table,rows in after[0].items():
              for i,row in enumerate(rows):
                  for j,value in enumerate(row):
                      w=copy.deepcopy(after);changed=list(w[0][table][i]);changed[j]='wrong';w[0][table][i]=tuple(changed);bad.append(w)
          w=copy.deepcopy(after);w[1]['asset']='changed';bad.append(w)
          w=copy.deepcopy(after);w[0]['blocks'].pop();bad.append(w)
          w=copy.deepcopy(after);w[0]['blocks'].append(w[0]['blocks'][-1]);bad.append(w)
          for w in bad:
              try:scope['validate_appended_text'](before,w,'note')
              except (AssertionError,TypeError,ValueError):pass
              else:raise AssertionError('invalid append state accepted')
          print('DRAFT_APPEND_ORACLE host_positive=1 negative='+str(len(bad))+' PASS; SQLite device execution pending')
          restart_fn=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='restart_new_slot'),None)
          assert restart_fn is not None, 'new text slot needs explicit restart acceptance'
          def restart_contract(node,has_draft=True,fault=None):
              events=[];expected_files={'slot':b'exact'};expected_state=('tables','media')
              def stop():
                  events.append('stop')
                  if fault=='stop':raise RuntimeError('stop sentinel')
                  return {'before':{'returncode':True if fault=='bool-code' else 1 if fault=='absent' else 0,
                      'stdout':'' if fault=='pid' else '123\n','stderr':'error' if fault=='stderr' else ''}}
              def reopen():events.append('reopen')
              def tap(value):events.append(('tap',value))
              def status(value):events.append(('status',value))
              def seek(desc):
                  events.append(('seek',desc))
                  if desc=='文字内容':return {'text':'restored' if fault=='autorestore' else ''}
                  assert desc=='note-draft-recover'
                  return {'enabled':str(not has_draft if fault=='enabled' else has_draft).lower()}
              def drafts():
                  events.append('drafts');return {} if fault=='files' else expected_files
              def state():
                  events.append('state');return ('changed','media') if fault=='state' else expected_state
              scope={'re':re}
              exec(compile(ast.Module(body=[node],type_ignores=[]),'new-slot-restart','exec'),scope)
              receipt=scope['restart_new_slot'](stop,reopen,tap,status,seek,drafts,state,expected_files,expected_state,has_draft)
              if fault is None:
                  assert receipt=={'before':{'returncode':0,'stdout':'123\n','stderr':''}}
                  assert events==['stop','reopen',('tap','加入文字'),
                      ('status','发现本机草稿，请明确恢复；当前仍显示正文。' if has_draft else '暂无已保存草稿；正文不能为空。'),
                      ('seek','文字内容'),('seek','note-draft-recover'),'drafts','state']
          def restart_suite(node):
              for has_draft in (True,False):
                  restart_contract(node,has_draft)
                  for fault in ('stop','autorestore','enabled','files','state','bool-code','absent','pid','stderr'):
                      try:restart_contract(node,has_draft,fault)
                      except (AssertionError,RuntimeError):pass
                      else:raise AssertionError('restart fault accepted '+fault)
          restart_suite(restart_fn)
          # Recompile omissions of every observable step; compilation failure is not a pass.
          for index in range(2,len(restart_fn.body)-1):
              mutant=copy.deepcopy(restart_fn);del mutant.body[index]
              ast.fix_missing_locations(mutant)
              try:restart_suite(mutant)
              except AssertionError:pass
              else:raise AssertionError('restart omission survived '+str(index))
          restart_calls=[n for n in ast.walk(native_fn) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='restart_new_slot']
          assert len(restart_calls)==2 and [n.args[-1].value for n in restart_calls]==[True,False]
          print('DRAFT_NEW_SLOT_RESTART host_positive=2 negative=18 omission_controls=PASS; not Android execution')
          same_fn=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='validate_same_title_fixture'),None)
          file_fn=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='new_draft_file'),None)
          assert same_fn is not None and file_fn is not None, 'same-title native draft isolation needs exact oracles'
          def same_contract(node):
              scope={'copy':copy,'re':re}
              exec(compile(ast.Module(body=[node],type_ignores=[]),'same-title-oracle','exec'),scope)
              before=({'notes':[(1,'first',7,'DraftNative')],'revision':[(1,1,8)],
                  'blocks':[(1,'first','block',0,'TEXT','Committed')],'other':[(1,'keep')]},{'image':'exact'})
              after=copy.deepcopy(before);identity='12345678-1234-4123-8123-123456789abc'
              after[0]['notes'].append((2,identity,7,'DraftNative'));after[0]['revision']=[(1,1,9)]
              assert scope['validate_same_title_fixture'](before,after,'first')==identity
              bad=[]
              for table,rows in after[0].items():
                  for i,row in enumerate(rows):
                      for j in range(len(row)):
                          w=copy.deepcopy(after);changed=list(row);changed[j]='wrong';w[0][table][i]=tuple(changed);bad.append(w)
              w=copy.deepcopy(after);w[1]['image']='changed';bad.append(w)
              w=copy.deepcopy(after);w[0]['notes'].pop();bad.append(w)
              w=copy.deepcopy(after);w[0]['notes'].append(w[0]['notes'][-1]);bad.append(w)
              w=copy.deepcopy(after);w[0]['notes'][1]=(2,'first',7,'DraftNative');bad.append(w)
              for w in bad:
                  try:scope['validate_same_title_fixture'](before,w,'first')
                  except (AssertionError,IndexError,KeyError,TypeError):pass
                  else:raise AssertionError('same-title fixture mutation accepted')
              return len(bad)
          same_count=same_contract(same_fn)
          def file_contract(node):
              scope={}
              exec(compile(ast.Module(body=[node],type_ignores=[]),'draft-file-oracle','exec'),scope)
              before={'old':b'old','other':b'other'};after=dict(before,new=b'draft')
              assert scope['new_draft_file'](before,after)=='new'
              bad=[dict(after,old=b'changed'),dict(after,other=b'changed'),before,
                  dict(after,extra=b'x'),{'new':b'draft'},dict(after,new=b'')]
              for w in bad:
                  try:scope['new_draft_file'](before,w)
                  except AssertionError:pass
                  else:raise AssertionError('draft file isolation mutation accepted')
              return len(bad)
          file_count=file_contract(file_fn)
          # Mutate the actual compiled oracle, not a separately reimplemented checker.
          for node,contract in ((same_fn,same_contract),(file_fn,file_contract)):
              mutant=copy.deepcopy(node)
              mutant.body=[n for n in mutant.body if not isinstance(n,ast.Assert)]
              ast.fix_missing_locations(mutant)
              try:contract(mutant)
              except AssertionError:pass
              else:raise AssertionError('unguarded same-title oracle survived')
          print('DRAFT_SAME_TITLE host_positive=2 negative='+str(same_count+file_count)+' compiled_mutants=2 PASS; not Android execution')
          twin_restart=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='restart_twins'),None)
          assert twin_restart is not None, 'same-title restart must verify discarded and surviving slots'
          def twin_restart_contract(node,fault=None):
              events=[];selected=0;recovered=False
              expected_files={'first':b'tombstone','second':b'exact draft'}
              expected_state=({'notes':['first','second'],'revision':[9]},{'image':'exact'})
              def stop():
                  events.append('stop')
                  if fault=='stop':raise RuntimeError('original stop failure')
                  return {'before':dict(returncode=True if fault=='bool-code' else 0,
                      stdout='' if fault=='absent' else '123\n',stderr='error' if fault=='stderr' else '')}
              def reopen():events.append('reopen')
              def choose(index):
                  nonlocal selected
                  selected=index;events.append(('choose',index))
              def record(name):return lambda *args:events.append((name,)+args)
              def touch(desc):
                  nonlocal recovered
                  events.append(('touch',desc));recovered=True
              def seek(desc):
                  events.append(('seek',desc))
                  if desc=='文字内容':
                      return {'text':('wrong' if fault=='wrong-recovery' else '  Second note draft  ') if recovered else
                          ('auto' if fault=='autorestore' else '')}
                  assert desc in ('note-draft-recover','note-draft-discard')
                  enabled=selected==2
                  if fault=='enabled-'+str(selected):enabled=not enabled
                  return {'enabled':str(enabled).lower()}
              def drafts():
                  events.append('drafts');return {} if fault=='files-'+str(selected) else expected_files
              def state():
                  events.append('state');return None if fault=='state-'+str(selected) else expected_state
              scope={'re':re}
              exec(compile(ast.Module(body=[node],type_ignores=[]),'twin-restart','exec'),scope)
              receipt=scope['restart_twins'](stop,reopen,choose,record('tap'),record('status'),seek,
                  touch,record('button'),record('ready'),record('confirm'),drafts,state,
                  expected_files,expected_state,record('ok'))
              if fault is None:
                  assert receipt=={'before':dict(returncode=0,stdout='123\n',stderr='')}
                  assert events==['stop','reopen',('choose',1),('tap','加入文字'),
                      ('status','暂无已保存草稿；正文不能为空。'),('seek','文字内容'),
                      ('seek','note-draft-recover'),('seek','note-draft-discard'),'drafts','state',
                      ('ok','same_title_restart_discarded'),('button',False),('ready',),('choose',2),
                      ('tap','加入文字'),('status','发现本机草稿，请明确恢复；当前仍显示正文。'),
                      ('seek','文字内容'),('seek','note-draft-recover'),('seek','note-draft-discard'),
                      ('touch','note-draft-recover'),('confirm',),('button',True),
                      ('status','已恢复到输入框；点击保存才会修改正文。'),('seek','文字内容'),
                      'drafts','state',('ok','same_title_restart_sibling_recovered')]
          def twin_restart_suite(node):
              twin_restart_contract(node)
              faults=('stop','bool-code','absent','stderr','autorestore','wrong-recovery',
                  'enabled-1','enabled-2','files-1','files-2','state-1','state-2')
              for fault in faults:
                  try:twin_restart_contract(node,fault)
                  except (AssertionError,RuntimeError):pass
                  else:raise AssertionError('same-title restart accepted '+fault)
          twin_restart_suite(twin_restart)
          mutants=0
          for index,node in enumerate(twin_restart.body):
              if not isinstance(node,(ast.Assert,ast.Expr)):continue
              mutant=copy.deepcopy(twin_restart);del mutant.body[index];ast.fix_missing_locations(mutant)
              try:twin_restart_suite(mutant)
              except AssertionError:pass
              else:raise AssertionError('same-title restart omission survived '+str(index))
              mutants+=1
          calls=[n for n in ast.walk(native_fn) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='restart_twins']
          assert len(calls)==1
