      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: verified-backup-delivery
          path: ${{ runner.temp }}/backup-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Publish bound delivery summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
        run: python3 "$RUNNER_TEMP/deliver-accepted.py" publish "$RUNNER_TEMP/backup-delivery"
