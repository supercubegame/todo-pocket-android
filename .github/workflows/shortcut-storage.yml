name: Read-only original API26 failure extraction
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Extract one pinned original archive without running device tests
        id: extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          raw = lzma.decompress(base64.b64decode(""))
          assert hashlib.sha256(raw).hexdigest() == "5a6028d173dcd4902680dd6edd6ba39bb3abb9848c78d6a6d9278a31ef6d929f"
          pathlib.Path("extract_original.py").write_bytes(raw)
          PY
          python3 extract_original.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: original-2b94-api26-${{ github.run_id }}-${{ github.run_attempt }}
          path: failure-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish bounded exact-readback evidence checks
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRACT_OUTCOME: ${{ steps.extraction.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: python3 extract_original.py publish
