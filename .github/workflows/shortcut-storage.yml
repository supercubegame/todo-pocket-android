name: Verified synthetic chooser tile delivery
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions: {contents: write, actions: write, checks: write}
concurrency: {group: shortcut-business-bridge-delivery, cancel-in-progress: false}
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: reviewed, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 3e7218d3c654f8425b199e7f5bbc5946ac8bd261, path: product, persist-credentials: false}
      - name: Bind reviewable patch to exact original and resulting test file
        env:
          ORIGINAL_DRIVER_SHA: cc83f9374afd35c87252fe189c6ea7afaf7e985cc8eb9a9c9dc48ffca3fed58c
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          test "$(git -C reviewed rev-parse HEAD)" = "$GITHUB_SHA"
          cp reviewed/ci-review/chooser-tile-3e7218d.patch "$RUNNER_TEMP/chooser-tile.patch"
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          import urllib.request,textwrap,hashlib
          u='https://raw.githubusercontent.com/supercubegame/todo-pocket-android/4a5ce09fac1cf2e3c9473f05fb2d7dd7d4abb710/.github/workflows/shortcut-storage.yml'
          b=urllib.request.urlopen(u,timeout=60).read(7084);assert len(b)==7083 and hashlib.sha256(b).hexdigest()=='308cc48f0f64c58495260e1e0c469111d228de07bb1f0d56d6bba7b34ad60c4d';code=textwrap.dedent(b.decode().split("          python3 - <<'PY'\n",1)[1].split('          PY\n',1)[0]);exec(compile(code,'pinned-restore','exec'),{})
          PY
          cat > repair.py <<'PY'
          from pathlib import Path
          import hashlib,subprocess,tempfile
          BASE='3e7218d3c654f8425b199e7f5bbc5946ac8bd261'
          P='tools/verify_paged_exports.py'
          PINS={P:'6bae4e59c85cfbf93bbae037e091e2ba0d9160f9'}
          def blob(b):return hashlib.sha1(b'blob %d\0'%len(b)+b).hexdigest()
          def candidates(root):
              f=Path(root)/P;b=f.read_bytes();assert f.is_file() and not f.is_symlink() and blob(b)==PINS[P]
              patch=Path(__file__).with_name('chooser-tile.patch').read_bytes();assert len(patch)==17990 and hashlib.sha256(patch).hexdigest()=='de6362c93c7585eb7a464c30b66efa0fe4fae755db7c93bba37b50053802f1a6'
              with tempfile.TemporaryDirectory() as tmp:
                  path=Path(tmp)/P;path.parent.mkdir(parents=True);path.write_bytes(b)
                  for args in (['--check'],[]):subprocess.run(['git','apply',*args,'-'],cwd=tmp,input=patch,check=True,timeout=30)
                  assert [x.relative_to(tmp).as_posix() for x in Path(tmp).rglob('*') if x.is_file()]==[P] and not path.is_symlink()
                  final=path.read_bytes();assert blob(final)=='dea8bd8f4a79da08908b11908f8bc91bce06e6d5';return {P:final}
          PY
          python3 - <<'PY'
          import repair,os
          from pathlib import Path
          repair.candidates(Path(os.environ['GITHUB_WORKSPACE'])/'product');p=Path('prepare.py');s=p.read_text()
          for a,b in [('APPROVED_SHARE_BLOCK_ORDER_FIX','ISOLATED_CHOOSER_TILE_CONTRACT'),('test: compare share block rows by identity not rowid order','test: choose only the unique stable synthetic receiver tile'),('Share block order delivery','Isolated chooser tile delivery')]:
              assert s.count(a)==1;s=s.replace(a,b)
          p.write_text(s)
          PY
          python3 prepare.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test-deliver-accepted.py');s=p.read_text();i=s.index('patch.object(repair,"candidates",return_value=');j=s.index('),patch.object(m,"device_evidence"',i);p.write_text(s[:i]+'patch.object(repair,"candidates",return_value=data'+s[j:])
          PY
          python3 test-deliver-accepted.py
      - name: Original 21 once, exact product commit, same-ref device dispatch
        id: delivery
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 "$RUNNER_TEMP/deliver-accepted.py" "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP/chooser-delivery"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: chooser-tile-delivery
          path: ${{ runner.temp }}/chooser-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Publish bound delivery result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
        run: python3 "$RUNNER_TEMP/deliver-accepted.py" publish "$RUNNER_TEMP/chooser-delivery"
