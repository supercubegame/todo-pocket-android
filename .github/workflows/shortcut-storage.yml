name: Recover original business bridge red evidence
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify original artifact and retain failure log
        id: extract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,os,pathlib,subprocess,traceback,zipfile
          assert os.environ['GITHUB_REF']=='refs/heads/ci/shortcut-storage-preflight-4d8742'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          out=pathlib.Path('bridge-recovered');out.mkdir()
          def gh(path):
              return subprocess.run(['gh','api',path],capture_output=True,timeout=60)
          receipt={'status':'NOT_EXECUTED','product_pushes':0,'test_reruns':0}
          try:
              meta=gh('repos/supercubegame/todo-pocket-android/actions/artifacts/11692823592');meta.check_returncode();m=json.loads(meta.stdout)
              assert m['id']==11692823592 and m['size_in_bytes']==63816 and m['digest']=='sha256:a35fa3eb375bf05d63461341509f9c149fe85825cb7869f8435efbfcc3128648'
              assert m['workflow_run']['id']==38115514666 and m['workflow_run']['head_sha']=='abd36b0e9c5c1c4e6d0483f9fd8e29900d6e4c4b' and not m['expired']
              archive=gh('repos/supercubegame/todo-pocket-android/actions/artifacts/11692823592/zip');archive.check_returncode();raw=archive.stdout
              (out/'original.zip').write_bytes(raw)
              assert len(raw)==63816 and hashlib.sha256(raw).hexdigest()=='a35fa3eb375bf05d63461341509f9c149fe85825cb7869f8435efbfcc3128648'
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  names=z.namelist();assert len(names)==len(set(names)) and len(names)<30
                  assert sum(x.file_size for x in z.infolist())<4000000
                  assert all(not n.startswith('/') and '..' not in n.split('/') and '\\' not in n for n in names)
                  original=z.read('receipt.json');(out/'original-receipt.json').write_bytes(original);value=json.loads(original)
                  assert value['status']=='EXPECTED_RED_WITNESSED_PRODUCT_UNCHANGED' and value['product_pushes']==0 and value['device_execution'] is False
                  assert value['source']=='2b94a08c1f4ce9245d11971cd7a6993a10e4877a' and value['source_blob']=='66d471173f255b50a795b5997e19960343f988a5'
                  assert value['returncode']!=0 and 'LEGACY_2_3_BEHAVIOR_WITNESS' in value['stdout'] and 'BRIDGE_SCHEMA4_REJECTED' in value['stderr']
                  constraints=value.pop('old_host_constraints');value['constraint_count']=len(constraints);value['constraint_preview']=[];budget=24000
                  for item in constraints:
                      entry=dict(file=item['file'],line=item['line'],context=item['context'][:1200],context_truncated=len(item['context'])>1200,full_context_sha256=hashlib.sha256(item['context'].encode()).hexdigest())
                      size=len(json.dumps(entry,ensure_ascii=False).encode())
                      if size>budget:break
                      value['constraint_preview'].append(entry);budget-=size
                  value['constraint_preview_omitted']=len(constraints)-len(value['constraint_preview'])
                  value['presentation_bounded']=any(x['context_truncated'] for x in value['constraint_preview']) or value['constraint_preview_omitted']>0
                  # Exact full source is retained in the original ZIP, not rebuilt from displayed excerpts.
                  for name,expected in [('AppDatabase.java','66d471173f255b50a795b5997e19960343f988a5'),('Schema3Store.java','99d748cbc08fe2f122ec6cd16d2a36dac3f1edf3')]:
                      b=z.read(name);assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==expected
                  value['archive_sha256']=hashlib.sha256(raw).hexdigest();value['original_receipt_bytes']=len(original)
              logs=gh('repos/supercubegame/todo-pocket-android/actions/jobs/114399519684/logs')
              (out/'original-job-log.stdout').write_bytes(logs.stdout);(out/'original-job-log.stderr').write_bytes(logs.stderr)
              value['original_job_log']={'returncode':logs.returncode,'bytes':len(logs.stdout),'sha256':hashlib.sha256(logs.stdout).hexdigest(),'tail':logs.stdout[-8000:].decode(errors='replace'),'tail_truncated':len(logs.stdout)>8000,'stderr':logs.stderr[-2000:].decode(errors='replace')}
              receipt.update(status='ORIGINAL_RED_RECOVERED_NOT_CANDIDATE_ACCEPTANCE',original=value)
          except BaseException:
              receipt.update(status='EXTRACTION_FAILED',error=traceback.format_exc())
          finally:
              (out/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2))
              print(json.dumps(receipt,ensure_ascii=False,indent=2))
          assert receipt['status']=='ORIGINAL_RED_RECOVERED_NOT_CANDIDATE_ACCEPTANCE'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        id: evidence
        with:
          name: recovered-business-bridge-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: bridge-recovered/
          if-no-files-found: error
          retention-days: 14
      - name: Publish bounded original evidence and verify exact readback
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          p=pathlib.Path('bridge-recovered/receipt.json');value=json.loads(p.read_text()) if p.exists() else {'status':'NOT_EXECUTED'}
          value.update(artifact_url=os.environ.get('ARTIFACT_URL'),artifact_digest=os.environ.get('ARTIFACT_DIGEST'))
          body=json.dumps(value,ensure_ascii=False,indent=2);assert len(body.encode())<60000
          ok=value['status']=='ORIGINAL_RED_RECOVERED_NOT_CANDIDATE_ACCEPTANCE' and os.environ['EXTRACT_OUTCOME']=='success' and os.environ['UPLOAD_OUTCOME']=='success'
          request={'name':'Recovered shortcut business bridge red evidence','head_sha':os.environ['GITHUB_SHA'],'external_id':os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],'status':'completed','conclusion':'neutral' if ok else 'failure','output':{'title':value['status'],'summary':'Read-only original evidence recovery. No product changes, candidate host acceptance, test reruns or Android execution.','text':'```json\n'+body+'\n```'}}
          endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/check-runs'
          r=subprocess.run(['gh','api','--method','POST',endpoint,'--input','-'],input=json.dumps(request),text=True,capture_output=True,timeout=60,check=True)
          made=json.loads(r.stdout);seen=json.loads(subprocess.check_output(['gh','api',endpoint+'/'+str(made['id'])],text=True,timeout=60))
          assert seen['head_sha']==request['head_sha'] and seen['external_id']==request['external_id'] and seen['conclusion']==request['conclusion']
          assert all(seen['output'][k]==v for k,v in request['output'].items())
          print('ORIGINAL_RED_RECOVERY_EXACT_READBACK',seen['html_url'])
          if not ok:raise SystemExit(1)
          PY
