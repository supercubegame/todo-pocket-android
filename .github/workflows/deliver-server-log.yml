name: Original summary navigation frame probe
on:
  push:
    branches: [diagnostic/server-log-delivery-20261008]
    paths: [.github/workflows/deliver-server-log.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: bounded-server-log-delivery-20261008
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'supercubegame/todo-pocket-android' && github.ref == 'refs/heads/diagnostic/server-log-delivery-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read original failed frame without rerunning devices or publishing product
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, re, urllib.error, urllib.parse, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          
          REPO = "supercubegame/todo-pocket-android"
          PRODUCT = "f0354a13c8f739d8d082b01944aa74efffd6db52"
          BRANCH = "diagnostic/server-log-delivery-20261008"
          PARENT = "8a951aee542a93b7f501916d74af618ba26599b6"
          ARTIFACT = 11556106491
          DIGEST = "968f71d63b380539385ba806be49f7ae4cd3685ab4195353cfa2f491544c1f65"
          
          def inspect_archive(data):
              assert len(data) == 667622 and hashlib.sha256(data).hexdigest() == DIGEST
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  entries = z.infolist()
                  assert len(entries) <= 300 and sum(e.file_size for e in entries) <= 32000000
                  names = [e.filename for e in entries]
                  assert len(set(names)) == len(names)
                  for e in entries:
                      assert not e.filename.startswith("/") and "\\" not in e.filename
                      assert all(s not in ("..", "") for s in e.filename.rstrip("/").split("/"))
                      assert e.file_size <= 8000000 and not e.flag_bits & 1
                      assert (e.external_attr >> 16) & 0o170000 != 0o120000
                  native_raw = z.read("native-ui/native-result.json")
                  assert hashlib.sha256(native_raw).hexdigest() == "c91ca7d3a549480860c3a446a9661826f5a4f79ecf65d143e1dee29023f716b3"
                  native = json.loads(native_raw)
                  assert native["api"] == 34 and native["status"] == "FAIL" and native["count"] == 66
                  assert native["error"] == "AssertionError('summary identity absent after bounded scroll: note-activity-1')"
                  paths = [n for n in names if n.endswith("observer-last.xml") and "/full-observer/" in n]
                  assert len(paths) == 1, repr(paths)
                  xml = z.read(paths[0])
                  assert 0 < len(xml) <= 2000000
                  frame = list(ET.fromstring(xml).iter("node"))
                  view = [n.attrib for n in frame if n.get("content-desc") == "activity-details-scroll"]
                  selected = [n.attrib for n in frame if n.get("content-desc") or n.get("scrollable") == "true"]
                  value = dict(status="ORIGINAL_EVIDENCE_ONLY_NOT_REPAIR_ACCEPTANCE", product=PRODUCT,
                               run=37787550835, artifact=ARTIFACT, artifact_sha256=DIGEST,
                               original_error=native["error"], count=native["count"],
                               xml_path=paths[0], xml_bytes=len(xml), xml_sha256=hashlib.sha256(xml).hexdigest(),
                               viewport=view, nodes=selected, root=frame[0].attrib,
                               observer=native.get("full_native_observer"))
                  return value
          
          def main():
              assert os.environ["GITHUB_REPOSITORY"] == REPO
              assert os.environ["GITHUB_REF"] == "refs/heads/" + BRANCH
              assert os.environ["GITHUB_EVENT_NAME"] == "push" and os.environ["GITHUB_RUN_ATTEMPT"] == "1"
              token = os.environ["GH_TOKEN"]
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs): return None
              opener = urllib.request.build_opener(NoRedirect())
              def request(path):
                  assert not path.startswith("/") and ".." not in path and "://" not in path
                  return urllib.request.Request("https://api.github.com/repos/" + REPO + "/" + path,
                                                headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"})
              def api(path):
                  with opener.open(request(path), timeout=30) as r: data = r.read(2000001)
                  assert len(data) <= 2000000
                  return json.loads(data)
              head = os.environ["GITHUB_SHA"]
              assert api("git/ref/heads/" + BRANCH)["object"]["sha"] == head
              assert [p["sha"] for p in api("git/commits/" + head)["parents"]] == [PARENT]
              assert api("git/ref/heads/feature/v1.2-activity-notes-ledger")["object"]["sha"] == PRODUCT
              meta = api("actions/artifacts/" + str(ARTIFACT))
              assert meta["id"] == ARTIFACT and meta["name"] == "database-api-34" and meta["expired"] is False
              assert meta["workflow_run"]["id"] == 37787550835 and meta["workflow_run"]["head_sha"] == PRODUCT
              assert meta["digest"] == "sha256:" + DIGEST and meta["size_in_bytes"] == 667622
              run = api("actions/runs/37787550835")
              assert run["head_sha"] == PRODUCT and run["run_attempt"] == 1 and run["status"] == "completed"
              try:
                  response = opener.open(request("actions/artifacts/" + str(ARTIFACT) + "/zip"), timeout=30)
              except urllib.error.HTTPError as e:
                  assert e.code == 302
                  url = e.headers["Location"]
              else:
                  response.close()
                  raise AssertionError("expected signed artifact redirect")
              parsed = urllib.parse.urlsplit(url)
              assert parsed.scheme == "https" and parsed.hostname.endswith(".blob.core.windows.net")
              assert not parsed.username and not parsed.password and parsed.port in (None, 443)
              with opener.open(urllib.request.Request(url), timeout=30) as r: data = r.read(667623)
              value = inspect_archive(data)
              assert api("git/ref/heads/feature/v1.2-activity-notes-ledger")["object"]["sha"] == PRODUCT
              text = json.dumps(value, ensure_ascii=False, separators=(",", ":"))
              assert len(text.encode()) <= 48000, "diagnostic refuses truncation"
              print("::notice title=Original API34 navigation frame::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("## Original frame only, no product change or device rerun\n```json\n" + text + "\n```\n")
          
          if __name__ == "__main__": main()
          PY
