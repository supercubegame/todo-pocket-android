name: Independent todo management verification
on:
  push:
    branches: [feature/v1.2-activity-notes-ledger]
  pull_request:
    branches: [main, feature/v1.1-edit-backup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  todo_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Fail-closed receipt and Java syntax controls
        run: |
          set -euo pipefail
          python3 tools/verify_todo_management.py selftest 2>&1 | tee todo-host.log
      - name: Native receipt controls and independent state oracle
        run: &todo_native_gate |
          set -euo pipefail
          cat > "$RUNNER_TEMP/todo-native-gate.py" <<'PY'
          import copy,hashlib,inspect,json,os,re,subprocess,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,str(Path("tools").resolve()))
          import verify_todo_management as backend
          LABELS={
           "seed":"fresh_ui_database ui_created_same_title_completed exact_confirmation_identity explicit_undo_limit preview_all_state_readonly cancel_all_state_readonly cancel_preserves_composer delete_exact_all_tables_media delete_preserves_composer undo_exact_identity_done_position_rowid undo_single_use_and_composer second_delete_exact navigation_invalidates_undo_readonly deleted_restart_checkpoint".split(),
           "deleted":"deleted_restart_state restart_has_no_undo second_identity_delete_undo edit_cancel_fixture_created edit_open_invalidates_undo_controls edit_cancel_readonly edit_cancel_preserves_composer edit_cancel_stale_undo_readonly order_fixture order_forward order_backward order_noop_readonly order_stale_readonly order_duplicate_readonly order_null_readonly order_missing_readonly order_bounds_readonly order_outer_readonly order_late_rollback order_delete_undo order_checkpoint ui_order_fixture ui_order_boundaries_readonly ui_order_down_once ui_order_stale_callbacks_readonly ui_order_up ui_order_composer ui_order_pending_readonly ui_order_completed_readonly ui_order_navigation_readonly ui_order_failure_rollback_readonly ui_order_failed_callbacks_readonly ui_order_recovery ui_order_checkpoint undone_restart_checkpoint".split(),
           "undone":"undone_restart_state undone_restart_no_replay order_restart order_backup ui_order_restart ui_order_backup".split(),
          }
          SCOPE="ACTUAL_NATIVE_WIDGET_CALLBACKS_WITH_TODO_ORDER_BUTTONS_AND_BACKEND_NOT_PHYSICAL_TOUCH_OR_LMK"
          # The emission list and acceptance list are deliberately independent.
          ACCEPTED="fresh_ui_database ui_created_same_title_completed exact_confirmation_identity explicit_undo_limit preview_all_state_readonly cancel_all_state_readonly cancel_preserves_composer delete_exact_all_tables_media delete_preserves_composer undo_exact_identity_done_position_rowid undo_single_use_and_composer second_delete_exact navigation_invalidates_undo_readonly deleted_restart_checkpoint deleted_restart_state restart_has_no_undo second_identity_delete_undo edit_cancel_fixture_created edit_open_invalidates_undo_controls edit_cancel_readonly edit_cancel_preserves_composer edit_cancel_stale_undo_readonly order_fixture order_forward order_backward order_noop_readonly order_stale_readonly order_duplicate_readonly order_null_readonly order_missing_readonly order_bounds_readonly order_outer_readonly order_late_rollback order_delete_undo order_checkpoint ui_order_fixture ui_order_boundaries_readonly ui_order_down_once ui_order_stale_callbacks_readonly ui_order_up ui_order_composer ui_order_pending_readonly ui_order_completed_readonly ui_order_navigation_readonly ui_order_failure_rollback_readonly ui_order_failed_callbacks_readonly ui_order_recovery ui_order_checkpoint undone_restart_checkpoint undone_restart_state undone_restart_no_replay order_restart order_backup ui_order_restart ui_order_backup".split()
          JAVA = r'''
          package ci.todos;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.database.*;
          import android.database.sqlite.*;
          import android.graphics.Rect;
          import android.view.*;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.*;
          import com.supercubegame.pockettodo.AppDatabase;
          import java.lang.reflect.*;
          import java.nio.file.*;
          import java.util.*;
          
          public final class TodoInstrumentation extends Instrumentation {
           Bundle args;Activity activity;Object screen;int count;String nonce,phase;Path folder;
           interface Action{void run()throws Exception;}
           static void need(boolean b,String s){if(!b)throw new AssertionError(s);}
           void pass(boolean b,String s){need(b,s);count++;System.out.println("TODO_PASS "+s);}
           static Object field(Object o,String name)throws Exception{Field f=o.getClass().getDeclaredField(name);f.setAccessible(true);return f.get(o);}
           void ui(Action a)throws Exception{
            final Throwable[] error={null};runOnMainSync(()->{try{a.run();}catch(Throwable e){error[0]=e;}});
            if(error[0]!=null)throw new AssertionError("UI action",error[0]);
           }
           void ready()throws Exception{
            long deadline=SystemClock.elapsedRealtime()+10000;
            while(true){
             final boolean[] done={false};ui(()->done[0]=!((Boolean)field(screen,"busy")));
             if(done[0]){waitForIdleSync();return;}
             need(SystemClock.elapsedRealtime()<deadline,"UI async deadline");SystemClock.sleep(20);
            }
           }
           void launch()throws Exception{
            Intent intent=new Intent().setClassName(getTargetContext(),"com.supercubegame.pockettodo.MainActivity").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
            activity=startActivitySync(intent);screen=field(activity,"screen");ready();
           }
           View root(){return activity.getWindow().getDecorView();}
           View unique(View root,String value,boolean description){
            List<View> out=new ArrayList<>();find(root,value,description,out);
            need(out.size()==1,"unique view "+value+" count="+out.size());return out.get(0);
           }
           void find(View v,String value,boolean description,List<View> out){
            if(description?value.contentEquals(v.getContentDescription()==null?"":v.getContentDescription()):
               v instanceof TextView&&value.contentEquals(((TextView)v).getText()))out.add(v);
            if(v instanceof ViewGroup){ViewGroup g=(ViewGroup)v;for(int i=0;i<g.getChildCount();i++)find(g.getChildAt(i),value,description,out);}
           }
           void click(View root,String value,boolean description)throws Exception{
            ui(()->{View v=unique(root,value,description);Rect r=new Rect();
             need(v.isEnabled()&&v.isShown()&&v.getGlobalVisibleRect(r)&&r.width()>0&&r.height()>0,"clickable "+value);
             clickOnce(v,value);
            });ready();
           }
           static void clickOnce(View v,String value){
            if(v instanceof CheckBox){
             CheckBox box=(CheckBox)v;boolean before=box.isChecked();
             box.performClick();
             need(box.isChecked()!=before,"checkbox toggled "+value);
            }else{
             need(v.performClick(),"click handled "+value);
            }
           }
           String text(View root,String value)throws Exception{
            final String[] s={null};ui(()->s[0]=((TextView)unique(root,value,true)).getText().toString());return s[0];
           }
           void input(String value)throws Exception{ui(()->((EditText)unique(root(),"新待办输入",true)).setText(value));}
           void add(String title)throws Exception{input(title);click(root(),"添加",false);}
           AlertDialog dialog()throws Exception{
            final AlertDialog[] d={null};ui(()->d[0]=(AlertDialog)field(screen,"todoDialog"));
            need(d[0]!=null&&d[0].isShowing(),"delete dialog visible");return d[0];
           }
           void remove(String id)throws Exception{click(root(),"delete-"+id,true);}
           void confirm()throws Exception{click(dialog().getWindow().getDecorView(),"todo-delete-confirm",true);}
           void noUndo()throws Exception{
            ui(()->{need(field(screen,"todoUndo")==null,"no in-memory undo");List<View> nodes=new ArrayList<>();find(root(),"撤销删除",false,nodes);need(nodes.isEmpty(),"no undo control");});
           }
           AppDatabase db()throws Exception{return (AppDatabase)field(screen,"db");}
           Map<String,List<List<String>>> state()throws Exception{
            return snapshot(db());
           }
           static Map<String,List<List<String>>> snapshot(AppDatabase h){
            synchronized(h){
             SQLiteDatabase sql=h.getReadableDatabase();sql.beginTransaction();
             try{
              Map<String,List<List<String>>> out=new TreeMap<>();
              try(Cursor tables=sql.rawQuery("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name",null)){
               while(tables.moveToNext()){
                String name=tables.getString(0);need(name.matches("[A-Za-z0-9_]+"),"table name");List<List<String>> rows=new ArrayList<>();
                try(Cursor c=sql.rawQuery("SELECT rowid AS rowid,* FROM \""+name+"\" ORDER BY rowid",null)){
                 rows.add(Arrays.asList(c.getColumnNames()));
                 while(c.moveToNext()){List<String> row=new ArrayList<>();for(int i=0;i<c.getColumnCount();i++){int t=c.getType(i);row.add(t+":"+(t==0?"":t==4?android.util.Base64.encodeToString(c.getBlob(i),2):c.getString(i)));}rows.add(row);}
                }out.put(name,rows);
               }
              }sql.setTransactionSuccessful();return out;
             }finally{sql.endTransaction();}
            }
           }
           static Map<String,List<List<String>>> expected(Map<String,List<List<String>>> before,String omit,int delta){
            Map<String,List<List<String>>> out=new TreeMap<>();
            for(Map.Entry<String,List<List<String>>> e:before.entrySet()){
             List<List<String>> rows=new ArrayList<>();for(List<String> r:e.getValue())rows.add(new ArrayList<>(r));out.put(e.getKey(),rows);
            }
            if(omit!=null){
             List<List<String>> rows=out.get("todos");int col=rows.get(0).indexOf("id"),n=0;
             for(int i=rows.size()-1;i>0;i--)if(rows.get(i).get(col).equals("3:"+omit)){rows.remove(i);n++;}
             need(n==1,"exact omitted row");
            }
            List<List<String>> rev=out.get("revision");need(rev.size()==2,"one revision");int col=rev.get(0).indexOf("value");
            rev.get(1).set(col,"1:"+Math.addExact(Long.parseLong(rev.get(1).get(col).substring(2)),delta));return out;
           }
           Map<String,String> media()throws Exception{
            Map<String,String> out=new TreeMap<>();Path base=getTargetContext().getFilesDir().toPath().resolve("media");
            if(Files.exists(base))try(java.util.stream.Stream<Path> paths=Files.walk(base)){
             for(Path p:(Iterable<Path>)paths::iterator){if(Files.isDirectory(p))continue;need(Files.isRegularFile(p,LinkOption.NOFOLLOW_LINKS),"media regular");
              out.put(base.relativize(p).toString(),android.util.Base64.encodeToString(Files.readAllBytes(p),2));}
            }return out;
           }
           String idAt(Map<String,List<List<String>>> s,int index){List<List<String>> r=s.get("todos");return r.get(index+1).get(r.get(0).indexOf("id")).substring(2);}
           void save(String name,String value)throws Exception{Files.write(folder.resolve(name),value.getBytes("UTF-8"),StandardOpenOption.CREATE_NEW);}
           String read(String name)throws Exception{return new String(Files.readAllBytes(folder.resolve(name)),"UTF-8");}
           static void hiddenUndo(View hint,View button,Object token){
            need(hint.getVisibility()==View.GONE,"undo hint hidden");
            need(button.getVisibility()==View.GONE,"undo button hidden");
            need(token==null,"undo token invalidated");
           }
           // Independent expected state: retain the original nonnegative unique slots,
           // every rowid, typed cell and unrelated table. Not the product algorithm.
           static Map<String,List<List<String>>> orderExpected(Map<String,List<List<String>>> before,String id,int to){
            List<List<String>> rows=before.get("todos");List<String> header=rows.get(0);
            int key=header.indexOf("id"),pos=header.indexOf("position");
            List<List<String>> sorted=new ArrayList<>(rows.subList(1,rows.size()));
            sorted.sort(Comparator.comparingLong(r->Long.parseLong(r.get(pos).substring(2))));
            List<String> ids=new ArrayList<>();List<Long> slots=new ArrayList<>();
            for(List<String> r:sorted){ids.add(r.get(key).substring(2));slots.add(Long.parseLong(r.get(pos).substring(2)));}
            int from=ids.indexOf(id);need(from>=0&&to>=0&&to<ids.size(),"order oracle target");
            need(new HashSet<>(ids).size()==ids.size()&&new HashSet<>(slots).size()==slots.size(),"order oracle unique");
            Map<String,List<List<String>>> out=expected(before,null,from==to?0:1);
            ids.add(to,ids.remove(from));
            for(List<String> r:out.get("todos").subList(1,rows.size())){
             int index=ids.indexOf(r.get(key).substring(2));r.set(pos,"1:"+slots.get(index));
            }
            return out;
           }
           static boolean move(AppDatabase h,String id,List<String> shown,int to)throws Exception{
            try{
             Object value=AppDatabase.class.getMethod("moveTodo",String.class,List.class,int.class).invoke(h,id,shown,to);
             need(value instanceof Boolean,"moveTodo boolean contract");return (Boolean)value;
            }catch(InvocationTargetException e){
             Throwable cause=e.getCause();if(cause instanceof Exception)throw (Exception)cause;
             if(cause instanceof Error)throw (Error)cause;throw new AssertionError(cause);
            }
           }
           void orderReject(AppDatabase h,Class<? extends Throwable> type,Action action,String label)throws Exception{
            Map<String,List<List<String>>> before=snapshot(h);Throwable error=null;
            try{action.run();}catch(Throwable e){error=e;}
            pass(error!=null&&type.isInstance(error)&&before.equals(snapshot(h)),label);
           }
           String orderName(){return "todo-order-"+nonce+".db";}
           void orderBackend()throws Exception{
            need(!getTargetContext().getDatabasePath(orderName()).exists(),"fresh order database");
            Map<String,String> assets=media();
            try(AppDatabase h=AppDatabase.openSchema3(getTargetContext(),orderName())){
             h.addCategory(71,"Unchanged category");h.addActivity(72,71,0,"Unchanged activity");
             h.createNote("order-note",72,"Unchanged note");
             h.addTodo("order-first","Same order title");h.addTodo("order-middle","Same order title");h.addTodo("order-last","Last");
             h.editTodo("order-middle","Same order title",true);
             h.getWritableDatabase().execSQL("UPDATE todos SET position=7 WHERE id='order-middle'");
             h.getWritableDatabase().execSQL("UPDATE todos SET position=? WHERE id='order-last'",new Object[]{Long.MAX_VALUE});
             List<String> original=Arrays.asList("order-first","order-middle","order-last");
             pass(h.todoIds().equals(original)&&h.todo("order-middle").done,"order_fixture");
             Map<String,List<List<String>>> before=snapshot(h);
             pass(move(h,"order-first",original,2)&&snapshot(h).equals(orderExpected(before,"order-first",2))&&assets.equals(media()),"order_forward");
             before=snapshot(h);
             pass(move(h,"order-first",h.todoIds(),0)&&snapshot(h).equals(orderExpected(before,"order-first",0))&&h.todoIds().equals(original),"order_backward");
             before=snapshot(h);
             pass(!move(h,"order-middle",h.todoIds(),1)&&before.equals(snapshot(h)),"order_noop_readonly");
             orderReject(h,IllegalStateException.class,()->move(h,"order-first",Arrays.asList("order-middle","order-first","order-last"),1),"order_stale_readonly");
             orderReject(h,IllegalArgumentException.class,()->move(h,"order-first",Arrays.asList("order-first","order-first","order-last"),1),"order_duplicate_readonly");
             orderReject(h,IllegalArgumentException.class,()->move(h,"order-first",null,1),"order_null_readonly");
             orderReject(h,IllegalArgumentException.class,()->move(h,"missing",original,1),"order_missing_readonly");
             orderReject(h,IllegalArgumentException.class,()->move(h,"order-first",original,3),"order_bounds_readonly");
             SQLiteDatabase sql=h.getWritableDatabase();sql.beginTransaction();
             try{orderReject(h,IllegalStateException.class,()->move(h,"order-first",original,1),"order_outer_readonly");}finally{sql.endTransaction();}
             before=snapshot(h);sql.execSQL("CREATE TRIGGER ci_order_fault BEFORE UPDATE OF value ON revision BEGIN SELECT RAISE(ABORT,'order_late_fault'); END");
             Throwable fault=null;try{move(h,"order-first",original,2);}catch(Throwable e){fault=e;}
             boolean marker=false;for(Throwable e=fault;e!=null;e=e.getCause())if(e.toString().contains("order_late_fault"))marker=true;
             pass(marker&&before.equals(snapshot(h))&&assets.equals(media()),"order_late_rollback");sql.execSQL("DROP TRIGGER ci_order_fault");
             before=snapshot(h);
             AppDatabase.TodoDeletionUndo token=h.confirmTodoDeletion(h.prepareTodoDeletion("order-middle"));h.undoTodoDeletion(token);
             pass(expected(before,null,2).equals(snapshot(h)),"order_delete_undo");
             before=snapshot(h);need(move(h,"order-last",original,0),"final order changed");
             need(snapshot(h).equals(orderExpected(before,"order-last",0)),"checkpoint exact order");
             save("order-state",snapshot(h).toString());save("order-ids",h.todoIds().toString());
             Files.write(folder.resolve("order.canonical"),h.exportState(),StandardOpenOption.CREATE_NEW);
             h.exportBackup(folder.resolve("order.zip"),new com.supercubegame.pockettodo.MediaRepository(folder.resolve("order-media"),64L*1024*1024));
             pass(assets.equals(media()),"order_checkpoint");
            }
           }
           void orderRestart()throws Exception{
            try(AppDatabase h=AppDatabase.openSchema3(getTargetContext(),orderName())){
             pass(read("order-state").equals(snapshot(h).toString())&&read("order-ids").equals(h.todoIds().toString()),"order_restart");
            }
            String name="todo-order-restored-"+nonce+".db";need(!getTargetContext().getDatabasePath(name).exists(),"fresh order restore");
            try(AppDatabase h=AppDatabase.openSchema3(getTargetContext(),name)){
             com.supercubegame.pockettodo.MediaRepository m=new com.supercubegame.pockettodo.MediaRepository(folder.resolve("order-media"),64L*1024*1024);
             try(AppDatabase.RestorePlan p=h.prepareRestore(folder.resolve("order.zip"),folder.resolve("order-stage"),64L*1024*1024)){h.confirmRestore(p,m);}
             pass(Arrays.equals(Files.readAllBytes(folder.resolve("order.canonical")),h.exportState())&&read("order-ids").equals(h.todoIds().toString()),"order_backup");
            }
           }
           static void orderControls(View up,View down,boolean canUp,boolean canDown){
            need(up.isShown()&&down.isShown(),"order controls shown");
            need(up.isEnabled()==canUp,"order up enabled");
            need(down.isEnabled()==canDown,"order down enabled");
           }
           void filteredOrder(List<String> ids,String visible,String hidden)throws Exception{
            ui(()->{
             for(String id:ids)for(String prefix:new String[]{"todo-up-","todo-down-"}){
              List<View> found=new ArrayList<>();find(root(),prefix+id,true,found);need(found.isEmpty(),"filtered order absent "+prefix+id);
             }
             need(unique(root(),"todo-"+visible,true).isShown(),"filtered expected row");
             List<View> found=new ArrayList<>();find(root(),"todo-"+hidden,true,found);need(found.isEmpty(),"filtered excluded row");
            });
           }
           void orderButtons()throws Exception{
            Map<String,List<List<String>>> initial=state();
            need(initial.get("todos").size()==3,"two surviving UI-created rows");
            final String first=idAt(initial,0),last=idAt(initial,1);
            need(first.equals(read("first-id"))&&db().todoIds().equals(Arrays.asList(first,last)),"known original order");
            click(root(),"todo-"+last,true);
            pass(!db().todo(first).done&&db().todo(last).done,"ui_order_fixture");
            input("  order keeps composer  ");
            Map<String,List<List<String>>> before=state();Map<String,String> assets=media();
            final View[] saved=new View[4];
            ui(()->{
             saved[0]=unique(root(),"todo-up-"+first,true);saved[1]=unique(root(),"todo-down-"+first,true);
             saved[2]=unique(root(),"todo-up-"+last,true);saved[3]=unique(root(),"todo-down-"+last,true);
             orderControls(saved[0],saved[1],false,true);orderControls(saved[2],saved[3],true,false);
             // Deliberate callback delivery to disabled boundary controls, not physical taps.
             saved[0].performClick();saved[3].performClick();
            });ready();
            pass(before.equals(state())&&assets.equals(media()),"ui_order_boundaries_readonly");
            ui(()->{
             Rect rect=new Rect();need(saved[1].getGlobalVisibleRect(rect)&&rect.width()>0&&rect.height()>0,"visible down button");
             clickOnce(saved[1],"order down");saved[1].performClick();saved[2].performClick();
            });ready();
            pass(orderExpected(before,first,1).equals(state())&&assets.equals(media()),"ui_order_down_once");
            before=state();ui(()->{saved[1].performClick();saved[2].performClick();});ready();
            pass(before.equals(state())&&assets.equals(media()),"ui_order_stale_callbacks_readonly");
            click(root(),"todo-up-"+first,true);
            pass(orderExpected(before,first,0).equals(state())&&assets.equals(media()),"ui_order_up");
            pass(text(root(),"新待办输入").equals("  order keeps composer  "),"ui_order_composer");
            before=state();
            ui(()->{saved[1]=unique(root(),"todo-down-"+first,true);saved[2]=unique(root(),"todo-up-"+last,true);});
            click(root(),"待办",false);filteredOrder(Arrays.asList(first,last),first,last);
            ui(()->saved[1].performClick());ready();
            pass(before.equals(state())&&assets.equals(media())&&text(root(),"新待办输入").equals("  order keeps composer  "),"ui_order_pending_readonly");
            click(root(),"已完成",false);filteredOrder(Arrays.asList(first,last),last,first);
            ui(()->saved[2].performClick());ready();
            pass(before.equals(state())&&assets.equals(media()),"ui_order_completed_readonly");
            click(root(),"全部",false);
            ui(()->saved[1]=unique(root(),"todo-down-"+first,true));
            click(root(),"活动",false);ui(()->saved[1].performClick());ready();click(root(),"今天",false);
            pass(before.equals(state())&&assets.equals(media())&&text(root(),"新待办输入").equals("  order keeps composer  "),"ui_order_navigation_readonly");
            ui(()->{saved[1]=unique(root(),"todo-down-"+first,true);saved[2]=unique(root(),"todo-up-"+last,true);});
            SQLiteDatabase sql=db().getWritableDatabase();
            sql.execSQL("CREATE TRIGGER ci_ui_order_fault BEFORE UPDATE OF value ON revision BEGIN SELECT RAISE(ABORT,'ui_order_late_fault'); END");
            try{
             click(root(),"todo-down-"+first,true);
             pass(before.equals(state())&&assets.equals(media())&&text(root(),"v12-status").contains("未能调整待办顺序"),"ui_order_failure_rollback_readonly");
            }finally{sql.execSQL("DROP TRIGGER ci_ui_order_fault");}
            ui(()->{saved[1].performClick();saved[2].performClick();});ready();
            pass(before.equals(state())&&assets.equals(media()),"ui_order_failed_callbacks_readonly");
            click(root(),"todo-down-"+first,true);
            pass(orderExpected(before,first,1).equals(state())&&assets.equals(media())&&text(root(),"新待办输入").equals("  order keeps composer  "),"ui_order_recovery");
            save("ui-order-ids",db().todoIds().toString());
            Files.write(folder.resolve("ui-order.canonical"),db().exportState(),StandardOpenOption.CREATE_NEW);
            db().exportBackup(folder.resolve("ui-order.zip"),new com.supercubegame.pockettodo.MediaRepository(folder.resolve("ui-order-media"),64L*1024*1024));
            pass(db().todoIds().equals(Arrays.asList(last,first))&&assets.equals(media()),"ui_order_checkpoint");
           }
           void orderButtonsRestart()throws Exception{
            List<String> ids=db().todoIds();need(ids.size()==2,"UI order restart size");
            ui(()->{orderControls(unique(root(),"todo-up-"+ids.get(0),true),unique(root(),"todo-down-"+ids.get(0),true),false,true);
             orderControls(unique(root(),"todo-up-"+ids.get(1),true),unique(root(),"todo-down-"+ids.get(1),true),true,false);});
            pass(read("ui-order-ids").equals(ids.toString())&&Arrays.equals(Files.readAllBytes(folder.resolve("ui-order.canonical")),db().exportState()),"ui_order_restart");
            String name="todo-ui-order-restored-"+nonce+".db";need(!getTargetContext().getDatabasePath(name).exists(),"fresh UI order restore");
            try(AppDatabase h=AppDatabase.openSchema3(getTargetContext(),name)){
             com.supercubegame.pockettodo.MediaRepository m=new com.supercubegame.pockettodo.MediaRepository(folder.resolve("ui-order-media"),64L*1024*1024);
             try(AppDatabase.RestorePlan p=h.prepareRestore(folder.resolve("ui-order.zip"),folder.resolve("ui-order-stage"),64L*1024*1024)){h.confirmRestore(p,m);}
