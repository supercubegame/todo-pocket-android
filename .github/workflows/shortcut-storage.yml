           "compressed_bytes": 26408, "files": {p: hashlib.sha256(v.encode()).hexdigest() for p,v in contents.items()}}, indent=2))
          child = subprocess.run([sys.executable, str(folder / "preflight_runner.py"),
           str(pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "source"), str(folder), str(output)])
          sys.exit(child.returncode)
