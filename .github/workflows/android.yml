name: Android APK verification
on:
  push:
    branches: [main, feature/first-apk, feature/v1.1-edit-backup]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Core gate
        run: |
          set -o pipefail
          python3 tools/verify.py core 2>&1 | tee core.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-evidence
          path: core.log
          if-no-files-found: error
  android:
    needs: core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      apk: ${{ steps.apk.outcome }}
      emulator: ${{ steps.emulator.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Java and fixed build tools
        run: |
          set -euo pipefail
          exec > >(tee setup.log) 2>&1
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build, lint and verify signature
        id: apk
        run: |
          set -o pipefail
          python3 tools/verify.py build 2>&1 | tee build.log
      - name: Emulator behavior and screenshots
        id: emulator
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/emulator_gate.py 2>&1 | tee ui.log
      - name: Publish verified preview APK and real screenshots
        if: steps.emulator.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" delivery/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "Pocket Todo 1.1 isolated preview" \
            --notes "Editing and file backup preview. Android 8.0+. Separate preview package, no automatic access to old app data. Disposable debug signature, NOT a durable upgrade channel. Core, build, lint and emulator gates passed; see evidence branch for exact report. Backup files are not encrypted. Keep the original app installed."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-evidence
          path: |
            delivery/
            setup.log
            build.log
            ui.log
            emulator.log
            build/reports/lint-results-debug.html
          if-no-files-found: error
      - name: Preserve UI failure signal
        if: steps.emulator.outcome == 'failure'
        run: exit 1
  report:
    needs: [core, android]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: collected
      - name: Publish and read back exact evidence
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/verify.py report
