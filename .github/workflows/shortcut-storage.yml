name: Bounded restore picker delivery
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions: {contents: write, actions: write, checks: write}
concurrency: {group: shortcut-business-bridge-delivery, cancel-in-progress: false}
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 7c02e18f80161928b1164c8f38c7705c2b20b3a4, persist-credentials: false}
      - name: Restore pinned transport and validate single-path candidate
        env:
          ORIGINAL_DRIVER_SHA: cc83f9374afd35c87252fe189c6ea7afaf7e985cc8eb9a9c9dc48ffca3fed58c
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          import urllib.request,hashlib,textwrap
          u='https://raw.githubusercontent.com/supercubegame/todo-pocket-android/4a5ce09fac1cf2e3c9473f05fb2d7dd7d4abb710/.github/workflows/shortcut-storage.yml'
          b=urllib.request.urlopen(u,timeout=60).read(7084);assert len(b)==7083 and hashlib.sha256(b).hexdigest()=='308cc48f0f64c58495260e1e0c469111d228de07bb1f0d56d6bba7b34ad60c4d'
          code=textwrap.dedent(b.decode().split("          python3 - <<'PY'\n",1)[1].split('          PY\n',1)[0]);exec(compile(code,'pinned-restore','exec'),{})
          PY
          cat > repair.py <<'SOURCE'
          from pathlib import Path
          import hashlib
          BASE='7c02e18f80161928b1164c8f38c7705c2b20b3a4'
          P='tools/emulator_gate.py'
          PINS={P:'7e185ac47b1ffbeb3fae2c73a0f75be3d16b3039'}
          def blob(b):return hashlib.sha1(b'blob %d\0'%len(b)+b).hexdigest()
          def once(s,a,b):
           assert s.count(a)==1,a
           return s.replace(a,b)
          def candidates(root):
           b=(Path(root)/P).read_bytes();assert blob(b)==PINS[P];s=b.decode()
           s=once(s,'    switched = False\n','    switched = False\n    first_layout = None\n    stable = 0\n    reconfirmed = False\n')
           s=once(s,'        if controls:\n            control = controls[0]', '''        # Only this version's explicit layout button can be requested again.
                  key = None
                  if len(controls) == len(files) == 1:
                      c, f = controls[0], files[0]
                      pkg = 'com.google.android.documentsui'
                      if (c.get('package') == f.get('package') == pkg and
                              c.get('resource-id') == pkg + ':id/sub_menu_list' and
                              c.get('content-desc') == 'List view' and c.get('class') == 'android.widget.Button' and
                              c.get('clickable') == 'true' and f.get('resource-id') == 'android:id/title'):
                          valid(c); valid(f, pkg)
                          key = (c.get('bounds'), f.get('bounds'), f.get('text'))
                  stable = stable + 1 if key is not None and key == first_layout else 0
                  if controls:
                      control = controls[0]''')
           s=once(s,'                    switched = True\n                    tap_node(control)','                    switched = True\n                    first_layout = key\n                    tap_node(control)')
           s=once(s,'                # Never reuse grid coordinates', '''                elif stable >= 2 and not reconfirmed:
                              assert key is not None and clock() < deadline, 'layout confirmation expired'
                              reconfirmed = True
                              records.append({'stage':'SAME_GRID_RECONFIRMED','bounds':key[:2]})
                              tap_node(control)
                          # Never reuse grid coordinates''')
           s=once(s,'        return 6, 20', '''        # Model the API34 trace: a persistent grid is not proof the first tap was lost.
                  c=dict(GRID, **{'resource-id':PKG+':id/sub_menu_list','class':'android.widget.Button','clickable':'true','bounds':'[248,174][296,222]'})
                  f=dict(FILE,bounds='[74,372][144,391]'); g=[c,f]
                  for frames, expected, succeeds in (([g,g,g,[LIST,FILE]], ['List view']*2+[FILE['text']], True),
                          ([g,[LIST,FILE]], ['List view', FILE['text']], True),
                          ([g], ['List view']*2, False),
                          ([g,[dict(c,bounds='[24,17][29,22]'),f]], ['List view'], False),
                          ([[dict(c,clickable='false'),f]], ['List view'], False),
                          ([g,[c]], ['List view'], False)):
                      m=Model(frames)
                      try:result=m.run(function)
                      except TimeoutError:assert not succeeds
                      else:assert succeeds and result==FILE
                      assert m.taps==expected
                  return 8, 24''')
           assert blob(s.encode())=='c77c85752bd7d31f81d819a3c1f1edf7f6c49cfb'
           return {P:s.encode()}
          SOURCE
          python3 - <<'PY'
          import os,repair
          from pathlib import Path
          repair.candidates(os.environ['GITHUB_WORKSPACE'])
          p=Path('prepare.py');s=p.read_text().replace('APPROVED_SHARE_BLOCK_ORDER_FIX','APPROVED_API34_LAYOUT_RECONFIRM').replace('test: compare share block rows by identity not rowid order','test: reconfirm a persistent API34 layout without repeating the file tap').replace('Share block order delivery','Restore picker delivery');p.write_text(s)
          PY
          python3 prepare.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test-deliver-accepted.py');s=p.read_text();i=s.index('patch.object(repair,"candidates",return_value=');j=s.index('),patch.object(m,"device_evidence"',i);p.write_text(s[:i]+'patch.object(repair,"candidates",return_value=data'+s[j:])
          PY
          python3 test-deliver-accepted.py
      - name: Original 21 once and exact remote delivery
        id: delivery
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 "$RUNNER_TEMP/deliver-accepted.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/picker-delivery"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: picker-delivery
          path: ${{ runner.temp }}/picker-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
        run: python3 "$RUNNER_TEMP/deliver-accepted.py" publish "$RUNNER_TEMP/picker-delivery"
