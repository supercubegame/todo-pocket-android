          repair.candidates(os.environ['GITHUB_WORKSPACE']);p=Path('prepare.py');s=p.read_text()
          for a,b in [('APPROVED_SHARE_BLOCK_ORDER_FIX','NATIVE_CONSENT_FOUR_REVIEWED_PATHS'),('test: compare share block rows by identity not rowid order','fix: distinguish saving from sending in paged preview consent'),('Share block order delivery','Native consent delivery')]:
              assert s.count(a)==1;s=s.replace(a,b)
