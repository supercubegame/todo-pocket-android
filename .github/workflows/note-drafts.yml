          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Reuse unchanged configuration-only build retry guard
        env:
          BUILD_429_EXECUTE: 'true'
          BUILD_LOG: draft-build.log
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          # Read only the canonical YAML block, never execute the surrounding workflow.
          # This keeps the existing recognized-429 guard and its tests byte-identical.
          lines=Path('.github/workflows/android.yml').read_text().splitlines()
          anchor='        run: &verified_build |'
          assert lines.count(anchor)==1
          body=[]
          for line in lines[lines.index(anchor)+1:]:
              if line and not line.startswith('          '):break
              body.append(line[10:] if line else '')
          script='\n'.join(body)+'\n'
          assert script.startswith("set -euo pipefail\npython3 - <<'PY'\n") and script.endswith('PY\n')
          assert 'selftest()' in script and 'rate_limited_configuration' in script
          subprocess.run(['bash','-n'],input=script,text=True,check=True)
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True,timeout=900)
          PY
      - name: Freeze independently built product identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          files=list(Path('build/outputs/apk/debug').glob('*.apk'))
          assert len(files)==1
          apk=files[0];tools=Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          def run(args):return subprocess.check_output(list(map(str,args)),text=True,timeout=30)
          badging=run([tools/'aapt','dump','badging',apk])
          assert "name='com.supercubegame.pockettodo.v12.preview'" in badging
          assert "versionCode='3'" in badging and "sdkVersion:'26'" in badging and "targetSdkVersion:'34'" in badging
          assert 'uses-permission:' not in run([tools/'aapt','dump','permissions',apk])
          certs=re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-f]{64})$',run([tools/'apksigner','verify','--verbose','--print-certs',apk]),re.M)
          assert len(certs)==1
          data=apk.read_bytes()
          value=dict(commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],
                     run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],api=int(os.environ['TEST_API']),
                     apk_sha256=hashlib.sha256(data).hexdigest(),apk_bytes=len(data),certificate=certs[0])
          Path('draft-apk.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - name: Real draft session SQLite and file checks in a disposable emulator
