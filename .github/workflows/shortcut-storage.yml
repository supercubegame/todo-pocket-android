name: Explicit activation UI checked exception repair
'on':
  push:
    branches:
      - ci/shortcut-storage-preflight-4d8742
permissions:
  contents: read
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  shortcut_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - name: Verify exact original source and repair two transport escapes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/a37a972bd31bd0ad4fa0b82005f26a91bc07b9fc/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(11571)
          assert len(raw)==11570 and hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()=="cb33818dafc911ec79e490491ff58fb8734741cd"
          text=raw.decode();start=text.index("          import hashlib,os,pathlib,subprocess,urllib.request")
          end=text.index("\n          PY\n",start)
          program="\n".join(line[10:] for line in text[start:end].splitlines())
          exec(compile(program,"exact-transfer-bootstrap","exec"),{})
          PY
      - name: Use Java 17
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/0.sh"
      - name: Restore exact pinned backend materializer
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/1.sh"
      - name: Preserve original RED and backend host gates
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/2.sh"
      - name: Prove and repair actual media checked-exception signature
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Repair the new UI's checked exception contract, without suppressing failure."""
          import ast,os,pathlib

          INSERT=r'''
          media_path=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"src/main/java/com/supercubegame/pockettodo/MediaRepository.java"
          media_bytes=media_path.read_bytes()
          assert hashlib.sha1(b"blob "+str(len(media_bytes)).encode()+bytes([0])+media_bytes).hexdigest()=="2d662b14780fffef816652a93d4bae5af80fba02"
          assert "public MediaRepository(Path directory, long maxBytes) throws IOException" in media_bytes.decode()
          old="private MediaRepository activationMedia(){"
          new="private MediaRepository activationMedia()throws java.io.IOException{"
          stub_old="MediaRepository(Path p,long b){}"
          stub_new="MediaRepository(Path p,long b)throws java.io.IOException{}"
          for name in ("activation-host.py","activation-parser.py"):
           assert activation_files[name].count(stub_old)==1
           activation_files[name]=activation_files[name].replace(stub_old,stub_new,1)
          scope={"__name__":"checked_exception_red"}
          exec(compile(activation_files["activation-host.py"],"checked_exception_red","exec"),scope)
          c,r=scope["run"](activation_files["activation-ui.java"])
          assert c.returncode!=0 and "unreported exception IOException" in c.stderr
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"activation-evidence/activation-ui-checked-exception-red.txt").write_text(c.stderr)
          assert activation_files["activation-ui.java"].count(old)==1
          activation_files["activation-ui.java"]=activation_files["activation-ui.java"].replace(old,new,1)
          scope["check"](activation_files["activation-ui.java"])
          '''

          def repair(script):
              head,body=script.split("import ast,hashlib,os,pathlib,urllib.request\n",1)
              code="import ast,hashlib,os,pathlib,urllib.request\n"+body.rsplit("\nPY",1)[0]
              tree=ast.parse(code)
              class Replace(ast.NodeTransformer):
                  count=0
                  def visit_Constant(self,node):
                      if isinstance(node.value,str) and node.value.startswith("import base64,json,lzma,importlib.util"):
                          anchor="for name,content in activation_files.items(): (folder/name).write_text(content)"
                          assert node.value.count(anchor)==1
                          self.count+=1
                          value=node.value.replace(anchor,INSERT+"\n"+anchor,1)
                          ast.parse(value)
                          return ast.copy_location(ast.Constant(value=value),node)
                      return node
              update=Replace();tree=update.visit(tree);assert update.count==1
              return head+ast.unparse(tree)+"\nPY\n"

          if __name__=="__main__":
              path=pathlib.Path(os.environ["RUNNER_TEMP"])/"exact-activation-scripts/3.sh"
              path.write_text(repair(path.read_text()))

          PY
      - name: Integrate default startup UI and rerun all 21 original hosts
        id: integration
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/3.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: activation-host
          path: ${{ runner.temp }}/activation-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact host outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_OUTCOME: ${{ steps.integration.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/4.sh"
  shortcut_device:
    needs: shortcut_host
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api:
          - 26
          - 34
    env:
      TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: activation-host
          path: activation-evidence
      - name: Verify exact original source and repair two transport escapes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/a37a972bd31bd0ad4fa0b82005f26a91bc07b9fc/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(11571)
          assert len(raw)==11570 and hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()=="cb33818dafc911ec79e490491ff58fb8734741cd"
          text=raw.decode();start=text.index("          import hashlib,os,pathlib,subprocess,urllib.request")
          end=text.index("\n          PY\n",start)
          program="\n".join(line[10:] for line in text[start:end].splitlines())
          exec(compile(program,"exact-transfer-bootstrap","exec"),{})
          PY
      - name: Restore exact six-file host-verified candidate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/5.sh"
      - name: Fixed disposable Android setup
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/6.sh"
      - name: Build isolated runner and restore original Gradle source
        env:
          BUILD_429_EXECUTE: 'true'
          BUILD_LOG: shortcut-build.log
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/7.sh"
      - name: Original regressions plus actual native default startup
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/8.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shortcut-device-api-${{ matrix.api }}
          path: |
            shortcut-device/
            shortcut-build.json
            shortcut-build.log
            shortcut-build-driver.log
            shortcut-android.log
            shortcut-setup.log
            emulator.log
          if-no-files-found: error
          retention-days: 14
  shortcut_report:
    needs:
      - shortcut_host
      - shortcut_device
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: activation-host
          path: activation-evidence
      - name: Verify exact original source and repair two transport escapes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/a37a972bd31bd0ad4fa0b82005f26a91bc07b9fc/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(11571)
          assert len(raw)==11570 and hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()=="cb33818dafc911ec79e490491ff58fb8734741cd"
          text=raw.decode();start=text.index("          import hashlib,os,pathlib,subprocess,urllib.request")
          end=text.index("\n          PY\n",start)
          program="\n".join(line[10:] for line in text[start:end].splitlines())
          exec(compile(program,"exact-transfer-bootstrap","exec"),{})
          PY
      - name: Restore exact six-file host-verified candidate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/9.sh"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shortcut-*
          path: collected-shortcuts
      - name: Publish both original device receipts including failures
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/10.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-shortcut-report
          path: |
            shortcut-report.json
            shortcut-report.log
          if-no-files-found: error
          retention-days: 14

