name: Recover verified ebd API34 original evidence
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Restore byte-exact reader and recover original evidence only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/88aa1ddd15588a02f834c496cde90b4e51a9ba59/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as response:raw=response.read(5765)
          assert len(raw)==5764
          assert hashlib.sha1(b"blob 5764\0"+raw).hexdigest()=="1e683bb5ccc4d7260a43c3bfd9916884ecf1daec"
          for old,new in [(b"HRQp642IM6R6bsAR",b"HRQp642IM6RbsAR"),(b"gvghc1c1zMLL5",b"gvghc1zMLL5"),(b"T36cnkfE/LdUR",b"T36cnE/LdUR")]:
              assert raw.count(old)==1
              raw=raw.replace(old,new)
          assert len(raw)==5759 and hashlib.sha256(raw).hexdigest()=="38e34e1bba962a931fb41976400ee483ecc584106c6beda65d97e02afcd6d87c"
          body=raw.decode().split("          python3 - <<'PY'\n",1)[1].split("          PY\n",1)[0]
          assert all(not line or line.startswith("          ") for line in body.splitlines())
          source="\n".join(line[10:] for line in body.splitlines())+"\n"
          ast.parse(source)
          exec(compile(source,"verified-reader-loader","exec"))
          PY
          python3 recover.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-ebd-api34
          path: original-ebd-api34/
          if-no-files-found: error
          retention-days: 14
