name: Read accepted activation integration inputs
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 38539002887
          github-token: ${{ github.token }}
          name: activation-host
          path: host
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 38539002887
          github-token: ${{ github.token }}
          pattern: shortcut-device-api-*
          path: devices
      - name: Verify bindings and publish source plus actual phase labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,json,lzma,os,pathlib,re,subprocess,urllib.request
          def publish(name,text):
              parts=[text[i:i+10000] for i in range(0,len(text),10000)]
              assert ''.join(parts)==text
              for i,part in enumerate(parts,1):
                  body={'name':f'{name} {i}/{len(parts)}','head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'success','output':{'title':'Verified accepted input, not new product acceptance','summary':'Source run38539002887 / commit87d3cfd2 / attempt1. Read-only, no device rerun or product push.','text':'```text\n'+part+'\n```'}}
                  ep='repos/'+os.environ['GITHUB_REPOSITORY']+'/check-runs'
                  r=subprocess.run(['gh','api','--method','POST',ep,'--input','-'],input=json.dumps(body),text=True,capture_output=True,timeout=60,check=True)
                  seen=json.loads(subprocess.check_output(['gh','api',ep+'/'+str(json.loads(r.stdout)['id'])],text=True,timeout=60))
                  assert seen['head_sha']==body['head_sha'] and all(seen['output'][k]==v for k,v in body['output'].items())
          root=pathlib.Path('host');receipt=json.loads((root/'receipt.json').read_text())
          assert receipt['workflow_commit']=='87d3cfd2a9b8c8728919013d081682cf9ee5394e' and str(receipt['run_id'])=='38539002887' and str(receipt['run_attempt'])=='1'
          assert receipt['status']=='HOST_PASS_CANDIDATE_DEVICE_PENDING' and receipt['product_pushes']==0
          assert len(receipt['host_commands'])==21 and all(x['returncode']==0 and not x['timed_out'] and x['attempts']==1 and x['budget_seconds']==300 for x in receipt['host_commands'])
          for name,identity in receipt['candidate_files'].items():
              data=(root/'candidate'/name).read_bytes()
              assert len(data)==identity['bytes'] and hashlib.sha256(data).hexdigest()==identity['sha256']
          url='https://raw.githubusercontent.com/supercubegame/todo-pocket-android/1ca2404a7b6d75c0645bd19ab07731205f2f6f63/.github/workflows/shortcut-storage.yml'
          with urllib.request.urlopen(url,timeout=60) as r: text=r.read(26536)
          assert len(text)==26535 and hashlib.sha256(text).hexdigest()=='1a571d49a33c79c46e934dc5b9ee7a8e44cfeca3055089be326f8f51a7d41ae0'
          match=re.search(r"base64.b64decode\('([^']+)'\)",text.decode());assert match
          raw=lzma.decompress(base64.b64decode(match.group(1),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='89165abc5ff8d26db76c250c695db8d6d0ed7b54f76c6ed1c2abf34b47c46d41'
          bundle=json.loads(raw)
          for name in ('activation-app.java','activation-store.java'):
              src=bundle[name]
              candidate=(root/'candidate/src/main/java/com/supercubegame/pockettodo'/('AppDatabase.java' if name=='activation-app.java' else 'Schema4Store.java')).read_text()
              assert src.strip() in candidate,'activation source differs from accepted candidate'
              publish(name,src)
          publish('accepted host receipt',json.dumps(receipt,indent=2))
          for api in (26,34):
              folder=pathlib.Path('devices')/f'shortcut-device-api-{api}'
              rows=[]
              for path in folder.rglob('*'):
                  if path.is_file() and path.stat().st_size<20000:
                      data=path.read_bytes()
                      if b'STARTUP_NATIVE_PASS ' in data and b'SHORTCUT_RESULT ' in data:
                          rows.append({'file':str(path.relative_to(folder)),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'raw':data.decode('utf-8','strict')})
              assert rows,'missing original phase output'
              publish('native raw API'+str(api),json.dumps(rows,ensure_ascii=False,indent=2))
          PY
