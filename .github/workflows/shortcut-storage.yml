name: Default startup UI candidate preflight
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  shortcut_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Restore exact pinned backend materializer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,os,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/56e57bb43453540fa2912c9518a1b5ab71254234/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as response: source=response.read(21963)
          assert len(source)==21962 and hashlib.sha256(source).hexdigest()=="4786a65ce08f30c787536adfad91599dcfb9ee58e9c2ea7ca41ae049435c0d83"
          text=source.decode();begin=text.index("          import ast,");end=text.index("\n          PY\n",begin)
          program="\n".join(line[10:] for line in text[begin:end].splitlines())
          exec(compile(program,"pinned-startup-materializer","exec"),{})
          PY
      - name: Preserve original RED and backend host gates
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/activation-payload/driver.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/activation-payload" "$RUNNER_TEMP/activation-evidence"
      - name: Integrate default startup UI and rerun all 21 original hosts
        id: integration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          raw=lzma.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(raw).hexdigest()=='91a9b27985e46af1dd00df19c5cec5f55b7ed2863e07199f45ce4d16ee7b4b2f'
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"startup-ui-extension";folder.mkdir()
          files=json.loads(raw)
          assert set(files)=={"members.java","ui.java","gate.py","integrate.py"}
          for name,text in files.items(): (folder/name).write_text(text)
          subprocess.run(["python3",str(folder/"integrate.py"),os.environ["GITHUB_WORKSPACE"],str(folder),str(pathlib.Path(os.environ["RUNNER_TEMP"])/"activation-evidence")],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: activation-host
          path: ${{ runner.temp }}/activation-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact host outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_OUTCOME: ${{ steps.integration.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"activation-evidence/receipt.json"
          value=json.loads(p.read_text()) if p.exists() else {"status":"SETUP_FAILED","host_commands":[]}
          value["artifact_url"]=os.environ.get("ARTIFACT_URL")
          body=json.dumps(value,ensure_ascii=False,indent=2)
          assert len(body.encode())<60000
          ok=value["status"]=="HOST_PASS_CANDIDATE_DEVICE_PENDING" and "startup_ui_host" in value and os.environ["HOST_OUTCOME"]==os.environ["UPLOAD_OUTCOME"]=="success"
          request={"name":"Startup UI preflight evidence","head_sha":os.environ["GITHUB_SHA"],"status":"completed","conclusion":"success" if ok else "failure","output":{"title":value["status"],"summary":"Candidate only; product pushes=0. New startup Java host models; existing Android regressions separate. Activation UI and overwrite upgrade still pending.","text":"```json\n"+body+"\n```"}}
          endpoint="repos/"+os.environ["GITHUB_REPOSITORY"]+"/check-runs"
          r=subprocess.run(["gh","api","--method","POST",endpoint,"--input","-"],input=json.dumps(request),text=True,capture_output=True,timeout=60,check=True)
          made=json.loads(r.stdout)
          seen=json.loads(subprocess.check_output(["gh","api",endpoint+"/"+str(made["id"])],text=True,timeout=60))
          assert seen["head_sha"]==request["head_sha"] and seen["conclusion"]==request["conclusion"]
          assert all(seen["output"][k]==v for k,v in request["output"].items())
          print("STARTUP_UI_RECEIPT",seen["html_url"])
          raise SystemExit(0 if ok else 1)
          PY
  shortcut_device:
    needs: shortcut_host
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    env:
      TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: activation-host
          path: activation-evidence
      - name: Restore exact five-file host-verified candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,os
          root=pathlib.Path(".")
          assert subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip()=="3a5a17e1fdc570c73804007cd9a4d2ef36c0966b"
          expected={"src/main/java/com/supercubegame/pockettodo/AppDatabase.java":"f3ae4d9d9bb59670e9634714640ac6fbdf478a09","src/main/java/com/supercubegame/pockettodo/Schema4Store.java":"cfc8c36a0681467150d5cd84ecfbcc76c184cb92","src/androidTest/java/com/supercubegame/pockettodo/Schema4DeviceTest.java":"0e63fc3448dae47d289533181be1f726eca1c15e","tools/verify_shortcuts.py":"af4e02026ca601f6a5cfb3d03c369fec675e4515","src/main/java/com/supercubegame/pockettodo/MainActivity.java":"404ed33a43182cf1c016ffc3326c2fd539cc4184"}
          receipt=json.loads((root/"activation-evidence/receipt.json").read_text())
          assert receipt["status"]=="HOST_PASS_CANDIDATE_DEVICE_PENDING"
          assert receipt["baseline"]=="3a5a17e1fdc570c73804007cd9a4d2ef36c0966b" and receipt["product_pushes"]==0
          assert receipt["workflow_commit"]==os.environ["GITHUB_SHA"] and str(receipt["run_id"])==os.environ["GITHUB_RUN_ID"] and str(receipt["run_attempt"])==os.environ["GITHUB_RUN_ATTEMPT"]
          assert len(receipt["host_commands"])==21 and all(r["returncode"]==0 and not r["timed_out"] and r["attempts"]==1 and r["budget_seconds"]==300 for r in receipt["host_commands"])
          assert receipt["startup_ui_host"]=={"checks":14,"witnessed_mutants":5,"scope":"REAL_JAVA_ANDROID_DOUBLES"}
          assert set(receipt["candidate_files"])==set(expected)
          for p,blob in expected.items():
           old=(root/p).read_bytes()
           assert hashlib.sha1(b"blob "+str(len(old)).encode()+b"\0"+old).hexdigest()==blob
           data=(root/"activation-evidence/candidate"/p).read_bytes();identity=receipt["candidate_files"][p]
           assert len(data)==identity["bytes"] and hashlib.sha256(data).hexdigest()==identity["sha256"]
           assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()==identity["blob"]
           (root/p).write_bytes(data)
          PY
      - name: Fixed disposable Android setup
        run: |
          set -euo pipefail
          exec > >(tee shortcut-setup.log) 2>&1
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install --yes strace
      - name: Build isolated runner and restore original Gradle source
        env:
          BUILD_429_EXECUTE: "true"
          BUILD_LOG: "shortcut-build.log"
        run: |
          set -euo pipefail
          python3 tools/verify_shortcuts.py build 2>&1 | tee shortcut-build-driver.log
      - name: Original migration backup separate-process and isolated UI regressions
        run: |
          set -euo pipefail
          python3 tools/verify_shortcuts.py android 2>&1 | tee shortcut-android.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shortcut-device-api-${{ matrix.api }}
          path: |
            shortcut-device/
            shortcut-build.json
            shortcut-build.log
            shortcut-build-driver.log
            shortcut-android.log
            shortcut-setup.log
            emulator.log
          if-no-files-found: error
          retention-days: 14
  shortcut_report:
    needs: [shortcut_host, shortcut_device]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: activation-host
          path: activation-evidence
      - name: Restore exact five-file host-verified candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,os
          root=pathlib.Path(".")
          assert subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip()=="3a5a17e1fdc570c73804007cd9a4d2ef36c0966b"
          expected={"src/main/java/com/supercubegame/pockettodo/AppDatabase.java":"f3ae4d9d9bb59670e9634714640ac6fbdf478a09","src/main/java/com/supercubegame/pockettodo/Schema4Store.java":"cfc8c36a0681467150d5cd84ecfbcc76c184cb92","src/androidTest/java/com/supercubegame/pockettodo/Schema4DeviceTest.java":"0e63fc3448dae47d289533181be1f726eca1c15e","tools/verify_shortcuts.py":"af4e02026ca601f6a5cfb3d03c369fec675e4515","src/main/java/com/supercubegame/pockettodo/MainActivity.java":"404ed33a43182cf1c016ffc3326c2fd539cc4184"}
          receipt=json.loads((root/"activation-evidence/receipt.json").read_text())
          assert receipt["status"]=="HOST_PASS_CANDIDATE_DEVICE_PENDING"
          assert receipt["baseline"]=="3a5a17e1fdc570c73804007cd9a4d2ef36c0966b" and receipt["product_pushes"]==0
          assert receipt["workflow_commit"]==os.environ["GITHUB_SHA"] and str(receipt["run_id"])==os.environ["GITHUB_RUN_ID"] and str(receipt["run_attempt"])==os.environ["GITHUB_RUN_ATTEMPT"]
          assert len(receipt["host_commands"])==21 and all(r["returncode"]==0 and not r["timed_out"] and r["attempts"]==1 and r["budget_seconds"]==300 for r in receipt["host_commands"])
          assert receipt["startup_ui_host"]=={"checks":14,"witnessed_mutants":5,"scope":"REAL_JAVA_ANDROID_DOUBLES"}
          assert set(receipt["candidate_files"])==set(expected)
          for p,blob in expected.items():
           old=(root/p).read_bytes()
           assert hashlib.sha1(b"blob "+str(len(old)).encode()+b"\0"+old).hexdigest()==blob
           data=(root/"activation-evidence/candidate"/p).read_bytes();identity=receipt["candidate_files"][p]
           assert len(data)==identity["bytes"] and hashlib.sha256(data).hexdigest()==identity["sha256"]
           assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()==identity["blob"]
           (root/p).write_bytes(data)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shortcut-*
          path: collected-shortcuts
      - name: Publish both original device receipts including failures
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/verify_shortcuts.py report 2>&1 | tee shortcut-report.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-shortcut-report
          path: |
            shortcut-report.json
            shortcut-report.log
          if-no-files-found: error
          retention-days: 14
