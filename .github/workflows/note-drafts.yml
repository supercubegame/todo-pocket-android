              assert same['title']=='DraftNative' and same['note_id']!=same['sibling_id']
              assert all(isinstance(same[k],str) and re.fullmatch('[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}',same[k]) for k in ('note_id','sibling_id'))
              for key in ('force_stop','final_stop','new_slot_saved_stop','new_slot_cleaned_stop','same_title_restart_stop'):
