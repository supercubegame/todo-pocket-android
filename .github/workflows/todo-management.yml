                         devices=devices,parents=needs,release_ready=False,durable_upgrade_ready=False,
                         physical_touch="NOT_TESTED",keyboard="NOT_TESTED",media_fixture="NO_REFERENCED_IMAGE",category_drag="NOT_IMPLEMENTED")
              data=(json.dumps(value,ensure_ascii=False,indent=2)+"\n").encode();Path("todo-native-report.json").write_bytes(data)
              endpoint="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/"
              def api_call(path,method="GET",body=None):
