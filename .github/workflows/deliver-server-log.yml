name: Detail navigation guarded delivery
on:
  push:
    branches: [diagnostic/server-log-delivery-20261008]
    paths: [.github/workflows/deliver-server-log.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: bounded-server-log-delivery-20261008
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'supercubegame/todo-pocket-android' && github.ref == 'refs/heads/diagnostic/server-log-delivery-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Validate and submit bounded batch summary scanner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,hashlib,subprocess,textwrap
          from pathlib import Path
          parent="e57376564337a3f621b30aaf4e9c071d56371b40"
          raw=subprocess.check_output(["git","show",parent+":.github/workflows/deliver-server-log.yml"],timeout=30)
          assert len(raw)==13518 and hashlib.sha256(raw).hexdigest()=="3e433c7c217159d3e8e93c31051f2b9aab694236258061f5cfe37f7d4fe17322"
          start="          python3 - <<'PY'\n"
          assert raw.decode().count(start)==1
          code=textwrap.dedent(raw.decode().split(start,1)[1].split("          PY\n",1)[0])
          tree=ast.parse(code)
          assert ast.unparse(tree.body[-1])=="ns['main'](payload_bytes)"
          tree.body.pop()
          inherited={"__name__":"approved_detail_delivery"}
          exec(compile(tree,"<pinned-detail-delivery>","exec"),inherited)
          builder=inherited["builder"]
          assemble_before=builder["assemble"]
          
          def scoped_wiring(source):
              """Keep all existing checks and mutations; narrow their subject to summary_ui."""
              tree=ast.parse(source)
              fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="batch_scroll_wiring_selftest")
              lines=source.splitlines(keepends=True)
              old="".join(lines[fn.lineno-1:fn.end_lineno])
              anchor="    source = inspect.getsource(native)\n    check(source)\n"
              assert old.count(anchor)==1,"original batch wiring source anchor"
              replacement='''    source = inspect.getsource(native)
              check(source)
              # Mutation anchors belong to summary_ui, not unrelated detail navigators.
              native_node = ast.parse(source).body[0]
              summary_node = next(n for n in native_node.body
                                  if isinstance(n, ast.FunctionDef) and n.name == "summary_ui")
              lines = source.splitlines(keepends=True)
              source = lines[0] + "".join(lines[summary_node.lineno-1:summary_node.end_lineno])
              check(source)
          '''
              new=old.replace(anchor,replacement,1)
              assert source.count(old)==1
              candidate=source.replace(old,new,1)
              assert candidate.count(new)==1 and candidate.replace(new,old,1)==source
              ast.parse(candidate)
              return candidate
          
          def assemble(original,additions):
              return scoped_wiring(assemble_before(original,additions).decode()).encode()
          
          def scope_selftest():
              # Reproduce the old unique-anchor assumption with valid repeated navigation
              # outside summary_ui, then prove the scoped source still has exactly one.
              source='''def native(adb, gate):
              def summary_ui():
                  proof.setdefault("navigation", []).append(navigation)
              def order_ui():
                  proof.setdefault("navigation", []).append(navigation)
          '''
              anchor='proof.setdefault("navigation", []).append(navigation)'
              assert source.count(anchor)==2
              try:assert source.count(anchor)==1
              except AssertionError:pass
              else:raise AssertionError("old unique-anchor RED missing")
              root=ast.parse(source).body[0]
              summary=next(n for n in root.body if n.name=="summary_ui")
              lines=source.splitlines(keepends=True)
              scoped=lines[0]+"".join(lines[summary.lineno-1:summary.end_lineno])
              assert scoped.count(anchor)==1
              assert scoped.replace(anchor,"pass").count(anchor)==0
              print("WIRING_SCOPE_CONTROL original_RED=1 scoped_positive=1 omission_negative=1",flush=True)
          
          scope_selftest()
          builder["assemble"]=assemble
          ns=inherited["ns"]
          ns["PARENT"]=parent
          ns["main"](inherited["payload_bytes"])
          PY
      - name: Preserve delivery and original host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-summary-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/catalog-forward-repair/receipt.json
            ${{ runner.temp }}/catalog-forward-repair/host-*.log
          if-no-files-found: error
          retention-days: 14
