name: Accepted APK emulator verification
on:
  push:
    branches: [fix/emulator-baseline-20260921]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Core and script syntax
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 -m py_compile tools/emulator_gate.py tools/ui_test.py
          python3 tools/verify.py core 2>&1 | tee core.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-evidence
          path: core.log
          if-no-files-found: error
  android:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    outputs:
      apk: ${{ steps.apk.outcome }}
      emulator: ${{ steps.emulator.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download exact user-accepted APK and verify bytes
        id: apk
        run: |
          set -euo pipefail
          exec > >(tee build.log) 2>&1
          mkdir delivery
          curl --fail --location --retry 2 'https://github.com/supercubegame/todo-pocket-android/releases/download/test-35518045028-1/PocketTodo-1.0-debug.apk' -o delivery/PocketTodo-1.0-debug.apk
          echo '2064ab1a485552830bb666f782c6081f6099179b860b097c7084e5b2c6b8d695  PocketTodo-1.0-debug.apk' > delivery/SHA256SUMS.txt
          (cd delivery && sha256sum -c SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/PocketTodo-1.0-debug.apk > delivery/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging delivery/PocketTodo-1.0-debug.apk > delivery/package.txt
          echo 'BASELINE_APK_REUSED: no compilation or signing performed in this run'
      - name: Create, discover and boot disposable AVD; run UI gate
        id: emulator
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"
          python3 tools/emulator_gate.py 2>&1 | tee ui.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-evidence
          path: |
            delivery/
            build.log
            ui.log
            emulator.log
          if-no-files-found: error
  report:
    needs: [core, android]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: collected
      - name: Publish and read back run-bound evidence
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/verify.py report
      - name: Publish separate screenshots only after UI passes
        if: needs.android.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "ui-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            collected/android-evidence/delivery/*.png collected/android-evidence/delivery/ui-result.json \
            --target "$GITHUB_SHA" --prerelease --title 'Pocket Todo v1.0 emulator evidence' \
            --notes 'Screenshots from the original accepted APK with SHA256 2064ab1a485552830bb666f782c6081f6099179b860b097c7084e5b2c6b8d695. No new APK or signing key was created. This is UI evidence, not a new application version.'
