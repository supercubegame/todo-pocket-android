name: Independent note draft verification
on:
  push:
    branches: [feature/v1.2-activity-notes-ledger]
  pull_request:
    branches: [main, feature/v1.1-edit-backup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Existing draft contracts and independent report controls
        run: |
          set -euo pipefail
          python3 tools/verify_note_drafts.py selftest 2>&1 | tee draft-host.log
          python3 - <<'PY' 2>&1 | tee -a draft-host.log
          from pathlib import Path
          import os, subprocess, textwrap
          text=Path('.github/workflows/note-drafts.yml').read_text()
          start='          # DRAFT_REPORT_BEGIN\n'
          end='          # DRAFT_REPORT_END\n'
          assert text.count(start)==text.count(end)==1
          code=textwrap.dedent(text.split(start,1)[1].split(end,1)[0])
          compile(code,'draft-report','exec')
          env=dict(os.environ,DRAFT_REPORT_SELFTEST='1')
          subprocess.run(['python3','-c',code],env=env,check=True,timeout=60)
          a='          # DRAFT_NATIVE_BEGIN\n';b='          # DRAFT_NATIVE_END\n'
          assert text.count(a)==text.count(b)==1
          native=textwrap.dedent(text.split(a,1)[1].split(b,1)[0])
          compile(native,'draft-native','exec')
          import ast
          tree=ast.parse(native)
          fixture=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='create_category_fixture']
          assert len(fixture)==1, 'fresh native fixture must create its own category'
          def exercise(node):
              scope={}
              exec(compile(ast.Module(body=[node],type_ignores=[]),'category-fixture','exec'),scope)
              calls=[]
              def capture(name):
                  return lambda *args,**kwargs:calls.append((name,args,kwargs))
              scope['create_category_fixture'](*(capture(k) for k in ('tap','fill','button','ready','find')))
              assert calls==[('tap',('新建分类',),{}),('fill',('分类名称','DraftCategory'),{}),
                  ('button',(True,),{}),('ready',(),{}),('find',(),{'text':'DraftCategory','content-desc':'category-name-1'})]
          exercise(fixture[0])
          import copy
          for index in range(5):
              mutant=copy.deepcopy(fixture[0]);del mutant.body[index]
              try:exercise(mutant)
              except AssertionError:pass
              else:raise AssertionError('missing category fixture step accepted')
          native_fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='native')
          calls=[n for n in ast.walk(native_fn) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='create_category_fixture']
          assert len(calls)==1 and [n.id for n in calls[0].args]==['tap','fill','button','ready','find']
          print('DRAFT_CATEGORY_FIXTURE host_sequence=1 compiled_omission_mutants=5 PASS; not Android execution')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: draft-host
          path: draft-host.log
          if-no-files-found: error
  draft_device:
    needs: draft_host
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fixed Android build setup
        run: |
          set -euo pipefail
          exec > >(tee draft-setup.log) 2>&1
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Reuse unchanged configuration-only build retry guard
        env:
          BUILD_429_EXECUTE: 'true'
          BUILD_LOG: draft-build.log
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          # Read only the canonical YAML block, never execute the surrounding workflow.
          # This keeps the existing recognized-429 guard and its tests byte-identical.
          lines=Path('.github/workflows/android.yml').read_text().splitlines()
          anchor='        run: &verified_build |'
          assert lines.count(anchor)==1
          body=[]
          for line in lines[lines.index(anchor)+1:]:
              if line and not line.startswith('          '):break
              body.append(line[10:] if line else '')
          script='\n'.join(body)+'\n'
          assert script.startswith("set -euo pipefail\npython3 - <<'PY'\n") and script.endswith('PY\n')
          assert 'selftest()' in script and 'rate_limited_configuration' in script
          subprocess.run(['bash','-n'],input=script,text=True,check=True)
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True,timeout=900)
          PY
      - name: Freeze independently built product identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          files=list(Path('build/outputs/apk/debug').glob('*.apk'))
          assert len(files)==1
          apk=files[0];tools=Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          def run(args):return subprocess.check_output(list(map(str,args)),text=True,timeout=30)
          badging=run([tools/'aapt','dump','badging',apk])
          assert "name='com.supercubegame.pockettodo.v12.preview'" in badging
          assert "versionCode='3'" in badging and "sdkVersion:'26'" in badging and "targetSdkVersion:'34'" in badging
          assert 'uses-permission:' not in run([tools/'aapt','dump','permissions',apk])
          certs=re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-f]{64})$',run([tools/'apksigner','verify','--verbose','--print-certs',apk]),re.M)
          assert len(certs)==1
          data=apk.read_bytes()
          value=dict(commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],
                     run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],api=int(os.environ['TEST_API']),
                     apk_sha256=hashlib.sha256(data).hexdigest(),apk_bytes=len(data),certificate=certs[0])
          Path('draft-apk.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - name: Real draft session SQLite and file checks in a disposable emulator
        run: |
          set -euo pipefail
          python3 tools/verify_note_drafts.py android 2>&1 | tee draft-android.log
      - name: Native draft buttons in a separate fresh disposable emulator
        run: |
          set -euo pipefail
          cp emulator.log draft-device/emulator.log
          export RUNNER_TEMP="$RUNNER_TEMP/draft-native"
          mkdir -p "$RUNNER_TEMP"
          python3 - <<'PY' 2>&1 | tee draft-native.log
          # DRAFT_NATIVE_BEGIN
          import copy,hashlib,json,os,re,sqlite3,subprocess,sys,time,traceback
          from pathlib import Path
          import xml.etree.ElementTree as ET
          sys.path.insert(0,'tools')
          import emulator_gate as gate
          from verify_process_control import stop_verified
          LABELS='fixture_text_image cancel_unsaved_readonly explicit_save_readonly restart_no_autorestore recover_cancel_readonly recover_confirm_readonly discard_cancel_readonly discard_confirm_readonly empty_draft_saved empty_recovered_body_rejected commit_exact_one_revision restart_committed'.split()
          SCOPE='NATIVE_DRAFT_BUTTONS_ASCII_IMAGE_FORCE_STOP_NOT_LMK_OR_CLEANUP_RACE'
          out=Path('draft-native');out.mkdir(exist_ok=True)
          manifest=json.loads(Path('draft-apk.json').read_text())
          result=dict(manifest,status='FAIL',scope=SCOPE,labels=[],checks=0,release_ready=False,
                      unicode_input='BACKEND_ONLY',cleanup_failure_race='NOT_TESTED',screens=[],snapshots=[])
          def create_category_fixture(tap,fill,button,ready,find):
              tap('新建分类')
              fill('分类名称','DraftCategory')
              button(True)
              ready()
              find(text='DraftCategory',**{'content-desc':'category-name-1'})
          def native(adb):
              prefix=[str(adb),'-s',gate.SERIAL];serial=0
              def command(*args,binary=False):
                  try:
                      p=subprocess.run(prefix+list(args),stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,
                                       stderr=subprocess.PIPE,text=not binary,timeout=40)
                  except subprocess.TimeoutExpired as e:
                      result['command_failure']=dict(args=list(args),timeout=40,stdout=str(e.stdout)[-3000:],stderr=str(e.stderr)[-3000:]);raise
                  if p.returncode:
                      result['command_failure']=dict(args=list(args),returncode=p.returncode,stdout=str(p.stdout)[-3000:],stderr=str(p.stderr)[-3000:])
                      raise RuntimeError('native draft command failed')
                  return p.stdout
              def shell(*args):return command('shell','-n','-T',*args)
              def nodes():
                  shell('uiautomator','dump','/sdcard/draft-native.xml')
                  raw=shell('cat','/sdcard/draft-native.xml');(out/'last-window.xml').write_text(raw)
                  return list(ET.fromstring(raw).iter('node'))
              def find(**attrs):
                  deadline=time.monotonic()+18;current=[]
                  while time.monotonic()<deadline:
                      current=nodes();hits=[n for n in current if all(n.get(k)==v for k,v in attrs.items())]
                      assert len(hits)<=1,('ambiguous',attrs)
                      if hits:return hits[0]
                      time.sleep(.25)
                  raise AssertionError(('missing',attrs,[n.attrib for n in current]))
              def seek(desc):
                  # Bounded viewport traversal, not a retry of failed product assertions.
                  for direction in (1,1,-1,-1,-1):
                      current=nodes();hits=[n for n in current if n.get('content-desc')==desc]
                      assert len(hits)<=1
                      if hits:return hits[0]
                      scroll=[n for n in current if n.get('class')=='android.widget.ScrollView' and n.get('scrollable')=='true']
                      assert len(scroll)==1,('no unique dialog scroll',desc)
                      x1,y1,x2,y2=map(int,re.findall(r'\d+',scroll[0].get('bounds')))
                      x=x2-12;top=y1+35;bottom=y2-35
                      assert bottom>top
                      shell('input','swipe',str(x),str(bottom if direction==1 else top),str(x),str(top if direction==1 else bottom),'300')
                  return find(**{'content-desc':desc})
              def click(n):
                  assert n.get('package')==gate.PKG and n.get('enabled')=='true'
                  x1,y1,x2,y2=map(int,re.findall(r'\d+',n.get('bounds')));assert x2>x1 and y2>y1
                  shell('input','tap',str((x1+x2)//2),str((y1+y2)//2))
              def tap(text):click(find(text=text))
              def touch(desc):click(seek(desc))
              def button(positive):click(find(**{'resource-id':'android:id/button'+('1' if positive else '2')}))
              def ready():find(**{'content-desc':'v12-status','text':'已保存到本机'})
              def fill(desc,value):
                  field=seek(desc);click(field)
                  shell('input','keyevent','KEYCODE_MOVE_END')
                  size=len(field.get('text','').encode('utf-16-le'))//2
                  shell('input','keyevent',*(['KEYCODE_DEL']*(size+1)))
                  assert find(**{'content-desc':desc}).get('text')==''
                  if value:shell('input','text',value.replace(' ','%s'))
                  assert find(**{'content-desc':desc}).get('text')==value
                  keyboard=shell('dumpsys','input_method')
                  if re.search(r'(?:mInputShown|isInputViewShown)\s*=\s*true',keyboard):
                      shell('input','keyevent','KEYCODE_BACK')
                  assert find(**{'content-desc':desc}).get('text')==value
              def status(text):
                  seek('note-draft-status')
                  find(**{'content-desc':'note-draft-status','text':text})
              def read_file(path):return command('exec-out','run-as',gate.PKG,'cat',path,binary=True)
              def state():
                  # Quiescent UI boundary; copy SQLite plus WAL and compare all rows/rowids.
                  nonlocal serial
                  serial+=1;p=out/('state-'+str(serial)+'.db')
                  p.write_bytes(read_file('databases/pocket-v12.db'))
                  if 'pocket-v12.db-wal' in shell('run-as',gate.PKG,'ls','databases').splitlines():
                      Path(str(p)+'-wal').write_bytes(read_file('databases/pocket-v12.db-wal'))
                  with sqlite3.connect(p) as db:
                      assert db.execute('PRAGMA integrity_check').fetchall()==[('ok',)]
                      tables=[r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
                      data={t:db.execute('SELECT rowid AS rowid,* FROM "'+t+'" ORDER BY rowid').fetchall() for t in tables}
                  media={}
                  for name in shell('run-as',gate.PKG,'ls','files/media').splitlines():
                      assert re.fullmatch('[0-9a-f]{64}',name)
                      media[name]=hashlib.sha256(read_file('files/media/'+name)).hexdigest();assert media[name]==name
                  value=(data,media);result['snapshots'].append(hashlib.sha256(repr(value).encode()).hexdigest())
                  return value
              def drafts():
                  names=shell('run-as',gate.PKG,'ls','files/note-drafts').splitlines()
                  assert all(n=='.lock' or re.fullmatch('[0-9a-f]{64}[.]draft',n) for n in names)
                  return {n:read_file('files/note-drafts/'+n) for n in names if n.endswith('.draft')}
              def shot():
                  data=command('exec-out','screencap','-p',binary=True);assert data[:8]==b'\x89PNG\r\n\x1a\n'
                  name='screen-'+str(len(result['screens']))+'.png';(out/name).write_bytes(data)
                  result['screens'].append(dict(file=name,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data)))
              def ok(label):
                  assert LABELS[len(result['labels'])]==label
                  result['labels'].append(label);print('DRAFT_NATIVE_PASS '+label,flush=True)
              def start():
                  shell('am','start','-W','-n',gate.PKG+'/com.supercubegame.pockettodo.MainActivity');ready()
              def open_note():
                  start();tap('活动');ready();touch(activity);ready();tap('笔记');ready()
                  touch('note-edit-'+block);status('发现本机草稿，请明确恢复；当前仍显示正文。')
              try:
                  assert os.environ.get('GITHUB_ACTIONS')=='true' and shell('getprop','ro.kernel.qemu').strip()=='1'
                  assert int(shell('getprop','ro.build.version.sdk').strip())==manifest['api']==gate.API
                  apks=list(Path('build/outputs/apk/debug').glob('*.apk'));assert len(apks)==1
                  product=apks[0].read_bytes();assert hashlib.sha256(product).hexdigest()==manifest['apk_sha256']
                  command('install','-r','-t',str(apks[0]))
                  installed=shell('pm','path',gate.PKG).strip();assert installed.startswith('package:') and '\n' not in installed
                  assert command('exec-out','cat',installed[8:],binary=True)==product
                  start();tap('活动');ready()
                  create_category_fixture(tap,fill,button,ready,find)
                  adds=[n for n in nodes() if n.get('content-desc','').startswith('category-add-')];assert adds
                  click(adds[0]);fill('活动名称','DraftNative');button(True);ready()
                  activity=find(text='DraftNative').get('content-desc');assert re.fullmatch('activity-[0-9]+',activity)
                  touch(activity);ready();tap('笔记');ready()
                  tap('加入文字');fill('文字内容','Canonical');button(True);ready()
                  tap('加入图片');button(True);ready()
                  baseline=state();data,media=baseline
                  rows=[r for r in data['blocks'] if r[4]=='TEXT'];assert len(rows)==1 and rows[0][5]=='Canonical'
                  original=rows[0];note,block=original[1:3]
                  assert len(data['blocks'])==2 and len(media)==1 and len(data['media'])==1
                  ok('fixture_text_image')
                  touch('note-edit-'+block);status('暂无已保存草稿；正文不能为空。')
                  assert drafts()=={}
                  fill('文字内容','NotSaved');button(False);ready()
                  assert state()==baseline and drafts()=={};ok('cancel_unsaved_readonly')
                  touch('note-edit-'+block);fill('文字内容','  Draft kept  ')
                  touch('note-draft-save');status('草稿已保存，正文未修改。')
                  saved=drafts();assert len(saved)==1 and state()==baseline
                  assert seek('文字内容').get('text')=='  Draft kept  ';shot();ok('explicit_save_readonly')
                  result['force_stop']=stop_verified(adb,gate.SERIAL,gate.PKG)
                  assert state()==baseline and drafts()==saved
                  open_note();assert seek('文字内容').get('text')=='Canonical' and drafts()==saved
                  ok('restart_no_autorestore')
                  fill('文字内容','Unsaved replacement');touch('note-draft-recover');find(text='恢复草稿？');button(False)
                  assert seek('文字内容').get('text')=='Unsaved replacement' and drafts()==saved and state()==baseline
                  ok('recover_cancel_readonly')
                  touch('note-draft-recover');find(text='恢复草稿？');button(True)
                  status('已恢复到输入框；点击保存才会修改正文。')
                  assert seek('文字内容').get('text')=='  Draft kept  ' and drafts()==saved and state()==baseline
                  ok('recover_confirm_readonly')
                  touch('note-draft-discard');find(text='丢弃本机草稿？');button(False)
                  assert seek('文字内容').get('text')=='  Draft kept  ' and drafts()==saved and state()==baseline
                  ok('discard_cancel_readonly')
                  touch('note-draft-discard');find(text='丢弃本机草稿？');button(True)
                  status('草稿已丢弃，正文和当前输入未修改。')
                  tomb=drafts();assert tomb.keys()==saved.keys() and tomb!=saved and state()==baseline
                  assert seek('文字内容').get('text')=='  Draft kept  '
                  assert seek('note-draft-recover').get('enabled')=='false' and seek('note-draft-discard').get('enabled')=='false'
                  ok('discard_confirm_readonly')
                  fill('文字内容','');touch('note-draft-save');status('草稿已保存，正文未修改。')
                  empty=drafts();assert empty.keys()==saved.keys() and empty!=tomb and state()==baseline
                  assert seek('note-draft-recover').get('enabled')=='true';ok('empty_draft_saved')
                  fill('文字内容','Temporary');touch('note-draft-recover');button(True);status('已恢复到输入框；点击保存才会修改正文。')
                  assert seek('文字内容').get('text')==''
                  button(True);status('内容不能为空')
                  assert state()==baseline and drafts()==empty;shot();ok('empty_recovered_body_rejected')
                  fill('文字内容','Committed');button(True);ready()
                  after=state();expected=copy.deepcopy(data)
                  expected['blocks']=[tuple(list(r[:5])+['Committed']+list(r[6:])) if r[1:3]==(note,block) else r for r in expected['blocks']]
                  assert len(expected['revision'])==1
                  revision=list(expected['revision'][0]);revision[-1]+=1;expected['revision']=[tuple(revision)]
                  assert after==(expected,media) and drafts()!=empty
                  ok('commit_exact_one_revision')
                  result['final_stop']=stop_verified(adb,gate.SERIAL,gate.PKG)
                  start();tap('活动');ready();touch(activity);ready();tap('笔记');ready()
                  assert find(**{'content-desc':'note-text-'+block}).get('text')=='Committed'
                  touch('note-edit-'+block);status('暂无已保存草稿；正文不能为空。')
                  assert seek('note-draft-recover').get('enabled')=='false' and state()==after
                  assert command('exec-out','cat',installed[8:],binary=True)==product
                  shot();ok('restart_committed');result['status']='PASS'
              finally:
                  result['checks']=len(result['labels'])
                  if result['status']!='PASS':
                      try:shot()
                      except Exception as e:result['screenshot_error']=repr(e)
          try:
              gate.verify_database=lambda adb:None
              gate.verify_native_ui=native
              gate.main()
              assert result['labels']==LABELS and result['status']=='PASS'
          except BaseException as e:
              result.update(status='FAIL',error=repr(e),traceback=traceback.format_exc()[-12000:]);raise
          finally:
              (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
              print('DRAFT_NATIVE_RESULT '+json.dumps(result,ensure_ascii=False),flush=True)
          # DRAFT_NATIVE_END
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: draft-device-api-${{ matrix.api }}
          path: |
            draft-apk.json
            draft-device/
            draft-setup.log
            draft-build.log
            draft-android.log
            draft-native/
            draft-native.log
            emulator.log
            device-schema3-registration-draft-*.txt
          if-no-files-found: error
          retention-days: 14
  draft_report:
    needs: [draft_host, draft_device]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: draft-*
          path: collected-drafts
      - name: Require exact dual-device evidence and publish bounded diagnostics
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # DRAFT_REPORT_BEGIN
          import copy,hashlib,json,os,re,sys,urllib.request
          from pathlib import Path
          sys.path.insert(0,'tools')
          from verify_note_drafts import device_observe
          # Independent coverage list: editing the emitter cannot shrink acceptance.
          REQUIRED={
              'seed':'''initial_body exact_draft_save draft_all_tables_readonly explicit_recover
          recover_all_tables_readonly cancel_keeps_draft empty_draft_exact empty_draft_readonly
          discard_tombstone discard_readonly same_title_note_isolation owner_slot_isolation
          new_text_slot_isolation media_unchanged restart_fixture_saved'''.split(),
              'reopen':'''restart_exact_draft restart_full_state restart_media
          wrong_owner missing_note missing_block stale_shown_blocks
          same_revision_mutation stale_recover stale_commit stale_save stale_refusal_readonly
          stale_draft_retained new_session_stale_base cas_save cas_recover cas_discard
          cas_newer_draft_retained late_sql_failure late_sql_rollback late_sql_draft_retained
          commit_cleanup commit_exact_body commit_one_revision commit_preserves_siblings
          commit_terminal new_block_append new_block_preserves_existing final_media'''.split()}
          PACKAGE='com.supercubegame.pockettodo.v12.preview'
          SCOPE='ACTUAL_ANDROID_DRAFT_SESSION_SQLITE_FILES_FORCE_STOP_NOT_NATIVE_BUTTONS_OR_LMK'
          NATIVE_REQUIRED='fixture_text_image cancel_unsaved_readonly explicit_save_readonly restart_no_autorestore recover_cancel_readonly recover_confirm_readonly discard_cancel_readonly discard_confirm_readonly empty_draft_saved empty_recovered_body_rejected commit_exact_one_revision restart_committed'.split()
          def validate_native(v,manifest,log,images):
              for key,expected in manifest.items():
                  assert type(v[key]) is type(expected) and v[key]==expected
              assert v['status']=='PASS' and v['scope']=='NATIVE_DRAFT_BUTTONS_ASCII_IMAGE_FORCE_STOP_NOT_LMK_OR_CLEANUP_RACE'
              assert type(v['checks']) is int and v['checks']==12 and v['labels']==NATIVE_REQUIRED
