name: Activity archive and restore guarded delivery
on:
  push:
    branches: [diagnostic/server-log-delivery-20261008]
    paths: [.github/workflows/deliver-server-log.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: bounded-server-log-delivery-20261008
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'supercubegame/todo-pocket-android' && github.ref == 'refs/heads/diagnostic/server-log-delivery-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Verify activity archive and atomically submit three product files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,lzma
          data=lzma.LZMADecompressor(memlimit=134217728).decompress(base64.b64decode('',validate=True),max_length=88230)
          assert len(data)==88229 and hashlib.sha256(data).hexdigest()=='705b038a506d7f15c03d59ee440812d25725314d0df1e14608d93a544ad8e2bf'
          exec(compile(data,"<activity-archive-delivery>","exec"))
          PY
      - name: Preserve original delivery and host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-forward-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/catalog-forward-repair/receipt.json
            ${{ runner.temp }}/catalog-forward-repair/host-*.log
          if-no-files-found: error
          retention-days: 14
