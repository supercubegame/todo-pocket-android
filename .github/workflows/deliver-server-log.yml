name: Archive legacy media guarded delivery
on:
  push:
    branches: [diagnostic/server-log-delivery-20261008]
    paths: [.github/workflows/deliver-server-log.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: bounded-server-log-delivery-20261008
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'supercubegame/todo-pocket-android' && github.ref == 'refs/heads/diagnostic/server-log-delivery-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Validate and submit legacy archive media acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,hashlib,subprocess,textwrap,base64,lzma,json
          from pathlib import Path
          parent="a2486b7b367057e2a20f5677a70ded8bf8717fdd"
          raw=subprocess.check_output(["git","show",parent+":.github/workflows/deliver-server-log.yml"],timeout=30)
          assert len(raw)==5456 and hashlib.sha256(raw).hexdigest()=="69bb752d0de4e7c38d3848803604761a7a633d795c475e15c8d857e007f5ffb4"
          marker="          python3 - <<'PY'\n"
          assert raw.decode().count(marker)==1
          code=textwrap.dedent(raw.decode().split(marker,1)[1].split("          PY\n",1)[0])
          tree=ast.parse(code)
          assert ast.unparse(tree.body[-1])=="ns['main'](inherited['payload_bytes'])"
          tree.body.pop()
          inherited={"__name__":"pinned_previous_delivery"}
          exec(compile(tree,"<pinned-previous-delivery>","exec"),inherited)
          ns=inherited["ns"]
          overrides='def unpack(encoded):\n    require(type(encoded) is bytes and len(encoded)==26944 and\n            hashlib.sha256(encoded).hexdigest()==\'e72b4d32f3d958f65c0a52321f2b6f14930cc2189809355b88e20bc5d1acca0e\',"Payload exact bytes")\n    payload=json.loads(encoded)\n    require(set(payload)=={\'build_patch.py\', \'media_oracle.py\', \'wiring.py\', \'acceptance.java\'},"Payload members")\n    return payload\n\ndef integrate(repo,payload,git):\n    path="tools/verify_app_catalog.py"\n    original=git("show",CURRENT+":"+path)\n    legacy=git("show",CURRENT+":src/androidTest/java/com/supercubegame/pockettodo/V12DeviceTest.java")\n    ns={"__name__":"archive_patch_assembly"}\n    exec(compile(payload["build_patch.py"],"<archive-builder>","exec"),ns)\n    candidate=ns["assemble"](original,legacy,payload["acceptance.java"],payload["media_oracle.py"],payload["wiring.py"])\n    (repo/path).write_bytes(candidate)\n    require(git("diff","--name-only").decode().splitlines()==[path],"Product diff escapes one verifier")\n    return {path:candidate}\n\ndef test_original_and_integration(work,repo,payload,candidates,env,receipt,save):\n    original=subprocess.check_output(["git","show",CURRENT+":tools/verify_app_catalog.py"],cwd=repo,timeout=30)\n    legacy=subprocess.check_output(["git","show",CURRENT+":src/androidTest/java/com/supercubegame/pockettodo/V12DeviceTest.java"],cwd=repo,timeout=30)\n    ns={"__name__":"assembly_control"};exec(payload["build_patch.py"],ns)\n    args=(legacy,payload["acceptance.java"],payload["media_oracle.py"],payload["wiring.py"])\n    require(ns["assemble"](original,*args)==candidates["tools/verify_app_catalog.py"],"Assembly nondeterministic")\n    for bad in (original[:-1],original+b"\\n",bytes([original[0]^1])+original[1:]):\n        try:ns["assemble"](bad,*args)\n        except AssertionError:pass\n        else:raise AssertionError("Corrupt catalog baseline accepted")\n    for bad in (legacy[:-1],legacy+b"\\n"):\n        try:ns["assemble"](original,bad,*args[1:])\n        except AssertionError:pass\n        else:raise AssertionError("Corrupt historical fixture accepted")\n    control=work/"archive-original-red.py"\n    control_source="import sys\\nfrom pathlib import Path\\nsys.path.insert(0,"+repr(str(repo/"tools"))+")\\nimport verify_app_catalog as candidate\\n"+(\n       "baseline={\'__name__\':\'original_catalog\',\'__file__\':"+repr(str(repo/"tools/verify_app_catalog.py"))+"}\\n"+\n       "exec(compile("+repr(original.decode())+",baseline[\'__file__\'],\'exec\'),baseline)\\n"+\n       "try: candidate.archive_acceptance_wiring_selftest(baseline[\'JAVA\'])\\n"+\n       "except AssertionError as failure:\\n"+\n       " assert \'seed/archiveAcceptanceSeed\' in str(failure),str(failure)\\n"+\n       " print(\'ORIGINAL_ARCHIVE_COVERAGE_RED missing_legacy_media_acceptance=1 NOT_DEVICE_FAILURE\')\\n"+\n       "else: raise AssertionError(\'original missing coverage accepted\')\\n"+\n       "candidate.archive_media_oracle_selftest()\\n"+\n       "candidate.archive_acceptance_wiring_selftest()\\n")\n    compile(control_source,str(control),"exec")\n    control.write_text(control_source)\n    with (work/"host-original-red.log").open("wb") as log:\n        result=subprocess.run(["python3",str(control)],cwd=repo,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=300)\n    require(result.returncode==0,"Archive original RED/control failed: "+(work/"host-original-red.log").read_text()[-5000:])\n    receipt["integration_controls"]={"positive":1,"negative":5,"original_red":"MISSING_COVERAGE_NOT_DEVICE_FAILURE"}\n    save()'
          exec(compile(overrides,'<archive-overrides>','exec'),ns)
          ns.update(BASE="d7e79e00438992d5b2da40c7e459da7fc0164a60",CURRENT="d7e79e00438992d5b2da40c7e459da7fc0164a60",
                    PARENT=parent,PINS={"tools/verify_app_catalog.py":"c5ae577b014aadaa7bac4249afc8ad212265c233"})
          publisher=ns["publish"]
          old="test: bound order and deletion detail navigation to measured viewport"
          assert publisher.__code__.co_consts.count(old)==1
          publisher.__code__=publisher.__code__.replace(co_consts=tuple(
           "test: verify archived legacy PNG references across migration and backup" if c==old else c for c in publisher.__code__.co_consts))
          decoder=lzma.LZMADecompressor(memlimit=134217728)
          payload=decoder.decompress(base64.b64decode('',validate=True),max_length=26945)
          assert decoder.eof and not decoder.unused_data and len(payload)==26944 and hashlib.sha256(payload).hexdigest()=='e72b4d32f3d958f65c0a52321f2b6f14930cc2189809355b88e20bc5d1acca0e'
          ns["main"](payload)
          PY
      - name: Preserve delivery and original host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-summary-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/catalog-forward-repair/receipt.json
            ${{ runner.temp }}/catalog-forward-repair/host-*.log
          if-no-files-found: error
          retention-days: 14
