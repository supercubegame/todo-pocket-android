name: Completed prepare callback lifecycle acceptance
'on':
  push:
    branches:
      - ci/shortcut-storage-preflight-4d8742
permissions:
  contents: read
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  shortcut_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
