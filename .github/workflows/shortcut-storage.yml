    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - &ref_0
        name: Restore exact e44b83 scripts and unchanged command budgets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/e44b83bd4f25f2e083ecca5f6420af9400916105/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r:raw=r.read(16727)
          assert len(raw)==16726 and hashlib.sha1(b"blob 16726"+bytes([0])+raw).hexdigest()=="714714aba10c6f98742b57bb99be34cbdf8c9778"
          text=raw.decode();out=pathlib.Path(os.environ["RUNNER_TEMP"])/"callback-predecessor";out.mkdir()
          shared=None
          for job,count in {'shortcut_host': 26, 'shortcut_device': 10, 'shortcut_report': 10}.items():
              rest=text.split("  "+job+":\n",1)[1];lines=[]
              for line in rest.splitlines(keepends=True):
                  if line.startswith("  shortcut_"):break
                  lines.append(line)
              scripts=[]
              for i,line in enumerate(lines):
                  if line=="        run: |\n":
                      body=[]
                      for item in lines[i+1:]:
                          if item.strip() and not item.startswith("          "):break
                          body.append(item[10:] if item.startswith("          ") else item)
                      scripts.append("".join(body))
              if job=="shortcut_host":
                  assert "      - &ref_0\n" in rest
                  shared=scripts[0]
              else:
                  assert "".join(lines).count("      - *ref_0\n")==1
                  scripts.insert(0,shared)
              assert len(scripts)==count,(job,len(scripts))
              for i,script in enumerate(scripts):
                  assert script.startswith("set -euo pipefail\n")
                  (out/(job+"-"+str(i)+".sh")).write_text(script)
          PY
      - name: Restore exact bfb230 scripts and retain original report failure
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/callback-predecessor/shortcut_host-0.sh"
      - name: Restore exact accepted 512263 scripts and original budgets
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/callback-predecessor/shortcut_host-1.sh"
      - name: Restore exact 05fc scripts with first failure retained
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/callback-predecessor/shortcut_host-2.sh"
      - name: Restore exact e9bf scripts without combining steps
