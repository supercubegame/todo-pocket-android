                  if not (type(out.get("pages")) is int and 3<=out["pages"]<=4 and
                      type(out.get("bytes")) is int and 0<out["bytes"]<=16777216 and
                      isinstance(out.get("sha256"),str) and re.fullmatch("[0-9a-f]{64}",out["sha256"]) and
                      out.get("image")=="EXACT_96X96_GREEN_FIRST_PAGE_NO_OTHER_COLOR" and
                      out.get("text") ==("EXACT_WHITESPACE_INSENSITIVE" if kind=="PDF" else "NOT_OCR_TESTED")):return False
              return outputs["PDF"]["pages"]==outputs["PNG_ZIP"]["pages"]
          def native_sample(api=26,source="s",run="r"):
              good={"status":"PASS","commit":source,"run_id":run,"api":api,"scope":NATIVE_SCOPE,
                  "labels":NATIVE_REQUIRED[:],"checks":13,"release_ready":False,"outputs":{},"process_loss":{}}
              for kind in ("PDF","PNG_ZIP"):
                  good["outputs"][kind]={"pages":3,"bytes":100,"sha256":"a"*64,
                      "image":"EXACT_96X96_GREEN_FIRST_PAGE_NO_OTHER_COLOR",
                      "text":"EXACT_WHITESPACE_INSENSITIVE" if kind=="PDF" else "NOT_OCR_TESTED"}
                  good["process_loss"][kind]=loss_sample(good["outputs"][kind])
              return good
          def native_controls():
              good=native_sample()
              assert len(NATIVE_REQUIRED)==13 and native_observe(good,26,"s","r")
              bad=[None,{},dict(good,commit="old"),dict(good,run_id="old"),dict(good,api=True),dict(good,status="FAIL"),
                  dict(good,outputs={}),dict(good,release_ready=True),dict(good,scope="BACKEND_ONLY"),dict(good,process_loss={})]
              for i in range(13):
                  x=copy.deepcopy(good);del x["labels"][i];x["checks"]-=1;bad.append(x)
              for kind in ("PDF","PNG_ZIP"):
                  for key,val in (("pages",1),("pages",True),("bytes",0),("sha256","bad"),("image","NONBLANK"),("text","PASS")):
                      x=copy.deepcopy(good);x["outputs"][kind][key]=val
                      x["process_loss"][kind]["fresh_output"]=copy.deepcopy(x["outputs"][kind]);bad.append(x)
                  for i in range(len(LOSS_LABELS)):
                      x=copy.deepcopy(good);del x["process_loss"][kind]["labels"][i];bad.append(x)
              x=copy.deepcopy(good);x["outputs"]["PNG_ZIP"]["pages"]=4
              x["process_loss"]["PNG_ZIP"]["fresh_output"]=copy.deepcopy(x["outputs"]["PNG_ZIP"]);bad.append(x)
              for x in bad:assert not native_observe(x,26,"s","r"),"native observer accepted missing or wrong evidence"
              return len(bad)
          native_negative=native_controls()
          scope='PARALLEL_EXPORT_BACKEND_PREVIEW_AND_SYNTHETIC_NATIVE_MULTIPAGE_NOT_FULL_REGRESSION'
          stages=['installed_exact_product','codec_and_actual_preview','synthetic_native_saved','receipt_verified']
          def observe(value,api):
            if not isinstance(value,dict):return False
            codec=value.get('codec',{})
            if not isinstance(codec,dict):return False
            paged=codec.get('paged_exports',{})
            if not isinstance(paged,dict):return False
            preview=paged.get('preview_ui',{})
            if not isinstance(preview,dict):return False
            return (value.get('status')=='PASS' and value.get('scope')==scope and
              value.get('commit')==source and value.get('run_id')==run and
              type(value.get('api')) is int and value['api']==api and
              value.get('stages')==stages and value.get('release_ready') is False and
              value.get('durable_upgrade_ready') is False and
              value.get('native_saf')=='SYNTHETIC_IMAGE_MULTIPAGE_ONLY' and
              native_observe(value.get('native_image_pages'),api,source,run) and
              type(value.get('elapsed_seconds')) in (int,float) and 0<value['elapsed_seconds']<2100 and
              codec.get('status')=='PASS' and codec.get('commit')==source and
              codec.get('run_id')==run and type(codec.get('api')) is int and codec['api']==api and
              paged.get('status')=='PASS' and paged.get('commit')==source and paged.get('run_id')==run and
              type(paged.get('api')) is int and paged['api']==api and
              paged.get('labels')==PAGED_BACKEND_LABELS and type(paged.get('checks')) is int and paged['checks']==29 and
              preview.get('labels')==PAGED_PREVIEW_LABELS and type(preview.get('checks')) is int and preview['checks']==22)
          def matrix(values):
            return isinstance(values,dict) and set(values)=={'26','34'} and all(observe(values[str(a)],a) for a in (26,34))
          pair={}
          for api in (26,34):
            identity={'status':'PASS','commit':source,'run_id':run,'api':api}
            pair[str(api)]=dict(identity,scope=scope,stages=stages[:],release_ready=False,
              durable_upgrade_ready=False,native_saf='SYNTHETIC_IMAGE_MULTIPAGE_ONLY',elapsed_seconds=1,
              native_image_pages=native_sample(api,source,run),
              codec=dict(identity,paged_exports=dict(identity,checks=29,labels=PAGED_BACKEND_LABELS[:],
                preview_ui={'checks':22,'labels':PAGED_PREVIEW_LABELS[:]})))
          assert matrix(pair)
          negative=0
          def reject(value):
            global negative
            assert not matrix(value),'independent probe observer accepted incomplete evidence'
            negative+=1
          reject({});reject({'26':pair['26']});reject(dict(pair,extra={}))
          for api in ('26','34'):
            for key,value in [('status','FAIL'),('commit','old'),('run_id','old'),('api',True),('stages',stages[:-1]),
                              ('release_ready',True),('native_saf','PASS'),('elapsed_seconds',0),('codec',None),('native_image_pages',None)]:
              bad=copy.deepcopy(pair);bad[api][key]=value;reject(bad)
            for preview in (False,True):
              labels=PAGED_PREVIEW_LABELS if preview else PAGED_BACKEND_LABELS
              for i in range(len(labels)):
                bad=copy.deepcopy(pair);target=bad[api]['codec']['paged_exports']
                if preview:target=target['preview_ui']
                del target['labels'][i];target['checks']-=1;reject(bad)
          devices={}
          for api in (26,34):
            path=Path('collected')/('export-probe-api-'+str(api))/'export-probe.json'
            try:
              assert path.stat().st_size<=2*1024*1024
              devices[str(api)]=json.loads(path.read_bytes())
            except (OSError,ValueError,AssertionError) as exc:
              devices[str(api)]={'status':'NOT_VERIFIED','error':repr(exc)}
          passed=matrix(devices)
          doc={'commit':source,'run_id':run,'status':'PASS' if passed else 'NOT_VERIFIED',
            'scope':scope,'devices':devices,'observer_controls':{'positive':1,'negative':negative,'native_positive':1,'native_negative':native_negative,'loss_positive':1,'loss_negative':loss_negative},
            'release_ready':False,'durable_upgrade_ready':False}
          data=(json.dumps(doc,ensure_ascii=False,indent=2)+'\n').encode()
          endpoint='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'
          def api(path,method='GET',body=None):
            request=urllib.request.Request(endpoint+path,method=method,
              data=None if body is None else json.dumps(body).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          path='reports/export-probe-'+source+'-'+run+'.json'
          body={'message':'Record independent export probe, not full regression','branch':'evidence',
            'content':base64.b64encode(data).decode()}
          try:body['sha']=api('contents/'+path+'?ref=evidence')['sha']
          except urllib.error.HTTPError as exc:
            if exc.code!=404:raise
          written=api('contents/'+path,'PUT',body)
          actual=api('contents/'+path+'?ref='+written['commit']['sha'])
          assert base64.b64decode(actual['content'])==data
          print('EXPORT_PROBE_EVIDENCE '+actual['html_url'],flush=True)
          assert passed,'independent export probe missing or failed; full regression is also still required'
          PY
      - name: Publish and read back evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/verify.py report
      - name: Publish and require independently observed schema3 storage contracts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/verify_schema3.py report
      - name: Require actual guarded restore and SAF UI coverage
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('collected/scope/ui-result.json')
          assert path.exists(),'Guarded restore evidence missing, not a pass'
          doc=json.loads(path.read_text())
          assert doc.get('guarded_restore',{}).get('status')=='PASS','Guarded restore checks missing or failed; read published evidence'
          assert doc.get('saf_restore_ui')=='PASS','SAF restore preview and explicit confirmation missing or failed; read native evidence'
          assert json.loads(Path('collected/scope/codec-result.json').read_text()).get('status')=='PASS','Android codec coverage missing or failed'
          assert json.loads(Path('collected/scope/legacy-schema2-result.json').read_text()).get('status')=='PASS','Frozen schema2 compatibility missing or failed; read legacy evidence'
          PY
      - name: Require both current-source devices before preview delivery
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          needs=json.loads(os.environ['NEEDS_JSON'])
          assert all(needs[name]['result']=='success' for name in ('core','database','export_probe','export_feedback'))
          legacy=json.loads(Path('collected/scope/legacy-schema2-result.json').read_text())
          assert legacy['status']=='PASS' and legacy['commit']==os.environ['GITHUB_SHA'] and legacy['run_id']==os.environ['GITHUB_RUN_ID']
          report=json.loads(Path('collected/scope/ui-result.json').read_text())
          assert report['status']=='PASS' and report['release_ready'] is False
          for api in ('26','34'):
            n=report['native'][api];d=report['devices'][api]['result']
            assert n['status']=='PASS' and n['count']==len(n['checks']) and n['count']>=164
            assert d['status']=='PASS' and d['checks']=={'seed':155,'reopen':25}
          folder=Path('collected/internal-preview-candidate')
          meta=json.loads((folder/'preview.json').read_text())
          assert meta['commit']==os.environ['GITHUB_SHA'] and meta['run_id']==os.environ['GITHUB_RUN_ID']
          assert meta['release_ready'] is False and meta['durable_upgrade_ready'] is False
          assert {p.name for p in folder.iterdir()}=={meta['apk'],'preview.json','SHA256SUMS.txt','signature.txt','package.txt','README.txt'}
          data=(folder/meta['apk']).read_bytes()
          assert len(data)==meta['bytes'] and hashlib.sha256(data).hexdigest()==meta['sha256']
          print('PREVIEW_DELIVERY_GATE_PASS; complete V1.2 remains blocked')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: preview
        with:
          name: PocketTodo-v1.2-preview-${{ github.sha }}
          path: collected/internal-preview-candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Download preview archive and prove exact bytes before publishing receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.preview.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.preview.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.preview.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,os,urllib.request,urllib.error,urllib.parse,zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          endpoint='https://api.github.com/repos/'+repo+'/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def api(path,method='GET',body=None):
            req=urllib.request.Request(endpoint+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          artifact=api('actions/artifacts/'+os.environ['ARTIFACT_ID'])
          assert not artifact['expired'] and str(artifact['workflow_run']['id'])==os.environ['GITHUB_RUN_ID']
          assert artifact['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,h,newurl):return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
            opener.open(urllib.request.Request(endpoint+'actions/artifacts/'+os.environ['ARTIFACT_ID']+'/zip',headers=headers),timeout=30)
            raise AssertionError('Expected signed archive redirect')
          except urllib.error.HTTPError as exc:
            assert exc.code==302
            location=exc.headers['Location']
          assert urllib.parse.urlparse(location).scheme=='https'
          # Signed storage download is a new request: NEVER forward the GitHub token.
          with urllib.request.urlopen(location,timeout=60) as response:
            archive=response.read(artifact['size_in_bytes']+1)
          archive_hash=hashlib.sha256(archive).hexdigest()
          assert archive_hash==os.environ['ARTIFACT_DIGEST']
          assert artifact['digest']=='sha256:'+archive_hash
          folder=Path('collected/internal-preview-candidate')
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
            expected={p.name:p.read_bytes() for p in folder.iterdir()}
            assert len(z.namelist())==len(expected) and set(z.namelist())==set(expected)
            for name,data in expected.items():assert z.read(name)==data,'download differs: '+name
          meta=json.loads((folder/'preview.json').read_text())
          meta.update(status='PASS',scope='TESTED_STAGE_PREVIEW_NOT_FULL_V12',artifact_id=artifact['id'],download_url=os.environ['ARTIFACT_URL'],expires_at=artifact['expires_at'],archive_sha256=archive_hash,download_readback='EXACT_ALL_FILES_PASS',github_login_required=True)
          data=(json.dumps(meta,ensure_ascii=False,indent=2)+'\n').encode()
          path='reports/preview-'+os.environ['GITHUB_SHA']+'-'+os.environ['GITHUB_RUN_ID']+'.json'
          written=api('contents/'+path,'PUT',{'message':'Record verified staged APK download','branch':'evidence','content':base64.b64encode(data).decode()})
          actual=api('contents/'+path+'?ref='+written['commit']['sha'])
          assert base64.b64decode(actual['content'])==data
          print('PREVIEW_DOWNLOAD '+os.environ['ARTIFACT_URL'])
          print('PREVIEW_RECEIPT '+actual['html_url'])
          PY
