                  def click_execute(code):
                      (p/"ClickOracle.java").write_text(click_harness.replace("__METHOD__",code))
                      return subprocess.run(["java",str(p/"ClickOracle.java")],capture_output=True,text=True,timeout=30)
                  click_result=click_execute(click_method)
                  assert click_result.returncode==0,(click_result.stdout,click_result.stderr)
                  print(click_result.stdout.strip())
                  for old,new,label in (
                      ('need(box.isChecked()!=before,"checkbox toggled "+value);',';',"reject_no_toggle_false"),
                      ('need(v.performClick(),"click handled "+value);','v.performClick();',"reject_unhandled_button"),
                      ('box.performClick();','box.performClick();box.performClick();',"checked_listener_only_on"),
