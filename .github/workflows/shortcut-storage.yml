name: Recover original post-DDL crash evidence
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read original archives only, no device rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,zipfile
          REPO="supercubegame/todo-pocket-android"
          RUN=38871586910
          HEAD="10b90458f365931e6d87df0d389fabca9a9f09d9"
          ITEMS=[
           (12034895391,"shortcut-device-api-26","0f2f018adead0861bf736089d0f489c237ec76b9942def69dd4ecfc23f2552b0"),
           (12034347759,"shortcut-device-api-34","764f2c63feec8d3d7f338f93e053b73b3fbc40ac4089e91c2989aa046be61971")]
          def api(path,value=None):
              command=["gh","api","repos/"+REPO+"/"+path]
              if value is not None:command+=["--method","POST","--input","-"]
              return subprocess.run(command,input=None if value is None else json.dumps(value).encode(),
                  capture_output=True,timeout=60,check=True).stdout
          def checked(raw,digest):
              assert hashlib.sha256(raw).hexdigest()==digest,"archive digest"
              z=zipfile.ZipFile(io.BytesIO(raw));names=z.namelist()
              assert len(names)==len(set(names)) and len(names)<=300,"member identity"
              assert sum(i.file_size for i in z.infolist())<=16*1024*1024,"expanded budget"
              assert all(not n.startswith("/") and ".." not in pathlib.PurePosixPath(n).parts for n in names),"member path"
              assert z.testzip() is None,"CRC"
              return z
          def fixture(name):
              out=io.BytesIO()
              with zipfile.ZipFile(out,"w") as z:z.writestr(name,b"test")
              return out.getvalue()
          good=fixture("safe");checked(good,hashlib.sha256(good).hexdigest())
          for raw,digest in [(good,"0"*64),(fixture("../escape"),None),(fixture("/absolute"),None)]:
              try:checked(raw,digest or hashlib.sha256(raw).hexdigest())
              except AssertionError:pass
              else:raise AssertionError("bad archive accepted")
          def publish(name,text):
              assert len(text.encode())<55000,"publication budget"
              value={"name":name,"head_sha":os.environ["GITHUB_SHA"],"status":"completed","conclusion":"success",
                  "output":{"title":"ORIGINAL_CRASH_EVIDENCE_NOT_ACCEPTANCE",
                  "summary":"Source run 38871586910 attempt 1. Device reruns=0; product pushes=0.",
                  "text":text}}
              made=json.loads(api("check-runs",value));seen=json.loads(api("check-runs/"+str(made["id"])))
              assert seen["head_sha"]==value["head_sha"] and seen["output"]==dict(seen["output"],**value["output"])
          assert os.environ["GITHUB_REPOSITORY"]==REPO and os.environ["GITHUB_RUN_ATTEMPT"]=="1"
          run=json.loads(api("actions/runs/"+str(RUN)))
          assert run["head_sha"]==HEAD and run["run_attempt"]==1 and run["conclusion"]=="failure"
          out=pathlib.Path("original-postddl");out.mkdir()
          manifest=[]
          for aid,name,digest in ITEMS:
              meta=json.loads(api("actions/artifacts/"+str(aid)))
              assert meta["name"]==name and not meta["expired"] and meta["digest"]=="sha256:"+digest
              assert meta["workflow_run"]["id"]==RUN and meta["workflow_run"]["head_sha"]==HEAD
              raw=api("actions/artifacts/"+str(aid)+"/zip")
              assert len(raw)==meta["size_in_bytes"]
              z=checked(raw,digest);(out/(name+".zip")).write_bytes(raw)
              rows=[]
              for index,n in enumerate(z.namelist()):
                  data=z.read(n);identity={"name":n,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}
                  rows.append(identity)
                  if n.endswith((".log",".txt",".json",".stdout",".stderr")):
                      try:text=data.decode("utf-8","strict")
                      except UnicodeDecodeError:continue
                      # Publish all original text in bounded parts; never just the tail.
                      parts=[text[i:i+10000] for i in range(0,len(text),10000)] or [""]
                      assert len(parts)<=100,"member publication budget"
                      for part,body in enumerate(parts):
                          publish(name+" member "+str(index)+" part "+str(part+1)+"/"+str(len(parts)),
                              json.dumps(identity)+"\n```text\n"+body+"\n```")
              manifest.append({"id":aid,"name":name,"sha256":digest,"members":rows})
          text=json.dumps(manifest,indent=2);(out/"manifest.json").write_text(text)
          publish("Original post-DDL archive manifest","```json\n"+text+"\n```")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-postddl-crash
          path: original-postddl/
          if-no-files-found: error
          retention-days: 14
