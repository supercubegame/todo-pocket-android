          def validate_appended_text(before,after,note):
              old,media=before;actual,current_media=after
              assert old.keys()==actual.keys() and current_media==media
              ids={r[2] for r in old['blocks']}
              added=[r for r in actual['blocks'] if r[2] not in ids]
              assert len(added)==1
              new_id=added[0][2]
              assert isinstance(new_id,str) and re.fullmatch('[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}',new_id)
              templates=[r for r in old['blocks'] if r[1]==note and r[4]=='TEXT']
              assert len(templates)==1
              row=list(templates[0]);row[0]=max(r[0] for r in old['blocks'])+1
              row[2]=new_id;row[3]=len([r for r in old['blocks'] if r[1]==note]);row[5]='Appended draft'
              expected=copy.deepcopy(old);expected['blocks'].append(tuple(row))
