              assert receipt['after']=='0', ('punctuation setting not applied',receipt)
              receipt['scope']='DISPOSABLE_EMULATOR_INPUT_NOT_DEFAULT_KEYBOARD_ACCEPTANCE'
          def enter_literal_text(shell,value):
              # ASCII fixture editing, not an IME acceptance test. Seed trailing spaces
              # in the empty field, then insert the prefix before them. Keep exact oracle.
              assert '  ' not in value.strip(' '), 'internal double spaces not supported by this fixture'
              prefix=value.rstrip(' ');suffix=value[len(prefix):]
              if prefix and len(suffix)>=2:
                  shell('input','text',suffix.replace(' ','%s'))
                  shell('input','keyevent','KEYCODE_MOVE_HOME')
                  shell('input','text',prefix.replace(' ','%s'))
