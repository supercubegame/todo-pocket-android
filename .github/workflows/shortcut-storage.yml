name: Recover exact original product evidence
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Restore exact tested reader and recover original evidence only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/84b246aaa94a58dd8b3864f1fdeec13e7a1e6245/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as response:raw=response.read(11478)
          assert len(raw)==11477 and hashlib.sha256(raw).hexdigest()=="2e80bc2e78d91b1408a0293c76cb5db7e1fc93c7920d86a6d7c371a415b6a9b0"
          old=b"883f8bfb450cab8bcec28e4d9855b91e64c7f9c3ae5f9ba3d5d0fc92a7041"
          new=b"883f8bfb450cab8bcebcec28e4d9855b91e64c7f9c3ae5f9ba3d5d0fc92a7041"
          assert raw.count(old)==1 and len(old)==61 and len(new)==64
          restored=raw.replace(old,new)
          assert len(restored)==11480 and hashlib.sha256(restored).hexdigest()=="1292fb4c1e27e1d30a25eb000bb14057c7cc4d9708e50f83de8c882f9cd9fe7b"
          body=restored.decode().split("          python3 - <<'PY'\n",1)[1].split("          PY\n",1)[0]
          assert all(not line or line.startswith("          ") for line in body.splitlines())
          source="\n".join(line[10:] for line in body.splitlines())+"\n"
          assert hashlib.sha256(source.encode()).hexdigest()=="8005bf0a4cddf3596e1251f7b47aac590f6f8b7e741c33f462f8364cd690eddc"
          ast.parse(source)
          scope={"__name__":"recovery"}
          exec(compile(source,"exact-tested-recovery","exec"),scope)
          assert all(len(row[4])==64 for row in scope["ITEMS"])
          scope["main"]()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-product-regression
          path: original-product-regression/
          if-no-files-found: error
          retention-days: 14
