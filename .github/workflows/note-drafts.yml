          def native(adb):
              prefix=[str(adb),'-s',gate.SERIAL];serial=0
              result['ui_observer']={}
              observer=Observer(adb,gate.SERIAL,gate.SDK,out,result['ui_observer'])
              def command(*args,binary=False):
                  trace={}
