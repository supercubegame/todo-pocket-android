          check(new CheckBox(true,false,true),true,"checked_listener_only_off");
          check(new CheckBox(false,true,true),true,"checked_and_click_listener");
          check(new View(true),true,"button_handled");
          check(new CheckBox(false,false,false),false,"reject_no_toggle_false");
          check(new CheckBox(false,true,false),false,"reject_no_toggle_true");
