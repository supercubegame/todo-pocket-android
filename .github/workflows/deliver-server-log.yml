name: Detail navigation guarded delivery
on:
  push:
    branches: [diagnostic/server-log-delivery-20261008]
    paths: [.github/workflows/deliver-server-log.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: bounded-server-log-delivery-20261008
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'supercubegame/todo-pocket-android' && github.ref == 'refs/heads/diagnostic/server-log-delivery-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Validate and submit bounded batch summary scanner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,lzma,subprocess,textwrap
          from pathlib import Path
          parent="c5b0f128f489b6022067ef7c0f8594e0bf8dfbc1"
          raw=subprocess.check_output(["git","show",parent+":.github/workflows/deliver-server-log.yml"],timeout=30)
          assert len(raw)==6444 and hashlib.sha256(raw).hexdigest()=="2c4e946e56cbfa1cab34a1c0d49123cdda4f135dc098394b32147866923632a4"
          start="          python3 - <<'PY'\n"
          assert raw.decode().count(start)==1
          code=raw.decode().split(start,1)[1].split("          PY\n",1)[0]
          tree=ast.parse(textwrap.dedent(code))
          assert ast.unparse(tree.body[-1])=="ns['main'](ns['PAYLOAD'])"
          tree.body.pop()
          inherited={"__name__":"verified_previous_delivery"}
          exec(compile(tree,"<pinned-successful-delivery>","exec"),inherited)
          ns=inherited["ns"]
          
          decoder=lzma.LZMADecompressor(memlimit=134217728)
          payload_bytes=decoder.decompress(base64.b64decode('',validate=True),max_length=23711)
          assert decoder.eof and not decoder.unused_data and len(payload_bytes)==23710
          assert hashlib.sha256(payload_bytes).hexdigest()=='50354048e9f9b01dc9feec4e855b7230cca941dc294067fd5eda20e160036dc5'
          
          import json
          payload=json.loads(payload_bytes)
          assert set(payload)=={"additions.py","build_patch.py"}
          builder={"__name__":"exact_detail_patch"}
          exec(compile(payload["build_patch.py"],"<detail-builder>","exec"),builder)
          current="bafb9e3e0edb28eccb916d382b33946d86faa32b"
          path="tools/verify_batch_exports.py"
          def unpack(value):
              assert value is payload_bytes
              return payload
          def integrate(repo,value,git):
              assert value==payload
              original=git("show",current+":"+path)
              assert (repo/path).read_bytes()==original
              builder["original_red"](original)
              candidate=builder["assemble"](original,payload["additions.py"])
              ast.parse(candidate)
              (repo/path).write_bytes(candidate)
              assert git("diff","--name-only").decode().splitlines()==[path]
              return {path:candidate}
          def integration_controls(work,repo,value,candidates,env,receipt,save):
              original=subprocess.check_output(["git","show",current+":"+path],cwd=repo,timeout=30)
              assert builder["assemble"](original,value["additions.py"])==candidates[path]
              for bad in (original[:-1],original+b"\n",bytes([original[0]^1])+original[1:]):
                  try:builder["assemble"](bad,value["additions.py"])
                  except AssertionError:pass
                  else:raise AssertionError("wrong baseline accepted")
              receipt["integration_controls"]={"positive":1,"negative":3,"original_geometry_red":"WITNESSED_NOT_DEVICE_REPLAY"}
              save()
          ns.update(BASE=current,CURRENT=current,PARENT=parent,
                    PINS={path:"c707b21467cc14bce0744643179d48224949a02e"},
                    unpack=unpack,integrate=integrate,test_original_and_integration=integration_controls)
          # Preserve the complete tested publisher, changing only its commit message.
          publisher=next(n for n in ast.parse(inherited["s"]).body if isinstance(n,ast.FunctionDef) and n.name=="publish")
          old="test: bound batch summary scrolling to observed viewport"
          matches=[n for n in ast.walk(publisher) if isinstance(n,ast.Constant) and n.value==old]
          assert len(matches)==1
          matches[0].value="test: bound order and deletion detail navigation to measured viewport"
          exec(compile(ast.Module(body=[publisher],type_ignores=[]),"<same-guarded-publisher>","exec"),ns)
          ns["main"](payload_bytes)
          PY
      - name: Preserve delivery and original host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-summary-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/catalog-forward-repair/receipt.json
            ${{ runner.temp }}/catalog-forward-repair/host-*.log
          if-no-files-found: error
          retention-days: 14
