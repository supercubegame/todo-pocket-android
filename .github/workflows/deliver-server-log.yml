name: Stable preview upgrade guarded delivery
on:
  push:
    branches: [diagnostic/server-log-delivery-20261008]
    paths: [.github/workflows/deliver-server-log.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: bounded-server-log-delivery-20261008
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'supercubegame/todo-pocket-android' && github.ref == 'refs/heads/diagnostic/server-log-delivery-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Validate and submit stable signing and retained-data upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,json,lzma,subprocess,textwrap
          parent="f04e4b4ccff0bc8a3c5e86630996c920a4b7c0d6"
          raw=subprocess.check_output(["git","show",parent+":.github/workflows/deliver-server-log.yml"],timeout=30)
          assert len(raw)==17551 and hashlib.sha256(raw).hexdigest()=="970a4c0f1312a2be9ae7e49ccb5961030261c5394ad4414ebd2fa2144c61618d"
          marker="          python3 - <<'PY'\n"
          assert raw.decode().count(marker)==1
          code=textwrap.dedent(raw.decode().split(marker,1)[1].split("          PY\n",1)[0])
          tree=ast.parse(code)
          assert ast.unparse(tree.body[-1])=="ns['main'](payload)"
          tree.body.pop()
          inherited={"__name__":"pinned_archive_publisher"}
          exec(compile(tree,"<pinned-archive-publisher>","exec"),inherited)
          ns=inherited["ns"]
          decoder=lzma.LZMADecompressor(memlimit=134217728)
          bundle=decoder.decompress(base64.b64decode('',validate=True),max_length=68599)
          assert decoder.eof and not decoder.unused_data and len(bundle)==68598 and hashlib.sha256(bundle).hexdigest()=='1cea08e63b443ad42467b1c2ec82c98de9bdff51f8a47b73d87a87351b54e92b'
          bundle=json.loads(bundle)
          assert set(bundle)=={"overrides","payload"}
          exec(compile(bundle["overrides"],"<stable-upgrade-overrides>","exec"),ns)
          ns.update(BASE="c5a73f17ddb1f7cb0403f7a755da7aa578bd66f1",CURRENT="c5a73f17ddb1f7cb0403f7a755da7aa578bd66f1",
                    PARENT=parent,PINS={"build.gradle":"347a3b7f403c36925ced604fbda3269ab65a48b6",
                      ".github/workflows/android.yml":"a4c8e9384f88270b8562c17a3000d0cf877cd019","tools/verify_upgrade.py":None})
          publisher=ns["publish"]
          old="test: verify archived legacy PNG references across migration and backup"
          assert publisher.__code__.co_consts.count(old)==1
          publisher.__code__=publisher.__code__.replace(co_consts=tuple(
           "ci: require fixed preview signing and independent retained-data upgrade" if c==old else c for c in publisher.__code__.co_consts))
          ns["main"](bundle["payload"].encode())
          PY
      - name: Preserve delivery and original host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-summary-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/catalog-forward-repair/receipt.json
            ${{ runner.temp }}/catalog-forward-repair/host-*.log
          if-no-files-found: error
          retention-days: 14
