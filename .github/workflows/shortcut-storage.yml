name: Confirmed paged receiver delivery
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions: {contents: write, actions: write, checks: write}
concurrency: {group: shortcut-business-bridge-delivery, cancel-in-progress: false}
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 9eafa27bbcbd5ef4bff8a0e592d4f0122de8eb80, persist-credentials: false}
      - name: Verify compiler and fixed six-file candidate before enabling delivery
        env:
          ORIGINAL_DRIVER_SHA: cc83f9374afd35c87252fe189c6ea7afaf7e985cc8eb9a9c9dc48ffca3fed58c
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP"
          mkdir java-release-control
          printf '%s\n' 'class Valid { java.util.List<String> v; }' > java-release-control/Valid.java
          "$JAVA_HOME_17_X64/bin/javac" --release 8 java-release-control/Valid.java
          printf '%s\n' 'class Invalid { Object v = java.util.List.of(1); }' > java-release-control/Invalid.java
          if "$JAVA_HOME_17_X64/bin/javac" --release 8 java-release-control/Invalid.java > java-release-control/negative.log 2>&1; then exit 1; fi
          grep -q 'cannot find symbol' java-release-control/negative.log
