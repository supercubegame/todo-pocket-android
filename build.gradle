plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'com.supercubegame.pockettodo'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.supercubegame.pockettodo.v12'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
        testInstrumentationRunner 'com.supercubegame.pockettodo.V12DeviceTest'
    }
    buildTypes {
        debug { applicationIdSuffix '.preview' }
        release { minifyEnabled false }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
    sourceSets {
        androidTest.manifest.srcFile layout.buildDirectory.file('schema3-test/AndroidManifest.xml').get().asFile
    }
}
// Generated build helper, not another repository source path. The existing runner
// remains registered by AGP; the second runner has a distinct manifest name key.
def schema3Manifest = tasks.register('generateSchema3TestManifest') {
    def target = layout.buildDirectory.file('schema3-test/AndroidManifest.xml')
    outputs.file(target)
    doLast {
        def file = target.get().asFile
        file.parentFile.mkdirs()
        file.text = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <instrumentation android:name="com.supercubegame.pockettodo.Schema3DeviceTest" android:targetPackage="com.supercubegame.pockettodo.v12.preview" />
</manifest>
'''
    }
}
tasks.named('preBuild').configure { dependsOn(schema3Manifest) }
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
