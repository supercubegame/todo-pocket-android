name: Single pinned API34 relation input diagnostic
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TEST_API: '34'
      POCKET_STABLE_SIGNING: '1'
      PRODUCT_SHA: ebd022b4581846ee03eec13ff0b067b9fd0eab66
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ebd022b4581846ee03eec13ff0b067b9fd0eab66
          persist-credentials: false
      - name: Prepare exact temporary diagnostic and original script blocks
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 - <<'PY'
          import ast,base64,hashlib,pathlib,zlib
          raw=zlib.decompress(base64.b64decode(""))
          assert len(raw)==9219 and hashlib.sha256(raw).hexdigest()=="09f6773e7b4a9d14b9d7309b28033a953cd868a78566312276320fcf6d342f3b"
          ast.parse(raw)
          pathlib.Path("prepare-diagnostic.py").write_bytes(raw)
          PY
          python3 prepare-diagnostic.py 2>&1 | tee prepare.log
      - name: Original isolated tracing controls
        run: bash relation-diagnostic/isolated_trace_setup.sh
      - name: Initialize fixed signing directory
        run: echo "POCKET_SIGNING_DIR=$RUNNER_TEMP/pocket-signing-34" >> "$GITHUB_ENV"
      - name: Original fixed Android build setup
        run: bash relation-diagnostic/upgrade_build_setup.sh
      - name: Require fixed preview signing without fallback
        env:
          POCKET_PREVIEW_KEYSTORE_B64: ${{ secrets.POCKET_PREVIEW_KEYSTORE_B64 }}
          POCKET_PREVIEW_STORE_PASSWORD: ${{ secrets.POCKET_PREVIEW_STORE_PASSWORD }}
          POCKET_PREVIEW_KEY_ALIAS: ${{ secrets.POCKET_PREVIEW_KEY_ALIAS }}
          POCKET_PREVIEW_KEY_PASSWORD: ${{ secrets.POCKET_PREVIEW_KEY_PASSWORD }}
          POCKET_PREVIEW_CERT_SHA256: ${{ secrets.POCKET_PREVIEW_CERT_SHA256 }}
        run: python3 tools/verify_upgrade.py prepare-signing
      - name: Original build and lint
        env:
          BUILD_429_EXECUTE: 'true'
          BUILD_LOG: build.log
          BUILD_LINT: 'true'
        run: GITHUB_SHA="$PRODUCT_SHA" bash relation-diagnostic/verified_build.sh
      - name: One original command with diagnostic hooks, never acceptance
        run: |
          set -euo pipefail
          export GITHUB_SHA="$PRODUCT_SHA"
          set +e
          python3 tools/verify_schema3.py android 2>&1 | tee ui.log
          codes=("${PIPESTATUS[@]}")
          rc=${codes[0]}
          set -e
          printf '{"attempts":1,"exit_code":%s,"scope":"DIAGNOSTIC_NOT_ACCEPTANCE"}\n' "$rc" > relation-diagnostic/device-exit.json
          test "${codes[1]}" = 0
          exit "$rc"
      - name: Publish bounded exact diagnostic receipts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('relation-diagnostic');root.mkdir(exist_ok=True)
          index=[]
          def api(path,value=None):
              assert path=='check-runs' or path.startswith('check-runs/')
              args=['gh','api','repos/supercubegame/todo-pocket-android/'+path]
              if value is not None:args+=['--method','POST','--input','-']
              return json.loads(subprocess.run(args,input=None if value is None else json.dumps(value).encode(),
                  capture_output=True,check=True,timeout=60).stdout)
          def publish(name,text):
              parts=[text[i:i+10000] for i in range(0,len(text),10000)] or ['']
              assert len(parts)<=100 and ''.join(parts)==text
              ids=[]
              for i,part in enumerate(parts):
                  output=dict(title='DIAGNOSTIC_ONLY_NOT_ACCEPTANCE',summary='Single API34 diagnostic; original ebd022 product unchanged; no phone, merge or release.',text=part)
                  value=dict(name=name+' '+str(i+1)+'/'+str(len(parts)),head_sha=os.environ['GITHUB_SHA'],
                             status='completed',conclusion='success',output=output)
                  made=api('check-runs',value);seen=api('check-runs/'+str(made['id']))
                  assert seen['head_sha']==value['head_sha'] and all(seen['output'][k]==v for k,v in output.items())
                  ids.append(made['id'])
              index.append(dict(name=name,bytes=len(text.encode()),sha256=hashlib.sha256(text.encode()).hexdigest(),checks=ids))
              (root/'publication-index.json').write_text(json.dumps(index,indent=2))
          manifest=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  b=p.read_bytes();manifest.append(dict(path=str(p),bytes=len(b),sha256=hashlib.sha256(b).hexdigest()))
          publish('Relation diagnostic manifest',json.dumps(manifest,indent=2))
          for name in ('binding.json','device-exit.json','events.json'):
              p=root/name
              publish('Relation diagnostic '+name,p.read_text() if p.exists() else 'NOT_OBSERVED '+name)
          for name in ('prepare.log','build.log','ui.log'):
              p=Path(name)
              if p.exists():
                  b=p.read_bytes();text=b.decode('utf-8','replace')
                  publish('Relation diagnostic '+name,json.dumps(dict(bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),
                      omitted_characters=max(0,len(text)-20000)))+'\n'+text[-20000:])
          publish('Relation diagnostic publication index',json.dumps(index,indent=2))
          assert (root/'events.json').exists(),'diagnostic target never observed'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: relation-input-api34-diagnostic
          path: |
            relation-diagnostic/
            prepare.log
            build.log
            setup.log
            ui.log
            emulator.log
            device-*.txt
            device-result.json
            native-ui/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: python3 tools/verify_upgrade.py cleanup-signing
