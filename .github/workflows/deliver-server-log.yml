name: Authorized bounded server log delivery
on:
  push:
    branches: [diagnostic/server-log-delivery-20261008]
    paths: [.github/workflows/deliver-server-log.yml]
permissions:
  contents: read
concurrency:
  group: bounded-server-log-delivery-20261008
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'supercubegame/todo-pocket-android' && github.ref == 'refs/heads/diagnostic/server-log-delivery-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require actual tracer without retry
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null 2>&1; then
            timeout 90s sudo apt-get -o Acquire::Retries=0 update
            timeout 60s sudo apt-get -o Acquire::Retries=0 install --no-install-recommends -y strace
          fi
          strace --version
      - name: Verify authorized credential on isolated ref before product submission
        env:
          GH_TOKEN: ${{ secrets.POCKET_DELIVERY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import base64
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          
          SOURCE = "81f448f28d072dfa2a98d1d79c732ce635895fca"
          PARENT = "2ae52bb0e3ab136ed380fb136f9717e84aae1158"
          OLD_BLOB = "6d7656b5541a3af2db8e26e2eae0f73b17e328c1"
          OLD_SHA256 = "07fade1a06ca4c8cdaf7699d6174f04cc32df963cd61f49b306dcd02aa0032ec"
          WORKFLOW = ".github/workflows/deliver-server-log.yml"
          
          def build(data):
              assert len(data) == 25341, "Historical delivery size mismatch"
              assert hashlib.sha1(b"blob 25341\0"+data).hexdigest() == OLD_BLOB
              assert hashlib.sha256(data).hexdigest() == OLD_SHA256
              text = data.decode()
              start = "          python3 - <<'PY'\n"
              end = "          PY\n"
              assert text.count(start) == text.count(end) == 1
              lines = text.split(start)[1].split(end)[0].splitlines(True)
              assert all(line.startswith("          ") for line in lines)
              code = "".join(line[10:] for line in lines)
              def replace(old, new):
                  nonlocal code
                  assert code.count(old) == 1, "Historical script boundary mismatch"
                  code = code.replace(old,new,1)
              replace('assert git("rev-parse",HEAD+"^")==BASE, "Unexpected bootstrap parent"',
                      'assert git("rev-parse",HEAD+"^")=="'+PARENT+'", "Unexpected authorized bootstrap parent"')
              replace('TOKEN = os.environ["GH_TOKEN"]',
                      'TOKEN = os.environ["GH_TOKEN"]\nassert TOKEN.strip(), "POCKET_DELIVERY_TOKEN is missing; no fallback"\nAUTH = base64.b64encode(("x-access-token:"+TOKEN).encode()).decode()\nprint("::add-mask::"+TOKEN)\nprint("::add-mask::"+AUTH)')
              replace('error=value.stderr.decode(errors="replace").replace(TOKEN,"[REDACTED]")',
                      'error=value.stderr.decode(errors="replace").replace(TOKEN,"[REDACTED]").replace(AUTH,"[REDACTED]")')
              replace('receipt["error"]=str(exc).replace(TOKEN,"[REDACTED]")[-4000:]',
                      'receipt["error"]=str(exc).replace(TOKEN,"[REDACTED]").replace(AUTH,"[REDACTED]")[-4000:]')
              replace('    raise\n', '    raise RuntimeError("Delivery stopped; inspect retained receipt") from None\n')
              replace('assert "  workflow_dispatch:\\n" in header, "Existing CI dispatch unavailable"',
                      'assert "  push:\\n    branches: [feature/v1.2-activity-notes-ledger]\\n" in header and "paths:" not in header and "paths-ignore:" not in header, "Existing CI push binding changed"')
              left = "    def dispatch():\n"
              right = "    sequence(check,probe_write,probe_verify,product_write,product_verify,dispatch)\n"
              assert code.count(left)==code.count(right)==1
              old = code.split(left)[1].split(right)[0]
              replace(left+old, left+'''        # The authorized PAT push triggers existing workflows. Do not duplicate dispatch.
                  receipt["ci"]={"trigger":"AUTHORIZED_PAT_PUSH","expected_commit":product,
                                 "workflows":list(WORKFLOWS),"status":"EXPECTED_NOT_YET_OBSERVED"}
                  receipt["status"]="SUBMITTED_REMOTE_VERIFIED_PUSH_CI_PENDING"
                  save()
          ''')
              ast.parse(code)
              assert "/dispatches" not in code
              assert 'push(probe,BRANCH)' in code and 'push(product,PRODUCT)' in code
              assert 'verify_remote(probe)' in code and 'verify_remote(product)' in code
              return code
          
          def controls(data):
              code = build(data)
              for bad in (data[:-1],data+b"x",data.replace(b"timeout=30",b"timeout=31",1)):
                  assert bad != data
                  try:
                      build(bad)
                  except AssertionError:
                      pass
                  else:
                      raise AssertionError("Corrupt historical source accepted")
              exec(compile(code.split("# LOCAL_CONTROLS_END")[0],"<delivery-controls>","exec"),{})
              # Raw and encoded credentials must both disappear from retained errors.
              sentinel = "SENTINEL_NOT_A_REAL_SECRET"
              auth = base64.b64encode(("x-access-token:"+sentinel).encode()).decode()
              raw = "failure "+sentinel+" "+auth
              redacted = raw.replace(sentinel,"[REDACTED]").replace(auth,"[REDACTED]")
              assert sentinel not in redacted and auth not in redacted
              print("AUTHORIZED_LOADER exact_source=1 corruptions=3 credential_redaction=2 PASS")
              return code
          
          if __name__ == "__main__":
              assert os.environ["GITHUB_REPOSITORY"] == "supercubegame/todo-pocket-android"
              assert os.environ["GITHUB_REF"] == "refs/heads/diagnostic/server-log-delivery-20261008"
              assert os.environ["GITHUB_RUN_ATTEMPT"] == "1"
              assert os.environ.get("GH_TOKEN","").strip(), "Required delivery Secret missing; no fallback"
              source = subprocess.run(["git","show",SOURCE+":"+WORKFLOW],check=True,
                                      stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30).stdout
              code = controls(source)
              exec(compile(code,"<pinned-authorized-delivery>","exec"),{"__name__":"__main__"})
          PY
      - name: Preserve exact delivery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-log-authorized-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/server-log-delivery/receipt.json
            ${{ runner.temp }}/server-log-delivery/*.log
          if-no-files-found: warn
