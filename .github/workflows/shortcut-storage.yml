      - name: Original regressions plus actual native default startup
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/crash-observer.py" <<'OBSERVER'
          import hashlib,json,os,pathlib,subprocess,sys,threading,time

          def observe(command,folder,stop,budget=1800,limit=4*1024*1024):
              started=time.monotonic()
              result={"command":command,"attempts":1,"status":"START_FAILED"}
              with open(str(folder)+".stdout","wb") as out,open(str(folder)+".stderr","wb") as err:
                  process=None
                  try:
                      process=subprocess.Popen(command,stdout=out,stderr=err)
                      while True:
                          code=process.poll()
                          if max(out.tell(),err.tell())>limit:
                              result["status"]="LIMIT_EXCEEDED";break
                          if code is not None:
                              result.update(status="EXITED",returncode=code);break
                          if stop.is_set():
                              result["status"]="STOPPED_AFTER_ORIGINAL";break
                          if time.monotonic()-started>=budget:
                              result["status"]="TIMED_OUT";break
                          time.sleep(.05)
                  except Exception as error:
                      result["error"]=repr(error)
                  finally:
                      if process is not None and process.poll() is None:
                          process.terminate()
                          try:process.wait(timeout=2)
                          except subprocess.TimeoutExpired:process.kill();process.wait(timeout=2)
              result["elapsed_seconds"]=time.monotonic()-started
              for suffix in ("stdout","stderr"):
                  path=pathlib.Path(str(folder)+"."+suffix);raw=path.read_bytes()
                  result[suffix]={"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
              return result

          def run(original,adb,out):
              out.mkdir(parents=True,exist_ok=False)
              stop=threading.Event();result={"scope":"NEW_DIAGNOSTIC_NOT_ORIGINAL_RUN_OR_ACCEPTANCE",
                  "original_failed_commit":"10b90458f365931e6d87df0d389fabca9a9f09d9",
                  "original_failed_run":38871586910,"original_attempts":1,
                  "binding":{k:os.environ.get(k) for k in ("GITHUB_SHA","GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","TEST_API")}}
              def collect():
                  try:
                      result["wait"]=observe([adb,"-s","emulator-5554","wait-for-device"],out/"wait",stop)
                      if result["wait"].get("returncode")!=0:
                          result["status"]="NO_DEVICE_NOT_VERIFIED";return
                      result["logcat"]=observe([adb,"-s","emulator-5554","logcat","-b","crash","-v","threadtime"],out/"crash",stop)
                      result["status"]="CAPTURED_NOT_ROOT_CAUSE" if (
                          result["logcat"]["status"] in ("EXITED","STOPPED_AFTER_ORIGINAL") and
                          result["logcat"]["stdout"]["bytes"]>0) else "NO_CRASH_BYTES_NOT_VERIFIED"
                  except BaseException as error:
                      result.update(status="OBSERVER_FAILED",error=repr(error))
              worker=threading.Thread(target=collect);worker.start()
              try:
                  code=subprocess.run(original,check=False).returncode
                  result["original_returncode"]=code
              finally:
                  worker.join(timeout=2);stop.set();worker.join(timeout=6)
                  result["observer_joined"]=not worker.is_alive()
                  (out/"receipt.json").write_text(json.dumps(result,indent=2))
              if code!=0:return code
              return 0 if result.get("status")=="CAPTURED_NOT_ROOT_CAUSE" and not worker.is_alive() else 1

          if __name__=="__main__":
              sys.exit(run(sys.argv[2:],sys.argv[1],pathlib.Path("crash-diagnostic")))
          OBSERVER
          cat > "$RUNNER_TEMP/test-crash-observer.py" <<'TEST'
          import importlib.util,json,pathlib,sys,tempfile,threading
          from unittest.mock import patch
          p=pathlib.Path(__file__).parent
          spec=importlib.util.spec_from_file_location("observer",p/"crash-observer.py")
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as tmp:
              root=pathlib.Path(tmp)
              fake=root/"adb"
              fake.write_text("#!"+sys.executable+"\nimport sys\nif 'logcat' in sys.argv:print('FATAL EXCEPTION: test\\noriginal stack sentinel')\n")
              fake.chmod(0o700)
              original=[sys.executable,"-c","import time;time.sleep(.2);raise SystemExit(7)"]
              assert m.run(original,str(fake),root/"good")==7
              receipt=json.loads((root/"good/receipt.json").read_text())
              assert receipt["status"]=="CAPTURED_NOT_ROOT_CAUSE" and receipt["original_attempts"]==1
              assert (root/"good/crash.stdout").read_text()=="FATAL EXCEPTION: test\noriginal stack sentinel\n"
              source=(p/"crash-observer.py").read_text()
              assertion="    if code!=0:return code\n"
              assert source.count(assertion)==1
              mutant={"__name__":"mutant"}
              exec(compile(source.replace(assertion,"",1),"omitted-failure-preservation","exec"),mutant)
              assert mutant["run"](original,str(fake),root/"mutant")==0
              fake.write_text("#!"+sys.executable+"\nraise SystemExit(9)\n")
              assert m.run(original,str(fake),root/"waitfail")==7
              assert json.loads((root/"waitfail/receipt.json").read_text())["status"]=="NO_DEVICE_NOT_VERIFIED"
              assert m.run([sys.executable,"-c","import time;time.sleep(.2)"],str(fake),root/"empty")==1
              assert m.observe([sys.executable,"-c","print('x'*10000)"],root/"cap",threading.Event(),limit=10)["status"]=="LIMIT_EXCEEDED"
              assert m.observe([sys.executable,"-c","import time;time.sleep(5)"],root/"timeout",threading.Event(),budget=.05)["status"]=="TIMED_OUT"
              stopped=threading.Event();stopped.set()
              assert m.observe([sys.executable,"-c","import time;time.sleep(5)"],root/"stop",stopped)["status"]=="STOPPED_AFTER_ORIGINAL"
          print("CRASH_OBSERVER real subprocess positive=1 negatives=5 whole-guard-omission=1 PASS; NOT_ANDROID")
          TEST
          python3 "$RUNNER_TEMP/test-crash-observer.py"
          python3 "$RUNNER_TEMP/crash-observer.py" "$ANDROID_HOME/platform-tools/adb" bash "$RUNNER_TEMP/crash-predecessor/shortcut_device-14.sh"
      - name: Publish complete bounded crash evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          def api(path,value=None):
              args=["gh","api","repos/"+os.environ["GITHUB_REPOSITORY"]+"/"+path]
              if value is not None:args+=["--method","POST","--input","-"]
              return json.loads(subprocess.run(args,input=None if value is None else json.dumps(value).encode(),capture_output=True,timeout=60,check=True).stdout)
          folder=pathlib.Path("crash-diagnostic")
          assert folder.is_dir(),"diagnostic did not execute"
          for path in sorted(folder.iterdir()):
              raw=path.read_bytes();text=raw.decode("utf-8","replace")
              identity={"file":path.name,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),"decode_replaced":text.encode()!=raw}
              assert len(raw)<=256*1024,"publication budget exceeded; full artifact retained, not complete publication"
              parts=[text[i:i+10000] for i in range(0,len(text),10000)] or [""]
