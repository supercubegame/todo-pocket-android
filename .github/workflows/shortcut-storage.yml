          def blob(b):return hashlib.sha1(b'blob %d\0'%len(b)+b).hexdigest()
          def candidates(root):
              b=base64.b64decode(b''.join(Path(__file__).with_name('ui-delta.b64').read_bytes().split()),validate=True);assert len(b)==3816 and hashlib.sha256(b).hexdigest()=='6d0a3f38cb74043a2a13586e0bbb6ad88b41bd11fe6c5009186dd38cc36c34b4';changes=json.loads(lzma.decompress(b));assert set(changes)==set(PINS)==set(FINAL)
