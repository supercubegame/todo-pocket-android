              'full snapshot guard rejects another connection write even without revision bump',
              'same-revision stale rejection retains exact externally changed state',
              'changed staged media is rejected on confirmation with complete old state intact',
              'guarded confirmation late injected failure rolls back every replaced table',
              'failed commit plan cannot be reused after removing the fault',
              'confirmation uses the exact validated preview not a subsequently replaced source file',
