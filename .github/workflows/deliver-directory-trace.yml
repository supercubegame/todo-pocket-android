name: Bounded directory trace delivery
on:
  push:
    branches: [feature/v1.2-activity-notes-ledger]
    paths: [.github/workflows/deliver-directory-trace.yml]
permissions:
  contents: read
concurrency:
  group: bounded-directory-trace-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'supercubegame/todo-pocket-android' && github.ref == 'refs/heads/feature/v1.2-activity-notes-ledger'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify fixed base and reconstruct exactly two files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/directory-delivery"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/directory-delivery/reconstruct.log"
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path
          BASE = "c75376983966369645153809b13608ce3c4bca9d"
          WORKFLOW = ".github/workflows/deliver-directory-trace.yml"
          FILES = {'tools/verify_process_control.py': {'base': '7fb312cb7f5c14612f0a3e079710e761c929ad24', 'blob': '813accba1c802540e5685b7a0eca2f4e87176a43', 'sha256': 'ff2ab446663d8026153e7f83c19f39a1c4c1fced68a586c37cfa020dfa7d60ad', 'bytes': 130499}, 'tools/emulator_gate.py': {'base': '99f37bb3c5d6d522022ffa4fe0cc19ddebb6f940', 'blob': '6932ff6c929b75eddc7a2e587c74ac540212b2a4', 'sha256': 'f98fe81813d41d316315412adf82dce423bae923b49d5861379500e841b924ab', 'bytes': 116921}}
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def blob(data):
              return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          def validate_context(repo, ref, event, head, expected, parent, paths):
              if (repo, ref, event) != ("supercubegame/todo-pocket-android",
                      "refs/heads/feature/v1.2-activity-notes-ledger", "push"):
                  raise ValueError("wrong repository/ref/event")
              if head != expected or parent != BASE or paths != [WORKFLOW]:
                  raise ValueError("branch drift or unexpected bootstrap changes")
          def validate_files(expected):
              for path, digest in expected.items():
                  if blob(Path(path).read_bytes()) != digest:
                      raise ValueError("file identity mismatch: "+path)
          def validate_candidate():
              for path, value in FILES.items():
                  data = Path(path).read_bytes()
                  if (blob(data), len(data), hashlib.sha256(data).hexdigest()) != (
                          value["blob"], value["bytes"], value["sha256"]):
                      raise ValueError("candidate mismatch: "+path)
              changed = git("diff", "--name-only").splitlines()
              if sorted(changed) != sorted(FILES):
                  raise ValueError("unexpected changed tracked paths")
          good = ["supercubegame/todo-pocket-android", "refs/heads/feature/v1.2-activity-notes-ledger",
                  "push", "fixture-head", "fixture-head", BASE, [WORKFLOW]]
          validate_context(*good)
          for index, value in ((0,"other/repo"), (1,"refs/heads/main"), (2,"pull_request"),
                               (3,"drift"), (5,"other-parent"), (6,["tools/other.py"])):
              altered = good[:]; altered[index] = value
              validate_context(*good)
              try: validate_context(*altered)
              except ValueError: pass
              else: raise AssertionError("delivery context guard failed")
          print("DELIVERY_CONTEXT_CONTROLS positive=1 negative=6 PASS")
          validate_context(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_REF"],
              os.environ["GITHUB_EVENT_NAME"], git("rev-parse","HEAD"), os.environ["GITHUB_SHA"],
              git("rev-parse","HEAD^"), git("diff","--name-only","HEAD^","HEAD").splitlines())
          validate_files({p:v["base"] for p,v in FILES.items()})
          if git("status","--porcelain","--untracked-files=no"):
              raise ValueError("dirty checkout")
          unchanged_workflows = {
           "android.yml":"b6c7d8766382719a9557e58eec406a6c8e11d319",
           "note-drafts.yml":"21922203cc64c340dcfb2c3909a7da68dc41025a",
           "todo-management.yml":"1e6964aa7191f248717e726e8be9c46d1bd57876",
           "custom-fields.yml":"c0caf7a3c0aa5896540e82688dd660cb090a875a",
           "category-drag.yml":"f33cd9b6389a613eff1e89c1262af963a0001dd2",
           "app-catalog.yml":"5416834047407353be2aefbcaa1baefcefa21548"}
          validate_files({".github/workflows/"+p:v for p,v in unchanged_workflows.items()})
          for name in unchanged_workflows:
              header = Path(".github/workflows/"+name).read_text().split("permissions:",1)[0]
              if "  workflow_dispatch:\n" not in header:
                  raise ValueError("existing dispatch unavailable: "+name)
          patch = gzip.decompress(base64.b64decode("", validate=True))
          if hashlib.sha256(patch).hexdigest() != "25b70eee65033127dd60972e9b04fdf45b6a81269a46e7e4675d450a13d2918a":
              raise ValueError("patch hash mismatch")
          temporary = Path(os.environ["RUNNER_TEMP"])/"directory-delivery"
          temporary.mkdir(exist_ok=True)
          patchfile = temporary/"candidate.patch"
          patchfile.write_bytes(patch)
          subprocess.run(["git","apply","--check",str(patchfile)],check=True)
          subprocess.run(["git","apply",str(patchfile)],check=True)
          validate_candidate()
          receipt = {"status":"RECONSTRUCTED_NOT_PUSHED","base":BASE,
                     "bootstrap":os.environ["GITHUB_SHA"],"files":FILES,"patch_sha256":"25b70eee65033127dd60972e9b04fdf45b6a81269a46e7e4675d450a13d2918a"}
          (temporary/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt))
          PY
      - name: Run complete host entries and actual strace gate before any commit
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          if ! command -v strace >/dev/null 2>&1; then
            timeout 90s sudo apt-get -o Acquire::Retries=0 update
            timeout 60s sudo apt-get -o Acquire::Retries=0 install --no-install-recommends -y strace
          fi
          for entry in selftest connection-selftest isolated-selftest absence-selftest isolated-real-selftest; do
            python3 tools/verify_process_control.py "$entry" 2>&1 | tee "$RUNNER_TEMP/directory-delivery/$entry.log"
          done
          ANDROID_HOME="$RUNNER_TEMP/no-sdk-host-parser" PYTHONPATH=tools python3 -c 'import emulator_gate; emulator_gate.parser_selftest()' 2>&1 | tee "$RUNNER_TEMP/directory-delivery/parser.log"
      - name: Recheck byte identities and commit only the fixed Python paths
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          FILES = {'tools/verify_process_control.py': {'base': '7fb312cb7f5c14612f0a3e079710e761c929ad24', 'blob': '813accba1c802540e5685b7a0eca2f4e87176a43', 'sha256': 'ff2ab446663d8026153e7f83c19f39a1c4c1fced68a586c37cfa020dfa7d60ad', 'bytes': 130499}, 'tools/emulator_gate.py': {'base': '99f37bb3c5d6d522022ffa4fe0cc19ddebb6f940', 'blob': '6932ff6c929b75eddc7a2e587c74ac540212b2a4', 'sha256': 'f98fe81813d41d316315412adf82dce423bae923b49d5861379500e841b924ab', 'bytes': 116921}}
          def git(*args):
              return subprocess.check_output(["git",*args],text=True).strip()
          for path,value in FILES.items():
              data=Path(path).read_bytes()
              if hashlib.sha256(data).hexdigest()!=value["sha256"]:
                  raise ValueError("tests changed candidate: "+path)
          if sorted(git("diff","--name-only").splitlines())!=sorted(FILES):
              raise ValueError("tests changed other tracked files")
          if git("rev-parse","HEAD")!=os.environ["GITHUB_SHA"]:
              raise ValueError("local branch drift")
          branch="refs/heads/feature/v1.2-activity-notes-ledger"
          remote=git("ls-remote","origin",branch).split()
          if len(remote)!=2 or remote[0]!=os.environ["GITHUB_SHA"] or remote[1]!=branch:
              raise ValueError("remote branch drift; no push")
          subprocess.run(["git","add","--",*FILES],check=True)
          if sorted(git("diff","--cached","--name-only").splitlines())!=sorted(FILES):
              raise ValueError("unexpected staged paths")
          subprocess.run(["git","-c","user.name=github-actions[bot]",
           "-c","user.email=41898282+github-actions[bot]@users.noreply.github.com",
           "commit","-m","ci: trace database directory command with setup identity"],check=True)
          head=git("rev-parse","HEAD")
          receipt_path=Path(os.environ["RUNNER_TEMP"])/"directory-delivery/receipt.json"
          receipt=json.loads(receipt_path.read_text())
          receipt.update(status="TESTED_COMMITTED_NOT_PUSHED",candidate_commit=head)
          receipt_path.write_text(json.dumps(receipt,indent=2)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:out.write("candidate="+head+"\n")
          print("CANDIDATE_COMMIT "+head)
          PY
      - name: One non-force push and explicit existing CI dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.commit.outputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/v1.2-activity-notes-ledger'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          unset auth
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$CANDIDATE"
          printf '%s\n' "$CANDIDATE" > "$RUNNER_TEMP/directory-delivery/pushed-commit.txt"
          echo "Pushed: https://github.com/supercubegame/todo-pocket-android/commit/$CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for workflow in android.yml note-drafts.yml todo-management.yml custom-fields.yml category-drag.yml app-catalog.yml; do
            test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$CANDIDATE"
            if gh api --method POST "repos/supercubegame/todo-pocket-android/actions/workflows/$workflow/dispatches" -f "ref=$branch"; then
              echo "$workflow DISPATCH_ACCEPTED_NOT_COMPLETED $CANDIDATE" | tee -a "$RUNNER_TEMP/directory-delivery/dispatch.log"
            else
              echo "$workflow DISPATCH_FAILED $CANDIDATE" | tee -a "$RUNNER_TEMP/directory-delivery/dispatch.log"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-directory-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/directory-delivery/
          if-no-files-found: error
