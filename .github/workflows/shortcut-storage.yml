        id: delivery
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 "$RUNNER_TEMP/deliver-accepted.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/flat-ui-delivery"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: flat-ui-delivery
          path: ${{ runner.temp }}/flat-ui-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Publish bound delivery summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
