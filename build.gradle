plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'com.supercubegame.pockettodo'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.supercubegame.pockettodo.v12'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
        // One explicit runner per test APK; host restores the default test bytes.
        testInstrumentationRunner (providers.gradleProperty('pocketSchema3RestoreRunner').orElse('false').get() == 'true'
            ? 'com.supercubegame.pockettodo.Schema3RestoreTests'
            : providers.gradleProperty('pocketSchema3Runner').orElse('false').get() == 'true'
                ? 'com.supercubegame.pockettodo.Schema3DeviceTest'
                : 'com.supercubegame.pockettodo.V12DeviceTest')
    }
    buildTypes {
        debug { applicationIdSuffix '.preview' }
        release { minifyEnabled false }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
