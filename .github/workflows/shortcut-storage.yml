name: Controlled activation candidate preflight
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  shortcut_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Materialize pinned consent and migration candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib
          assert os.environ["GITHUB_REPOSITORY"]=="supercubegame/todo-pocket-android"
          assert os.environ["GITHUB_REF"]=="refs/heads/ci/shortcut-storage-preflight-4d8742"
          assert os.environ["GITHUB_EVENT_NAME"]=="push" and os.environ["GITHUB_RUN_ATTEMPT"]=="1"
          import ast,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/1ca2404a7b6d75c0645bd19ab07731205f2f6f63/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as response:
           source=response.read(26536)
          assert len(source)==26535 and hashlib.sha256(source).hexdigest()=="1a571d49a33c79c46e934dc5b9ee7a8e44cfeca3055089be326f8f51a7d41ae0"
          encoded_lines=[line.strip() for line in source.decode().splitlines() if line.startswith("          raw=lzma.decompress(")]
          assert len(encoded_lines)==1
          expression=ast.parse(encoded_lines[0]).body[0].value
          encoded=ast.literal_eval(expression.args[0].args[0])
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='89165abc5ff8d26db76c250c695db8d6d0ed7b54f76c6ed1c2abf34b47c46d41'
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"activation-payload"
          folder.mkdir()
          bundle=json.loads(raw)
          assert set(bundle)=={'activation-app.java', 'activation-store.java', 'driver.py', 'consent-gate.py', 'integrate.py', 'activation-device.java', 'host.py'}
          for name,text in bundle.items():
           assert "/" not in name and ".." not in name
           (folder/name).write_bytes(text.encode())
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"activation-evidence";out.mkdir()
          (out/"payload.json").write_bytes(raw)
          import copy,subprocess,tempfile
          # Execute the original driver's actual clean-worktree assertion, not a model.
          tree=ast.parse(bundle["driver.py"])
          guards=[n for n in ast.walk(tree) if isinstance(n,ast.Assert) and
                  any(isinstance(c,ast.Constant) and c.value=="--porcelain" for c in ast.walk(n))]
          assert len(guards)==1
          guard=guards[0]
          def check(root,node=guard):
           try:
            exec(compile(ast.fix_missing_locations(ast.Module(body=[node],type_ignores=[])),"original-clean-guard","exec"),{"subprocess":subprocess,"root":root})
            return True
           except AssertionError:return False
          with tempfile.TemporaryDirectory() as directory:
           base=pathlib.Path(directory);repo=base/"checkout";repo.mkdir()
           def git(*args):return subprocess.run(["git",*args],cwd=repo,text=True,capture_output=True,check=True).stdout
           git("init");git("config","user.name","Gate fixture");git("config","user.email","fixture@example.invalid")
           tracked=repo/"source.txt";tracked.write_text("original")
           git("add","source.txt");git("commit","-m","fixture")
           assert check(repo)
           inside=repo/"activation-evidence";inside.mkdir()
           (inside/"payload.json").write_bytes(raw);(inside/"receipt.json").write_text("{}")
           assert not check(repo),"original evidence-in-checkout failure must reproduce"
           (inside/"payload.json").unlink();(inside/"receipt.json").unlink();inside.rmdir()
           outside=base/"activation-evidence";outside.mkdir()
           (outside/"payload.json").write_bytes(raw);(outside/"receipt.json").write_text("{}")
           assert check(repo),"external evidence must preserve original clean guard"
           tracked.write_text("changed")
           assert not check(repo),"tracked drift must fail"
           tracked.write_text("original")
           extra=repo/"unexpected.txt";extra.write_text("untracked drift")
           assert not check(repo),"untracked drift must fail"
           mutant=copy.deepcopy(guard)
           lists=[n for n in ast.walk(mutant) if isinstance(n,ast.List) and
                  any(isinstance(e,ast.Constant) and e.value=="--porcelain" for e in n.elts)]
           assert len(lists)==1;lists[0].elts.append(ast.Constant("--untracked-files=no"))
           extra.unlink();assert check(repo,mutant),"mutant valid-input witness"
           extra.write_text("untracked drift")
           assert check(repo,mutant) and not check(repo),"original guard must distinguish dirty-input mutant"
          result={"original_red":True,"external_evidence_green":True,"tracked_drift_rejected":True,"untracked_drift_rejected":True,"ignore_untracked_mutant_witnessed_and_distinguished":True,"scope":"ACTUAL_GIT_AND_ORIGINAL_DRIVER_GUARD_NOT_PRODUCT_OR_ANDROID"}
          (out/"clean-guard-controls.json").write_text(json.dumps(result,indent=2)+"\n")
          (out/"original-failed-workflow.yml").write_bytes(source)
          print(json.dumps(result))
          PY
      - name: Original API RED candidate GREEN and all 21 host commands
        id: integration
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/activation-payload/driver.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/activation-payload" "$RUNNER_TEMP/activation-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: activation-host
          path: ${{ runner.temp }}/activation-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish bounded original host receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_OUTCOME: ${{ steps.integration.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"activation-evidence/receipt.json"
          value=json.loads(p.read_text()) if p.exists() else {"status":"SETUP_FAILED","host_commands":[]}
          value["failures"]=[r for r in value["host_commands"] if r["returncode"]!=0 or r["timed_out"]]
          value["host_commands"]=[{k:v for k,v in r.items() if k not in ("stdout_tail","stderr_tail")} for r in value["host_commands"]]
          value["artifact_url"]=os.environ.get("ARTIFACT_URL")
          body=json.dumps(value,ensure_ascii=False,indent=2)
          assert len(body.encode())<60000,"full evidence retained in artifact"
          ok=value["status"]=="HOST_PASS_CANDIDATE_DEVICE_PENDING" and os.environ["HOST_OUTCOME"]==os.environ["UPLOAD_OUTCOME"]=="success"
          request={"name":"Controlled activation preflight evidence","head_sha":os.environ["GITHUB_SHA"],"status":"completed","conclusion":"success" if ok else "failure","output":{"title":value["status"],"summary":"Candidate only; product pushes=0; live UI unchanged; no phone migration or release.","text":"```json\n"+body+"\n```"}}
          endpoint="repos/"+os.environ["GITHUB_REPOSITORY"]+"/check-runs"
          r=subprocess.run(["gh","api","--method","POST",endpoint,"--input","-"],input=json.dumps(request),text=True,capture_output=True,timeout=60,check=True)
          made=json.loads(r.stdout)
          seen=json.loads(subprocess.check_output(["gh","api",endpoint+"/"+str(made["id"])],text=True,timeout=60))
          assert seen["head_sha"]==request["head_sha"] and seen["conclusion"]==request["conclusion"]
          assert all(seen["output"][k]==v for k,v in request["output"].items())
          print("ACTIVATION_PREFLIGHT_RECEIPT",seen["html_url"])
          raise SystemExit(0 if ok else 1)
          PY
  shortcut_device:
    needs: shortcut_host
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    env:
      TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: activation-host
          path: activation-evidence
      - name: Restore exact host-verified candidate bytes without product writes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path(".")
          assert subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip()=='3a5a17e1fdc570c73804007cd9a4d2ef36c0966b'
          expected={'src/main/java/com/supercubegame/pockettodo/AppDatabase.java': 'f3ae4d9d9bb59670e9634714640ac6fbdf478a09', 'src/main/java/com/supercubegame/pockettodo/Schema4Store.java': 'cfc8c36a0681467150d5cd84ecfbcc76c184cb92', 'src/androidTest/java/com/supercubegame/pockettodo/Schema4DeviceTest.java': '0e63fc3448dae47d289533181be1f726eca1c15e', 'tools/verify_shortcuts.py': 'af4e02026ca601f6a5cfb3d03c369fec675e4515'}
          receipt=json.loads((root/"activation-evidence/receipt.json").read_text())
          assert receipt["status"]=="HOST_PASS_CANDIDATE_DEVICE_PENDING"
          assert receipt["baseline"]=='3a5a17e1fdc570c73804007cd9a4d2ef36c0966b' and receipt["product_pushes"]==0
          assert len(receipt["host_commands"])==21 and all(r["returncode"]==0 and not r["timed_out"] and r["attempts"]==1 for r in receipt["host_commands"])
          assert set(receipt["candidate_files"])==set(expected)
          for p,blob in expected.items():
           old=(root/p).read_bytes()
           assert hashlib.sha1(b"blob "+str(len(old)).encode()+b"\0"+old).hexdigest()==blob
           data=(root/"activation-evidence/candidate"/p).read_bytes();identity=receipt["candidate_files"][p]
           assert len(data)==identity["bytes"] and hashlib.sha256(data).hexdigest()==identity["sha256"]
           assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()==identity["blob"]
           (root/p).write_bytes(data)
          PY
      - name: Fixed disposable Android setup
        run: |
          set -euo pipefail
          exec > >(tee shortcut-setup.log) 2>&1
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install --yes strace
      - name: Build isolated runner and restore original Gradle source
        env:
          BUILD_429_EXECUTE: "true"
          BUILD_LOG: "shortcut-build.log"
        run: |
          set -euo pipefail
          python3 tools/verify_shortcuts.py build 2>&1 | tee shortcut-build-driver.log
      - name: Actual migration, guarded backup restore and separate-process persistence
        run: |
          set -euo pipefail
          python3 tools/verify_shortcuts.py android 2>&1 | tee shortcut-android.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shortcut-device-api-${{ matrix.api }}
          path: |
            shortcut-device/
            shortcut-build.json
            shortcut-build.log
            shortcut-build-driver.log
            shortcut-android.log
            shortcut-setup.log
            emulator.log
          if-no-files-found: error
          retention-days: 14
  shortcut_report:
    needs: [shortcut_host, shortcut_device]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: activation-host
          path: activation-evidence
      - name: Restore exact host-verified candidate bytes without product writes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path(".")
          assert subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip()=='3a5a17e1fdc570c73804007cd9a4d2ef36c0966b'
          expected={'src/main/java/com/supercubegame/pockettodo/AppDatabase.java': 'f3ae4d9d9bb59670e9634714640ac6fbdf478a09', 'src/main/java/com/supercubegame/pockettodo/Schema4Store.java': 'cfc8c36a0681467150d5cd84ecfbcc76c184cb92', 'src/androidTest/java/com/supercubegame/pockettodo/Schema4DeviceTest.java': '0e63fc3448dae47d289533181be1f726eca1c15e', 'tools/verify_shortcuts.py': 'af4e02026ca601f6a5cfb3d03c369fec675e4515'}
          receipt=json.loads((root/"activation-evidence/receipt.json").read_text())
          assert receipt["status"]=="HOST_PASS_CANDIDATE_DEVICE_PENDING"
          assert receipt["baseline"]=='3a5a17e1fdc570c73804007cd9a4d2ef36c0966b' and receipt["product_pushes"]==0
          assert len(receipt["host_commands"])==21 and all(r["returncode"]==0 and not r["timed_out"] and r["attempts"]==1 for r in receipt["host_commands"])
          assert set(receipt["candidate_files"])==set(expected)
          for p,blob in expected.items():
           old=(root/p).read_bytes()
           assert hashlib.sha1(b"blob "+str(len(old)).encode()+b"\0"+old).hexdigest()==blob
           data=(root/"activation-evidence/candidate"/p).read_bytes();identity=receipt["candidate_files"][p]
           assert len(data)==identity["bytes"] and hashlib.sha256(data).hexdigest()==identity["sha256"]
           assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()==identity["blob"]
           (root/p).write_bytes(data)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shortcut-*
          path: collected-shortcuts
      - name: Publish both original device receipts, including failures
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/verify_shortcuts.py report 2>&1 | tee shortcut-report.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-shortcut-report
          path: |
            shortcut-report.json
            shortcut-report.log
          if-no-files-found: error
          retention-days: 14
