          from pathlib import Path
          import hashlib,subprocess,tempfile
          BASE='39c4c7e0d15a5a1fdb0adaed6994ea1f3f8e4471'
          PINS={'.github/workflows/android.yml': '93bd0d823e4b1468f955daa2d38d023335b77f8c', 'src/main/java/com/supercubegame/pockettodo/MainActivity.java': 'c9b6cc4388788950f6b4214c998badcafbd4332a', 'tools/verify_batch_exports.py': '099676851ab430cc81745d1fe6a3116eb6e08bc6', 'tools/verify_paged_exports.py': 'dea8bd8f4a79da08908b11908f8bc91bce06e6d5'}
