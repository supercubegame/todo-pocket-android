name: Isolated shortcut business bridge delivery
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: write
  actions: write
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  bridge_delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e6ef5da3820d02715934bc0def8755bbea9fe41b
          path: source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f2ea66f56d99061b7331514c3ff339615c004a9f
          path: delivery-base
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5c5e8427156c2b6109fd3cf39d53abc4c52f4cdb
          path: ui-base
          persist-credentials: false
      - name: Select Java 17 and assert isolated one-attempt trigger
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "supercubegame/todo-pocket-android"
          test "$GITHUB_REF" = "refs/heads/ci/shortcut-storage-preflight-4d8742"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Materialize hash-bound test-first integration payload
        run: |
          python3 - <<'PY'
          import ast,hashlib,json,os,pathlib
          workspace=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          prior=(workspace/"ui-base/.github/workflows/shortcut-storage.yml").read_bytes()
          assert hashlib.sha256(prior).hexdigest()=="cc5df33021cbbdf6287545af6c97ae441fa34233a2457fdbb577b9b40057ea2e"
          text=prior.decode()
          start=text.index("          import ast,base64,hashlib,json,lzma,os,pathlib,re\n")
          end=text.index("          PY\n",start)
          code="\n".join(line[10:] for line in text[start:end].splitlines())
          ast.parse(code)
          exec(compile(code,"immutable-5c5e-materialization","exec"),{})
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"shortcut-business-payload"
          output=workspace/"bridge-evidence"
          raw=(output/"payload.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="c772c989430d2abd45f2c21d71463ccd67868913f540122d80b6047c1cd6a2c7"
          bundle=json.loads(raw)
          assert all((folder/name).read_bytes()==value.encode() for name,value in bundle.items())
          old='def ui_host_selftest():'
          new='def ui_host_selftest():\n    ui_shape_dependency_selftest()'
          extension='"""API shapes only. No modeled UI behavior and no Android acceptance claim."""\nSHAPE_BASELINE_STUBS = dict(STUBS)\n_app = "com/supercubegame/pockettodo/AppDatabase.java"\nneed(STUBS[_app].endswith("\\n}"), "AppDatabase shape anchor")\nSTUBS[_app] = STUBS[_app][:-2] + """\npublic static class ShortcutPlan implements AutoCloseable{public void close(){}}\npublic ShortcutPlan prepareShortcut(long c,long a){return null;}\npublic boolean confirmShortcut(ShortcutPlan p,boolean enabled){return false;}\n}\n"""\n_instrumentation = "android/app/Instrumentation.java"\nneed(STUBS[_instrumentation].endswith("\\n}"), "Instrumentation shape anchor")\nSTUBS[_instrumentation] = STUBS[_instrumentation][:-2] + """\npublic void runOnMainSync(Runnable r){}\npublic void waitForIdleSync(){}\npublic void sendPointerSync(android.view.MotionEvent event){}\npublic Activity startActivitySync(android.content.Intent intent){return null;}\npublic UiAutomation getUiAutomation(){return null;}\n}\n"""\nSTUBS.update({\n    "android/content/Intent.java": """package android.content;public class Intent{\npublic static final int FLAG_ACTIVITY_NEW_TASK=0x10000000;\npublic Intent(Context context,Class<?> cls){}public Intent addFlags(int flags){return this;}\n}""",\n    "android/view/View.java": """package android.view;public class View{\npublic CharSequence getContentDescription(){return null;}\npublic boolean isAttachedToWindow(){return false;}public boolean isEnabled(){return false;}\npublic int getWidth(){return 0;}public int getHeight(){return 0;}\npublic boolean requestRectangleOnScreen(android.graphics.Rect r,boolean immediate){return false;}\npublic boolean getGlobalVisibleRect(android.graphics.Rect r){return false;}\npublic boolean performClick(){return false;}\n}""",\n    "android/view/ViewGroup.java": """package android.view;public class ViewGroup extends View{\npublic int getChildCount(){return 0;}public View getChildAt(int index){return null;}\n}""",\n    "android/view/Window.java": """package android.view;public class Window{\npublic View getDecorView(){return null;}\n}""",\n    "android/graphics/Rect.java": """package android.graphics;public class Rect{\npublic Rect(){}public Rect(int l,int t,int r,int b){}\npublic int width(){return 0;}public int height(){return 0;}\npublic float exactCenterX(){return 0;}public float exactCenterY(){return 0;}\n}""",\n    "android/view/MotionEvent.java": """package android.view;public class MotionEvent{\npublic static final int ACTION_DOWN=0,ACTION_UP=1;\npublic static MotionEvent obtain(long down,long event,int action,float x,float y,int meta){return null;}\npublic void recycle(){}\n}""",\n    "android/os/SystemClock.java": """package android.os;public class SystemClock{\npublic static long uptimeMillis(){return 0;}\n}""",\n    "android/widget/TextView.java": """package android.widget;public class TextView extends android.view.View{\npublic CharSequence getText(){return null;}\n}""",\n    "android/graphics/Bitmap.java": """package android.graphics;public class Bitmap{\npublic enum CompressFormat{PNG}\npublic boolean compress(CompressFormat format,int quality,java.io.OutputStream out){return false;}\npublic void recycle(){}\n}""",\n    "android/app/UiAutomation.java": """package android.app;public class UiAutomation{\npublic android.graphics.Bitmap takeScreenshot(){return null;}\n}""",\n    "com/supercubegame/pockettodo/MainActivity.java": """package com.supercubegame.pockettodo;\npublic class MainActivity extends android.app.Activity{\nstatic boolean isolatedShortcutTest;\nTodayScreen shortcutTestScreen(){return null;}\npublic android.view.Window getWindow(){return null;}public void finish(){}\n}""",\n    "com/supercubegame/pockettodo/TodayScreen.java": """package com.supercubegame.pockettodo;\npublic class TodayScreen{boolean awaitShortcutClose()throws InterruptedException{return false;}}\n""",\n})\n\n\ndef ui_shape_dependency_selftest():\n    """Same whole-source compiler for GREEN, original RED and omitted declarations."""\n    import contextlib,io,types\n    def compile_with(stubs):\n        scope=dict(globals(),STUBS=stubs)\n        runner=types.FunctionType(syntax_selftest.__code__,scope)\n        with contextlib.redirect_stdout(io.StringIO()):\n            runner()\n    # The complete candidate is the input in every case. Nothing is sliced out.\n    compile_with(STUBS)\n    cases=[("original",SHAPE_BASELINE_STUBS,"ShortcutPlan")]\n    for path,old,new,witness in (\n        (_app,"public ShortcutPlan prepareShortcut(","public ShortcutPlan omittedPrepareShortcut(","prepareShortcut"),\n        (_instrumentation,"public void sendPointerSync(","public void omittedSendPointerSync(","sendPointerSync"),\n        ("com/supercubegame/pockettodo/TodayScreen.java","boolean awaitShortcutClose(","boolean omittedAwaitShortcutClose(","awaitShortcutClose"),\n    ):\n        mutant=dict(STUBS)\n        need(mutant[path].count(old)==1,"shape omission declaration anchor")\n        mutant[path]=mutant[path].replace(old,new,1)\n        need(mutant[path]!=STUBS[path],"shape omission did not occur")\n        cases.append((witness,mutant,witness))\n    for name,stubs,witness in cases:\n        try:compile_with(stubs)\n        except AssertionError as exc:\n            message=str(exc)\n            need("new-class Java syntax failed:" in message and\n                 "cannot find symbol" in message and witness in message,\n                 "shape RED for wrong reason: "+name+"\\n"+message)\n        else:raise AssertionError("shape declaration omission survived: "+name)\n    print("SHORTCUT_UI_API_SHAPE original RED / full-source GREEN / 3 omission controls PASS; NOT_ANDROID")\n'
          assert bundle["checks.py"].count(old)==1
          bundle["checks.py"]=bundle["checks.py"].replace(old,new,1)+"\n\n"+extension
          ast.parse(bundle["checks.py"])
          raw=json.dumps(bundle,ensure_ascii=False,separators=(",",":")).encode()
          assert hashlib.sha256(raw).hexdigest()=='fa0350da2eb3ec6de56068130e3ce33215cca1c82d4355648031e26856cb0f7b'
          (folder/"checks.py").write_bytes(bundle["checks.py"].encode())
          (output/"original-payload.json").write_bytes((output/"payload.json").read_bytes())
          (output/"payload.json").write_bytes(raw)
          assert all((folder/name).read_bytes()==value.encode() for name,value in bundle.items())
          PY
      - name: Full-source RED GREEN all host gates and atomic guarded submission
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/shortcut-business-payload/ui_driver.py" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/shortcut-business-payload" "$GITHUB_WORKSPACE/bridge-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: shortcut-business-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: bridge-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact readable evidence including original failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_OUTCOME: ${{ steps.integration.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/shortcut-business-payload/ui_driver.py"; then
            python3 "$RUNNER_TEMP/shortcut-business-payload/ui_driver.py" publish "$GITHUB_WORKSPACE/bridge-evidence"
          else
            python3 - <<'PY'
          import json,os,subprocess
          request={"name":"Shortcut business bridge delivery evidence","head_sha":os.environ["GITHUB_SHA"],"status":"completed","conclusion":"failure","external_id":os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"],"output":{"title":"SETUP_FAILED_NOT_TESTED","summary":"No integration or product submission executed; inspect original setup logs."}}
          endpoint="repos/"+os.environ["GITHUB_REPOSITORY"]+"/check-runs"
          r=subprocess.run(["gh","api","--method","POST",endpoint,"--input","-"],input=json.dumps(request),text=True,capture_output=True,timeout=60,check=True)
          made=json.loads(r.stdout)
          seen=json.loads(subprocess.check_output(["gh","api",endpoint+"/"+str(made["id"])],text=True,timeout=60))
          assert seen["conclusion"]=="failure" and seen["head_sha"]==request["head_sha"] and seen["output"]["summary"]==request["output"]["summary"]
          print("SETUP_FAILURE_RECEIPT_EXACT_READBACK",seen["html_url"])
          raise SystemExit(1)
          PY
          fi
