name: V1.2 staged verification
on:
  push:
    branches: [feature/v1.2-activity-notes-ledger]
  pull_request:
    branches: [main, feature/v1.1-edit-backup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Legacy, domain and real JVM file boundary contracts
        run: |
          set -euo pipefail
          python3 tools/verify_process_control.py selftest 2>&1 | tee core.log
          python3 tools/verify_ui_observer.py selftest 2>&1 | tee -a core.log
          python3 tools/verify_adb_transfer.py 2>&1 | tee -a core.log
          python3 tools/verify_evidence.py 2>&1 | tee -a core.log
          python3 tools/verify.py v12 2>&1 | tee -a core.log
          python3 tools/verify_schema3.py selftest 2>&1 | tee -a core.log
      - name: Isolated stop tracing dependency and host gates
        run: &isolated_trace_setup |
          set -euo pipefail
          exec > >(tee isolated-trace-host.log) 2>&1
          if ! command -v strace >/dev/null 2>&1; then
            timeout 90s sudo apt-get -o Acquire::Retries=0 update
            timeout 60s sudo apt-get -o Acquire::Retries=0 install --no-install-recommends -y strace
          fi
          strace --version
          python3 tools/verify_process_control.py isolated-selftest
          python3 tools/verify_process_control.py absence-selftest
          python3 tools/verify_process_control.py isolated-real-selftest
      - name: Verify unfinished delivery cannot be mislabeled
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee -a core.log
          import subprocess
          result = subprocess.run(['python3','tools/verify.py','build'],capture_output=True,text=True)
          assert result.returncode != 0, 'Unfinished delivery gate must fail'
          assert 'V1.2 Android phase is not wired' in result.stderr, 'Unexpected failure is not proof of release guard'
          print('PASS unfinished V1.2 delivery explicitly blocked')
          PY
      - name: Current-source export image navigation host controls
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee -a core.log
          import ast,subprocess,tempfile
          from pathlib import Path
          text=Path('.github/workflows/android.yml').read_text()
          marker='          cat > "$RUNNER_TEMP/export_native_probe.py" <<'+"'PY'"+'\n'
          assert text.count(marker)==1,'one canonical native export driver required'
          body=text.split(marker,1)[1].split('          PY\n',1)[0]
          lines=body.splitlines()
          assert all(not line or line.startswith('          ') for line in lines)
          source='\n'.join(line[10:] if line else '' for line in lines)+'\n'
          def wiring(source):
              tree=ast.parse(source)
              native=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='standalone_native')
              calls=[n for n in ast.walk(native) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='reveal_image_control']
              assert len(calls)==1,'real native fixture must reveal its exact second image'
              expected=ast.parse('reveal_image_control("note-image-edit-"+images[1][1],gate.PKG,images[1][0],nodes,shell,navigation)',mode='eval').body
              assert ast.dump(calls[0])==ast.dump(expected),'navigation must use exact fixture image and note identities'
          wiring(source)
          fixture='def standalone_native(adb,gate):\n    reveal_image_control("note-image-edit-"+images[1][1],gate.PKG,images[1][0],nodes,shell,navigation)\n'
          wiring(fixture)
          for bad in (fixture.replace('    reveal_image_control','    # reveal_image_control'),
                      fixture.replace('images[1][1]','images[0][1]'),
                      fixture.replace('images[1][0]','images[0][0]'),
                      fixture.replace('gate.PKG','"foreign"')):
              if bad.splitlines()[-1].lstrip().startswith('#'):bad+='    pass\n'
              assert bad!=fixture
              compile(bad,'wiring-negative-fixture','exec')
              try:wiring(bad)
              except AssertionError:pass
              else:raise AssertionError('navigation caller omission or wrong identity survived')
          print('IMAGE_NAVIGATION_WIRING_CONTROLS 1 positive 4 negative HOST_ONLY',flush=True)
          with tempfile.TemporaryDirectory() as folder:
              path=Path(folder)/'export_native_probe.py';path.write_text(source)
              subprocess.run(['python3',str(path)],check=True,timeout=30)
          print('CURRENT_SOURCE_IMAGE_NAVIGATION_WIRING PASS; HOST_ONLY_NOT_DEVICE_ACCEPTANCE',flush=True)
          PY
      - name: Require approved full-regression budget
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee -a core.log
          from pathlib import Path
          def budget(text):
              # Scoped to canonical job-level YAML, never inline script/comment text.
              values=[]; in_job=False
              for line in text.splitlines():
                  code=line.split('#',1)[0].rstrip()
                  if code.startswith('  ') and not code.startswith('   '):
                      in_job=code=='  database:'
                  if in_job and code.startswith('    timeout-minutes:'):
                      value=code.split(':',1)[1].strip()
                      assert value.isascii() and value.isdecimal(), 'numeric full-regression budget required'
                      values.append(int(value))
              assert values==[75], 'full-regression budget must be exactly 75 minutes'
          good='  database:\n    timeout-minutes: 75\n'
          budget(good)
          for bad in (good.replace('75','55'),good.replace('75','750'),good.replace('75','true'),
                      good.replace('    timeout-minutes:','    # timeout-minutes:'),
                      good.replace('  database:','  other:'),good+'    timeout-minutes: 75\n'):
              try: budget(bad)
              except AssertionError: pass
              else: raise AssertionError('budget negative control survived')
          budget(Path('.github/workflows/android.yml').read_text())
          print('BUDGET_HOST_CONTROLS 1 positive 6 negative; actual workflow 75 minutes; NOT_ANDROID_ACCEPTANCE')
          # Canonical YAML-layout guard, separate from the artifact upload it guards.
          # This proves collection wiring, NOT independent Android artifact acceptance.
          observer_paths=[
              'native-ui/full-observer/binding.json',
              'native-ui/full-observer/phase.json',
              'native-ui/full-observer/observer.json',
              'native-ui/full-observer/observer-last.xml',
              'native-ui/full-observer/observer-stderr.log',
              'native-ui/full-observer/observer-*/PocketUiObserver.java',
              'native-ui/full-observer/observer-*/dex/classes.dex']
          artifact_name='          name: database-api-'+'$'+'{{ matrix.api }}'
          def observer_collection(text):
              import re
              lines=[]; active=False
              for line in text.splitlines():
                  if not line.strip() or line.lstrip().startswith('#'):continue
                  if re.match(r'^  [A-Za-z_][A-Za-z0-9_]*:',line):
                      active=line=='  database:'
                  if active:lines.append(line)
              steps=[]; current=[]
              for line in lines:
                  if line.startswith('      - '):
                      if current:steps.append(current)
                      current=[]
                  current.append(line)
              if current:steps.append(current)
              selected=[s for s in steps if artifact_name in s]
              assert len(selected)==1,'one full-native evidence uploader required'
              step=selected[0]
              assert step[0]=='      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02','fixed artifact action'
              assert step.count('        if: always()')==1,'failed native evidence must upload'
              assert step.count('          if-no-files-found: error')==1,'missing upload cannot be ignored'
              assert step.count('          path: |')==1,'one explicit artifact path block'
              start=step.index('          path: |')+1;paths=[]
              for line in step[start:]:
                  if not line.startswith('            '):break
                  paths.append(line.strip())
              assert all(paths.count(p)==1 for p in observer_paths),'required observer artifact omitted or duplicated'
          fixture='  database:\n      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02\n        if: always()\n        with:\n'+artifact_name+'\n          path: |\n'+''.join('            '+p+'\n' for p in observer_paths)+'          if-no-files-found: error\n'
          observer_collection(fixture)
          invalid=[fixture.replace('            '+p+'\n','',1) for p in observer_paths]
          invalid += [
              fixture.replace('  database:','  other:'),
              fixture.replace('        if: always()','        if: success()'),
              fixture.replace('          path: |','          # path: |'),
              fixture.replace('          if-no-files-found: error','          if-no-files-found: warn'),
              fixture.replace('            '+observer_paths[0]+'\n',('            '+observer_paths[0]+'\n')*2)]
          for changed in invalid:
              assert changed!=fixture,'collection fixture did not change'
              try:observer_collection(changed)
              except AssertionError:pass
              else:raise AssertionError('collection omission survived')
          observer_collection(Path('.github/workflows/android.yml').read_text())
          print('FULL_OBSERVER_COLLECTION_CONTROLS 1 positive '+str(len(invalid))+' negative; WIRING_ONLY_NOT_ARTIFACT_ACCEPTANCE')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-evidence
          path: |
            core.log
            isolated-trace-host.log
          if-no-files-found: error
  export_probe:
    needs: core
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require isolated stop tracing before export device work
        run: *isolated_trace_setup
      - name: Fixed Android build setup for independent export probe
        run: |
          set -euo pipefail
          exec > >(tee export-probe-setup.log) 2>&1
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build the current-source disposable APKs
        env:
          BUILD_429_EXECUTE: 'true'
          BUILD_LOG: export-probe-build.log
        run: &verified_build |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path

          def rate_limited_configuration(text):
              # Retry dependency configuration only. Never replay a task, lint, or device test.
              if text.count("* What went wrong:") != 1 or text.count("* Try:") != 1:
                  return False
              if re.search(r"(?m)^> Task |^.*(?:error:|AssertionError|OutOfMemoryError)", text):
                  return False
              body = text.split("* What went wrong:", 1)[1].split("* Try:", 1)[0]
              lines = [line.strip() for line in body.splitlines() if line.strip()]
              if not lines or not re.fullmatch(r"A problem occurred configuring root project '[^'\n]+'\.", lines[0]):
                  return False
              url = r"https://(?:repo1\.maven\.org/maven2|repo\.maven\.apache\.org/maven2|plugins\.gradle\.org/m2)/[A-Za-z0-9_./+-]+"
              leaf = r"> Could not (?:GET|HEAD) '" + url + r"'\. Received status code 429 from server: Too Many Requests"
              containers = (
                  r"> Could not resolve all (?:artifacts|files) for configuration ':classpath'\.",
                  r"> Could not resolve [A-Za-z0-9_.+-]+:[A-Za-z0-9_.+-]+:[A-Za-z0-9_.+-]+\.",
                  r"> Could not get resource '" + url + r"'\.",
                  r"Required by:", r"project : > [A-Za-z0-9_.:+> -]+",
                  r"> There are [1-9][0-9]* more failures with identical causes\.",
              )
              found = 0
              for line in lines[1:]:
                  if re.fullmatch(leaf, line):
                      found += 1
                  elif not any(re.fullmatch(pattern, line) for pattern in containers):
                      return False
              return found > 0 and re.search(r"(?m)^BUILD FAILED in .+$", text) is not None

          def execute_build(command, invoke, pause, emit):
              attempts = []
              for number in range(1, 4):
                  code, text = invoke(command, number)
                  retryable = code != 0 and rate_limited_configuration(text)
                  wait = (60, 180)[number - 1] if retryable and number < 3 else 0
                  attempts.append({"attempt": number, "returncode": code,
                                   "dependency_429_only": retryable, "retry_wait_seconds": wait})
                  if code == 0 or not wait:
                      emit(attempts)
                      return code
                  pause(wait)
              raise AssertionError("unreachable retry exit")

          def selftest():
              good = """FAILURE: Build failed with an exception.
          * What went wrong:
          A problem occurred configuring root project 'fixture'.
          > Could not resolve all artifacts for configuration ':classpath'.
             > Could not resolve org.example:example:1.0.
               Required by:
                   project : > org.example:plugin:1.0
                > Could not get resource 'https://repo.maven.apache.org/maven2/org/example/example/1.0/example-1.0.pom'.
                   > Could not GET 'https://repo.maven.apache.org/maven2/org/example/example/1.0/example-1.0.pom'. Received status code 429 from server: Too Many Requests
          * Try:
          > Run with --stacktrace option to get the stack trace.
          BUILD FAILED in 2m 18s
          """
              assert rate_limited_configuration(good)
              bad = ["", good.replace("429", "403"), good.replace("429", "500"),
                     good.replace("repo.maven.apache.org", "untrusted.example"),
                     good.replace("A problem occurred configuring root project 'fixture'.", "Execution failed for task ':compileDebugJavaWithJavac'."),
                     good + "> Task :compileDebugJavaWithJavac FAILED\n",
                     good + "error: cannot find symbol\n", good + "AssertionError\n",
                     good.replace("* What went wrong:", "missing section"),
                     good.replace("* Try:", "missing boundary"),
                     good.replace("BUILD FAILED", "BUILD SUCCESSFUL"),
                     good.replace("   > Could not resolve org.example:example:1.0.", "   > Could not resolve org.example:example:1.0.\n      > Permission denied"),
                     good + good]
              for text in bad:
                  assert text != good and not rate_limited_configuration(text)
              cases = [
                  ([(0, "BUILD SUCCESSFUL")], 0, []),
                  ([(1, good), (0, "BUILD SUCCESSFUL")], 0, [60]),
                  ([(1, good)] * 3, 1, [60, 180]),
                  ([(7, "compile error")], 7, []),
                  ([(1, good), (9, "compile error")], 9, [60]),
              ] + [([(2, text)], 2, []) for text in bad]
              for answers, expected, waits in cases:
                  calls = []; sleeps = []; receipts = []
                  def invoke(command, number):
                      assert command == ["gradle", "assembleDebug"] and number == len(calls) + 1
                      calls.append(number)
                      return answers[number - 1]
                  assert execute_build(["gradle", "assembleDebug"], invoke, sleeps.append, receipts.append) == expected
                  assert len(calls) == len(answers) and sleeps == waits
                  assert len(receipts) == 1 and [v["returncode"] for v in receipts[0]] == [v[0] for v in answers]
              print("BUILD_429_CONTROLS", 1, "positive", len(bad), "negative", len(cases), "execution_cases HOST_ONLY", flush=True)

          selftest()
          if os.environ.get("BUILD_429_EXECUTE") == "true":
              log = Path(os.environ["BUILD_LOG"])
              command = ["gradle", "--no-daemon", "--console=plain", "assembleDebug", "assembleDebugAndroidTest"]
              if os.environ.get("BUILD_LINT") == "true":
                  command.append("lintDebug")
              def invoke(command, number):
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  raw = result.stdout
                  with log.open("ab") as stream:
                      stream.write(("\nBUILD_ATTEMPT " + str(number) + "\n").encode() + raw)
                  print(raw.decode("utf-8", errors="replace"), flush=True)
                  return result.returncode, raw.decode("utf-8", errors="replace")
              def emit(attempts):
                  record = {"scope": "BUILD_CONFIGURATION_RETRY_NOT_DEVICE_RETRY",
                            "commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                            "api": int(os.environ["TEST_API"]), "attempts": attempts}
                  line = "BUILD_ATTEMPTS " + json.dumps(record) + "\n"
                  with log.open("a") as stream:
                      stream.write(line)
                  print(line, flush=True)
              raise SystemExit(execute_build(command, invoke, time.sleep, emit))
          PY
      - name: Prepare independent synthetic native fixture driver
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export_native_probe.py" <<'PY'
          import subprocess
          import time

          def wait_old_absent(prefix, package, pid, record, invoke=None, clock=None, pause=None):
              """Read-only post-signal observation; command errors never mean absence."""
              invoke = subprocess.run if invoke is None else invoke
              clock = time.monotonic if clock is None else clock
              pause = time.sleep if pause is None else pause
              command = prefix + ["shell", "-n", "-T", "pidof", package]
              probes = record["absence_probes"] = []
              traces = record["absence_commands"] = []
              deadline = clock() + 30
              def text(value):
                  return value.decode("utf-8", errors="replace") if isinstance(value, bytes) else value
              while True:
                  remaining = deadline - clock()
                  if remaining <= 0:
                      raise TimeoutError("old process absence not verified within 30 seconds")
                  trace = {"command": command[:], "stdin": "DEVNULL", "timeout_seconds": min(10, remaining)}
                  traces.append(trace)
                  try:
                      p = invoke(command, capture_output=True, text=True, timeout=trace["timeout_seconds"],
                                 stdin=subprocess.DEVNULL)
                  except (subprocess.TimeoutExpired, OSError) as exc:
                      trace.update(error=repr(exc), stdout=text(getattr(exc, "stdout", None)),
                                   stderr=text(getattr(exc, "stderr", None)))
                      raise
                  trace.update(returncode=p.returncode, stdout=p.stdout, stderr=p.stderr)
                  probes.append({"returncode": p.returncode, "stdout": p.stdout.strip()})
                  if p.returncode not in (0, 1):
                      raise subprocess.CalledProcessError(p.returncode, command, output=p.stdout, stderr=p.stderr)
                  if p.stderr != "":
                      raise RuntimeError("pidof stderr prevents absence proof: " + repr(trace))
                  if clock() >= deadline:
                      raise TimeoutError("pidof completed outside absence observation budget: " + repr(trace))
                  if p.returncode == 1 and not p.stdout.strip():
                      return
                  if p.returncode != 0 or p.stdout.strip() != pid:
                      raise RuntimeError("unexpected post-signal process observation: " + repr(trace))
                  pause(.25)

          def absence_selftest(observer=wait_old_absent):
              prefix = ["fixture-adb", "-s", "emulator-5554"]
              package = "fixture.package"
              expected_command = prefix + ["shell", "-n", "-T", "pidof", package]
              def answer(code, out="", err=""):
                  return subprocess.CompletedProcess(expected_command, code, out, err)
              # Explicit expected outputs are independent of the observation implementation.
              cases = [
                  ([answer(1)], None),
                  ([answer(0, "123\n"), answer(1, "\n")], None),
                  ([answer(255)], subprocess.CalledProcessError),
                  ([answer(2, "partial", "transport")], subprocess.CalledProcessError),
                  ([answer(1, "123")], RuntimeError),
                  ([answer(1, "", "warning")], RuntimeError),
                  ([answer(0, "123", "warning")], RuntimeError),
                  ([answer(0, "456")], RuntimeError),
                  ([answer(0, "123 456")], RuntimeError),
                  ([answer(0, "")], RuntimeError),
                  ([subprocess.TimeoutExpired(expected_command, 10, output=b"partial", stderr=b"timeout")],
                   subprocess.TimeoutExpired),
                  ([OSError("fixture unavailable")], OSError),
              ]
              for answers, failure in cases:
                  calls = []; sleeps = []; record = {}
                  def invoke(command, **kwargs):
                      assert command == expected_command
                      assert kwargs == dict(capture_output=True, text=True, timeout=10, stdin=subprocess.DEVNULL)
                      assert len(calls) < len(answers), "unexpected command retry"
                      value = answers[len(calls)]; calls.append(value)
                      if isinstance(value, Exception):
                          raise value
                      return value
                  caught = None
                  try:
                      observer(prefix, package, "123", record, invoke, lambda: 0, sleeps.append)
                  except (subprocess.CalledProcessError, RuntimeError, subprocess.TimeoutExpired, OSError) as exc:
                      caught = exc
                  assert (caught is None) if failure is None else type(caught) is failure, repr(record)
                  assert len(calls) == len(answers) and sleeps == ([.25] if len(answers) == 2 else [])
                  assert len(record["absence_commands"]) == len(answers)
                  for value, trace in zip(answers, record["absence_commands"]):
                      assert trace["command"] == expected_command and trace["stdin"] == "DEVNULL"
                      if isinstance(value, Exception):
                          assert trace["error"] == repr(value)
                          if isinstance(value, subprocess.TimeoutExpired):
                              assert trace["stdout"] == "partial" and trace["stderr"] == "timeout"
                              assert caught is value
                      else:
                          assert (trace["returncode"], trace["stdout"], trace["stderr"]) == (value.returncode, value.stdout, value.stderr)
                  if isinstance(caught, subprocess.CalledProcessError):
                      assert (caught.cmd, caught.returncode, caught.stdout, caught.stderr) == (
                          expected_command, answers[-1].returncode, answers[-1].stdout, answers[-1].stderr)
                  if failure is None:
                      assert record["absence_probes"] == (
                          [{"returncode": 1, "stdout": ""}] if len(answers) == 1 else
                          [{"returncode": 0, "stdout": "123"}, {"returncode": 1, "stdout": ""}])
              for times, answers in (
                  ([0, 31], []),
                  ([0, 0, 31], [answer(1)]),
                  ([0, 0, 0, 31], [answer(0, "123")]),
              ):
                  ticks = iter(times); calls = []; record = {}
                  def invoke(command, **kwargs):
                      assert command == expected_command and kwargs["stdin"] == subprocess.DEVNULL
                      value = answers[len(calls)]; calls.append(value); return value
                  try:
                      observer(prefix, package, "123", record, invoke, lambda: next(ticks), lambda _: None)
                  except TimeoutError:
                      pass
                  else:
                      raise AssertionError("unbounded or late absence accepted")
                  assert len(calls) == len(answers)
              print("ABSENCE_ADAPTER_CONTROLS 2 positive 13 negative HOST_ONLY", flush=True)

          def reveal_image_control(desc, package, note_id, read_nodes, shell, record, clock=None, pause=None):
              """Navigate only this two-image fixture; never retry a failed command or tap."""
              import re
              import time
              clock = time.monotonic if clock is None else clock
              pause = time.sleep if pause is None else pause
              assert isinstance(desc, str) and desc.startswith("note-image-edit-") and len(desc) > len("note-image-edit-")
              assert isinstance(note_id, str) and note_id
              deadline = clock() + 20
              record.update(target=desc, note_id=note_id, swipes=[], status="SEARCHING", budget_seconds=20)
              previous = None
              current = []
              def bounds(node):
                  match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.get("bounds", ""))
                  assert match is not None, "invalid navigation bounds"
                  x1, y1, x2, y2 = map(int, match.groups())
                  assert x2 > x1 and y2 > y1, "empty navigation bounds"
                  return x1, y1, x2, y2
              while clock() < deadline:
                  current = read_nodes()
                  if clock() >= deadline:
                      raise TimeoutError("image observation exceeded original 20 second budget")
                  record["last_nodes"] = [dict(n.attrib) for n in current]
                  owners = [n for n in current if n.get("content-desc") == "note-selected-id"]
                  assert len(owners) == 1 and owners[0].get("package") == package and owners[0].get("text") == note_id, "image navigation note owner changed"
                  found = [n for n in current if n.get("content-desc") == desc]
                  assert len(found) <= 1, "ambiguous image navigation target"
                  scrolls = [n for n in current if n.get("class") == "android.widget.ScrollView" and n.get("package") == package]
                  assert len(scrolls) == 1 and scrolls[0].get("enabled") == "true", "one enabled note scroll container required"
                  x1, y1, x2, y2 = bounds(scrolls[0])
                  if found:
                      n = found[0]
                      assert n.get("package") == package and n.get("enabled") == "true" and n.get("clickable") == "true", "image target cannot be clicked"
                      a, b, c, d = bounds(n)
                      assert x1 <= a < c <= x2 and y1 <= b < d <= y2, "image target outside note viewport"
                      record["status"] = "VISIBLE"
                      return n
                  assert scrolls[0].get("scrollable") == "true", "missing target in non-scrollable note"
                  fingerprint = tuple(tuple(sorted(n.attrib.items())) for n in current)
                  if fingerprint == previous:
                      pause(min(.25, max(0, deadline - clock())))
                      continue
                  # Finite navigation, not assertion retry: only swipe when the target is absent.
                  assert len(record["swipes"]) < 6, "image navigation swipe limit reached"
                  assert x2-x1 >= 8 and y2-y1 >= 8, "note viewport too small for safe swipe"
                  x = (x1+x2)//2
                  top = y1+(y2-y1)//4
                  bottom = y2-(y2-y1)//4
                  remaining = deadline-clock()
                  if remaining <= 0:
                      raise TimeoutError("image navigation exceeded original 20 second budget")
                  action = {"args": ["input", "swipe", str(x), str(bottom), str(x), str(top), "350"],
                            "timeout_seconds": remaining}
                  record["swipes"].append(action)
                  shell(*action["args"], timeout=remaining)
                  previous = fingerprint
                  pause(min(.25, max(0, deadline-clock())))
              raise AssertionError("missing image target within 20 seconds: "+repr(record))


          def image_navigation_selftest(navigate=reveal_image_control, mutations=True):
              """Host XML/command doubles only; device acceptance stays in the export matrix."""
              import ast
              import inspect
              import subprocess
              import textwrap
              from xml.etree.ElementTree import Element
              package = "fixture.package"
              desc = "note-image-edit-second"
              def node(**values):
                  return Element("node", dict(values))
              owner = node(**{"content-desc": "note-selected-id", "package": package, "text": "note-exact"})
              scroll = node(**{"class": "android.widget.ScrollView", "package": package, "enabled": "true",
                               "scrollable": "true", "bounds": "[18,288][302,578]"})
              target = node(**{"content-desc": desc, "package": package, "enabled": "true", "clickable": "true",
                               "bounds": "[136,296][214,344]"})
              sibling = node(**dict(target.attrib, **{"content-desc": "note-image-edit-first"}))
              def changed(n, **attrs):
                  return node(**dict(n.attrib, **attrs))
              def exercise(frames, expected_swipes, failure=None, shell_error=None, read_delay=0):
                  ticks = [0.0]; commands = []; reads = [0]; record = {}
                  def read():
                      ticks[0] += read_delay
                      # Visibility changes only after an actual issued swipe, not after a poll.
                      frame = frames[min(len(commands), len(frames)-1)]
                      reads[0] += 1
                      assert reads[0] <= 100, "unbounded navigation reads"
                      return frame
                  def send(*args, **kwargs):
                      assert args == ("input", "swipe", "160", "506", "160", "360", "350"), "wrong viewport-derived swipe"
                      assert 0 < kwargs["timeout"] <= 20
                      commands.append(args)
                      if shell_error is not None:
                          raise shell_error
                  def sleep(seconds):
                      assert 0 <= seconds <= .25
                      ticks[0] += seconds
                  caught = None; value = None
                  try:
                      value = navigate(desc, package, "note-exact", read, send, record, lambda: ticks[0], sleep)
                  except (AssertionError, TimeoutError, subprocess.CalledProcessError) as exc:
                      caught = exc
                  if failure is None:
                      assert caught is None, repr(caught)
                      assert value is target and record["status"] == "VISIBLE", "wrong image returned"
                  else:
                      assert type(caught) is failure, "expected "+failure.__name__+" but got "+repr(caught)
                      if shell_error is not None:
                          assert caught is shell_error, "original command failure replaced"
                  assert len(commands) == expected_swipes, "wrong action count"
                  return record
              # These independent fixtures include the exact failed 320x640 viewport geometry.
              exercise([[owner, scroll, sibling, target]], 0)
              exercise([[owner, scroll, sibling], [owner, scroll, target]], 1)
              exercise([[owner, scroll, sibling],
                        [owner, scroll, changed(sibling, text="middle")], [owner, scroll, target]], 2)
              positives = 3
              negatives = 0
              bad_frames = [
                  [owner, scroll, target, target],
                  [changed(owner, text="other-note"), scroll, target],
                  [owner, owner, scroll, target],
                  [changed(owner, package="foreign"), scroll, target],
                  [scroll, target],
                  [owner, scroll, changed(target, enabled="false")],
                  [owner, scroll, changed(target, clickable="false")],
                  [owner, scroll, changed(target, package="foreign")],
                  [owner, scroll, changed(target, bounds="[1,1][1,20]")],
                  [owner, scroll, changed(target, bounds="[-1,296][214,344]")],
                  [owner, scroll, changed(target, bounds="[136,280][214,344]")],
                  [owner, scroll, scroll, target],
                  [owner, target],
                  [owner, changed(scroll, enabled="false"), target],
                  [owner, changed(scroll, bounds="broken"), target],
                  [owner, changed(scroll, scrollable="false"), sibling],
                  [owner, changed(scroll, bounds="[18,288][20,290]"), sibling],
              ]
              for frame in bad_frames:
                  exercise([frame], 0, AssertionError); negatives += 1
              exercise([[owner, scroll, sibling]], 1, AssertionError); negatives += 1
              exercise([[owner, scroll, sibling],
                        [changed(owner, text="other-note"), scroll, target]], 1, AssertionError); negatives += 1
              exercise([[owner, scroll, target]], 0, TimeoutError, read_delay=20); negatives += 1
              failure = subprocess.CalledProcessError(255, ["fixture-adb"], output="original", stderr="transport")
              exercise([[owner, scroll, sibling]], 1, subprocess.CalledProcessError, shell_error=failure); negatives += 1
              moving = [[owner, scroll, changed(sibling, text=str(i))] for i in range(7)]
              exercise(moving, 6, AssertionError); negatives += 1
              assert positives == 3 and negatives == 22
              if mutations:
                  source = textwrap.dedent(inspect.getsource(navigate))
                  variants = [
                      ('if fingerprint == previous:', 'if True:'),
                      ('len(found) <= 1', 'len(found) <= 2'),
                      ('owners[0].get("text") == note_id', 'True'),
                      ('n.get("enabled") == "true"', 'True'),
                  ]
                  for old, new in variants:
                      assert source.count(old) == 1, "mutation anchor ambiguous"
                      changed_source = source.replace(old, new, 1)
                      namespace = {}
                      exec(compile(ast.parse(changed_source), "compiled-image-navigation-mutant", "exec"), namespace)
                      mutant = namespace["reveal_image_control"]
                      # A valid visible target must still succeed before the mutant is rejected.
                      commands = []
                      assert mutant(desc, package, "note-exact", lambda: [owner, scroll, target],
                                    lambda *a, **kw: commands.append(a), {}, lambda: 0, lambda _: None) is target
                      assert commands == []
                      try:
                          image_navigation_selftest(mutant, mutations=False)
                      except AssertionError:
                          pass
                      else:
                          raise AssertionError("compiled navigation mutation survived")
                  print("IMAGE_NAVIGATION_CONTROLS 3 positive 22 negative 4 compiled witnessed mutants HOST_ONLY", flush=True)


