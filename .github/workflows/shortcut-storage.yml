name: Explicit activation readable device evidence
'on':
  push:
    branches:
      - ci/shortcut-storage-preflight-4d8742
permissions:
  contents: read
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  shortcut_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - &ref_0
        name: Verify exact original source and repair two transport escapes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/a37a972bd31bd0ad4fa0b82005f26a91bc07b9fc/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(11571)
          assert len(raw)==11570 and hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()=="cb33818dafc911ec79e490491ff58fb8734741cd"
          text=raw.decode();start=text.index("          import hashlib,os,pathlib,subprocess,urllib.request")
          end=text.index("\n          PY\n",start)
          program="\n".join(line[10:] for line in text[start:end].splitlines())
          exec(compile(program,"exact-transfer-bootstrap","exec"),{})
          PY
      - name: Use Java 17
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/0.sh"
      - name: Restore exact pinned backend materializer
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/1.sh"
      - name: Preserve original RED and backend host gates
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/2.sh"
      - name: Prove and repair actual media checked-exception signature
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/de8cbb1cc75cd81770b46422aa1a291010a6c71a/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(11181)
          assert len(raw)==11180 and hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()=="b84dac06fa4b71bba9c8c7277115e437cda5bbea"
          text=raw.decode();start=text.index('          """Repair the new UI')
          end=text.index("\n          PY\n",start)
          program="\n".join(line[10:] for line in text[start:end].splitlines())
          exec(compile(program,"immutable-media-signature-repair","exec"),{"__name__":"__main__"})
          PY
      - name: Preserve exact parser RED and bind layered selftest witnesses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/e8c31fddb720e120fbf1a14cc1044183fab8425e/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(12592)
          assert len(raw)==12591 and hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()=="ad52d74c2552d0da988dfd11d0a81475f017de6f"
          text=raw.decode();start=text.index("          import ast,base64,lzma,os,pathlib")
          end=text.index("\n          PY\n",start)
          program="\n".join(line[10:] for line in text[start:end].splitlines())
          exec(compile(program,"immutable-parser-layer-repair","exec"),{})
          PY
      - name: Add missing activation Android declarations with original RED and four omission controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/be26b10321ce46d6d9808b9e8fb9f7b6cbfde860/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(11196)
          assert len(raw)==11195 and hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()=="a1847d0f255df5089593c897634fb298537325e7"
          text=raw.decode();start=text.index("          import ast,base64,hashlib,lzma,os,pathlib")
          end=text.index("\n          PY\n",start)
          program="\n".join(line[10:] for line in text[start:end].splitlines())
          exec(compile(program,"immutable-shape-repair","exec"),{})
          PY
      - name: Use screen-space dialog touch and preserve explicit unchecked witnesses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/a72753a2ac0d175ae1ee357baa471369eb8e1676/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(13425)
          assert len(raw)==13424 and hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()=="56e2c9c60caf6ef4151c6d9a23b62dfb09a1561d"
          text=raw.decode();marker="    - name: Use screen-space dialog touch and preserve explicit unchecked witnesses"
          assert text.count(marker)==1
          start=text.index("          import ast,base64,hashlib,lzma,os,pathlib",text.index(marker))
          end=text.index("\n          PY\n",start)
          program="\n".join(line[10:] for line in text[start:end].splitlines())
          exec(compile(program,"immutable-touch-repair","exec"),{})
          PY
      - name: Bind deterministic lifecycle checks to actual candidate Java members
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/b060055fdda76b408ba7023ba2014279651ef86d/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(16282)
          assert len(raw)==16281 and hashlib.sha1(b"blob 16281"+bytes([0])+raw).hexdigest()=="1a79175fddaed4c68329672b9ff1912bd29a9dc0"
          text=raw.decode()
          marker="    - name: Bind deterministic lifecycle checks to actual candidate Java members"
          assert text.count(marker)==1
          start=text.index("          import ast,base64,hashlib,lzma,os,pathlib",text.index(marker))
          end=text.index("\n          PY\n",start)
          program="\n".join(line[10:] for line in text[start:end].splitlines())
          exec(compile(program,"immutable-actual-lifecycle","exec"),{})
          PY
      - name: Persist all UI label families with raw-stream identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,lzma,os,pathlib
          extension=lzma.decompress(base64.b64decode('',validate=True)).decode()
          assert hashlib.sha256(extension.encode()).hexdigest()=='889d6b066820f80fe63aa759e3e50c01d21d4448c9daeeb25aa1050e0bfb90b5'
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"exact-activation-scripts/3.sh"
          script=path.read_text();head,body=script.split("import ast",1)
          tree=ast.parse("import ast"+body.rsplit("\nPY",1)[0])
          class Patch(ast.NodeTransformer):
              count=0
              def visit_Constant(self,node):
                  if isinstance(node.value,str) and node.value.startswith("import base64,json,lzma,importlib.util"):
                      anchor="for name,content in activation_files.items(): (folder/name).write_text(content)"
                      assert node.value.count(anchor)==1
                      self.count+=1
                      hook='activation_files["activation-parser.py"] += '+repr(extension)
                      value=node.value.replace(anchor,hook+"\n"+anchor,1)
                      ast.parse(value)
                      return ast.copy_location(ast.Constant(value=value),node)
                  return node
          change=Patch();tree=change.visit(tree);assert change.count==1
          path.write_text(head+ast.unparse(tree)+"\nPY\n")

          PY
      - name: Integrate default startup UI and rerun all 21 original hosts
        id: integration
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/3.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: activation-host
          path: ${{ runner.temp }}/activation-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact host outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_OUTCOME: ${{ steps.integration.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/4.sh"
  shortcut_device:
    needs: shortcut_host
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api:
          - 26
          - 34
    env:
      TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: activation-host
          path: activation-evidence
      - *ref_0
      - name: Restore exact six-file host-verified candidate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/5.sh"
      - name: Fixed disposable Android setup
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/6.sh"
      - name: Build isolated runner and restore original Gradle source
        env:
          BUILD_429_EXECUTE: 'true'
          BUILD_LOG: shortcut-build.log
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/7.sh"
      - name: Original regressions plus actual native default startup
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/8.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shortcut-device-api-${{ matrix.api }}
          path: |
            shortcut-device/
            shortcut-build.json
            shortcut-build.log
            shortcut-build-driver.log
            shortcut-android.log
            shortcut-setup.log
            emulator.log
          if-no-files-found: error
          retention-days: 14
  shortcut_report:
    needs:
      - shortcut_host
      - shortcut_device
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: activation-host
          path: activation-evidence
      - *ref_0
      - name: Restore exact six-file host-verified candidate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/9.sh"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shortcut-*
          path: collected-shortcuts
      - name: Publish both original device receipts including failures
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/10.sh"
      - name: Publish exact new UI checks and original seed reopen streams
        id: ui_evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Readable exact device streams; never substitutes for upgrade acceptance."""
          import hashlib
          import importlib.util
          import json
          import os
          import pathlib
          import subprocess
          import sys

          sys.path.insert(0, "tools")
          spec = importlib.util.spec_from_file_location("ui_verifier", "tools/verify_shortcuts.py")
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          repo = "repos/" + os.environ["GITHUB_REPOSITORY"]
          failed = False
          for api in (26, 34):
              root = pathlib.Path(f"collected-shortcuts/shortcut-device-api-{api}/shortcut-device")
              value = dict(commit=os.environ["GITHUB_SHA"], run_id=os.environ["GITHUB_RUN_ID"],
                           run_attempt=os.environ["GITHUB_RUN_ATTEMPT"], api=api,
                           status="NOT_VERIFIED", product_pushes=0, release_ready=False,
                           scope="ORIGINAL_DEVICE_STREAMS_NOT_PRODUCT_NOT_UPGRADE",
                           verifier_sha256=hashlib.sha256(pathlib.Path("tools/verify_shortcuts.py").read_bytes()).hexdigest())
              streams = {}
              try:
                  result = json.loads((root/"result.json").read_text())
                  for key in ("commit", "run_id", "run_attempt", "api"):
                      assert result[key] == value[key], "device receipt identity " + key
                  value["source_status"] = result["status"]
                  value["phases"] = {}
                  for phase in ("seed", "reopen"):
                      raw = (root/(phase+".log")).read_bytes()
                      streams[phase] = raw.decode("utf-8", "strict")
                      evidence = verifier.ui_phase_evidence(raw, phase, api)
                      verifier.require_ui_evidence(evidence, raw, phase, api)
                      value["phases"][phase] = evidence
                  assert result["status"] == "PASS", "original device receipt failed"
                  value["status"] = "PASS"
              except Exception as exc:
                  failed = True
                  value["error"] = type(exc).__name__ + ": " + str(exc)
              text = json.dumps(dict(evidence=value, original_streams=streams), ensure_ascii=False, indent=2)
              pathlib.Path(f"ui-compact-api{api}.json").write_text(text)
              # Existing raw streams are about 8 KB total. This is a transport ceiling,
              # not a truncation policy: overflow fails while the full file is uploaded.
              assert len(text.encode("utf-8")) < 55000, "UI evidence exceeds check transport, full file retained"
              body = dict(name=f"Exact UI device evidence API{api}", head_sha=os.environ["GITHUB_SHA"],
                          status="completed", conclusion="success" if value["status"] == "PASS" else "failure",
                          output=dict(title=value["status"]+" original UI streams, NOT upgrade",
                                      summary=f"Run {value['run_id']} attempt {value['run_attempt']}; product pushes=0",
                                      text="```json\n"+text+"\n```"))
              sent = subprocess.run(["gh","api","--method","POST",repo+"/check-runs","--input","-"],
                                    input=json.dumps(body),text=True,capture_output=True,check=True,timeout=60)
              check = json.loads(sent.stdout)
              seen = json.loads(subprocess.run(["gh","api",repo+"/check-runs/"+str(check["id"])],
                                capture_output=True,check=True,timeout=60).stdout)
              assert seen["head_sha"] == body["head_sha"] and seen["conclusion"] == body["conclusion"]
              assert seen["output"]["text"] == body["output"]["text"], "exact UI evidence readback"
              print(seen["html_url"])
          if failed:
              raise SystemExit(1)

          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-shortcut-report
          path: |
            shortcut-report.json
            shortcut-report.log
            ui-compact-api*.json
          if-no-files-found: error
          retention-days: 14

