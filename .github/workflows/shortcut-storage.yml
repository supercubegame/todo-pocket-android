           path=folder/(str(i)+".sh");path.write_text(script)
           subprocess.run(["bash","-n",str(path)],check=True)
          print("EXACT_REPAIRED_ORIGINAL_11_SHELL_BLOCKS_VERIFIED")
          PY
      - name: Restore exact six-file host-verified candidate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/5.sh"
      - name: Fixed disposable Android setup
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/6.sh"
      - name: Build isolated runner and restore original Gradle source
        env:
          BUILD_429_EXECUTE: 'true'
          BUILD_LOG: shortcut-build.log
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/7.sh"
      - name: Original regressions plus actual native default startup
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/8.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shortcut-device-api-${{ matrix.api }}
          path: |
            shortcut-device/
            shortcut-build.json
            shortcut-build.log
            shortcut-build-driver.log
            shortcut-android.log
            shortcut-setup.log
            emulator.log
          if-no-files-found: error
          retention-days: 14
  shortcut_report:
    needs:
      - shortcut_host
      - shortcut_device
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
