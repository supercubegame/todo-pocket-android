name: Read original business bridge device failures
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  read_original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify both original archives and publish exact seed streams
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,traceback,zipfile
          assert os.environ['GITHUB_REF']=='refs/heads/ci/shortcut-storage-preflight-4d8742'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          out=pathlib.Path('original-bridge-failures');out.mkdir()
          receipt={'status':'NOT_EXECUTED','product_pushes':0,'test_reruns':0,'source':'159cfae1935f3e7cfef054a07d05a9a4aec17740','original_run':38121264711,'devices':{}}
          endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/'
          def gh(path):
              return subprocess.check_output(['gh','api',endpoint+path],timeout=60)
          try:
              for api,ident,size,digest in [(26,11695431757,18978,'342cc78f298b0b10daa17786826a8be6532a75474cca29765a655bfeb58ce92d'),(34,11695118310,20467,'4ffcf308c08772d2cf8b7cd6ee5933acb6d555a73fd1d2f1a74e070a69e9a533')]:
                  meta=json.loads(gh('actions/artifacts/'+str(ident)))
                  assert meta['workflow_run']['id']==receipt['original_run'] and meta['workflow_run']['head_sha']==receipt['source']
                  assert meta['size_in_bytes']==size and meta['digest']=='sha256:'+digest and not meta['expired']
                  raw=gh('actions/artifacts/'+str(ident)+'/zip');(out/(str(api)+'.zip')).write_bytes(raw)
                  assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      names=z.namelist();assert len(names)==len(set(names)) and len(names)<200
                      assert sum(i.file_size for i in z.infolist())<8000000
                      assert all(not n.startswith('/') and '..' not in n.split('/') and '\\' not in n for n in names)
                      selected=[n for n in names if n.endswith('shortcut-device/seed.log')]
                      assert len(selected)==1,names
                      seed=z.read(selected[0]);assert len(seed)==2693
                      expected='afe1ffafcc08a053ca084be43f521480023da4f5c72b2edecf51f42e07e0fb64' if api==26 else '6063f120780293d432bed6a2673f5af288426dc6089586dd0fc9b4eed4efd113'
                      assert hashlib.sha256(seed).hexdigest()==expected
                      (out/(str(api)+'-seed.log')).write_bytes(seed)
                      receipt['devices'][str(api)]={'artifact':ident,'archive_sha256':digest,'seed_sha256':expected,'seed':seed.decode(),'members':names}
              receipt['status']='ORIGINAL_FAILURES_READ_NOT_ACCEPTANCE'
          except BaseException:
              receipt.update(status='READ_FAILED',error=traceback.format_exc())
          (out/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2))
          body=json.dumps(receipt,ensure_ascii=False,indent=2);assert len(body.encode())<60000
          request={'name':'Original bridge device failure evidence','head_sha':os.environ['GITHUB_SHA'],'external_id':os.environ['GITHUB_RUN_ID']+'-1','status':'completed','conclusion':'neutral' if receipt['status']=='ORIGINAL_FAILURES_READ_NOT_ACCEPTANCE' else 'failure','output':{'title':receipt['status'],'summary':'Original attempt only. No product write, rerun, UI activation or release.','text':'```json\n'+body+'\n```'}}
          made=json.loads(subprocess.check_output(['gh','api','--method','POST',endpoint+'check-runs','--input','-'],input=json.dumps(request).encode(),timeout=60))
          seen=json.loads(gh('check-runs/'+str(made['id'])))
          assert seen['head_sha']==request['head_sha'] and seen['conclusion']==request['conclusion'] and all(seen['output'][k]==v for k,v in request['output'].items())
          print('ORIGINAL_DEVICE_FAILURE_EXACT_READBACK',seen['html_url'])
          assert receipt['status']=='ORIGINAL_FAILURES_READ_NOT_ACCEPTANCE'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-bridge-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: original-bridge-failures/
          if-no-files-found: error
          retention-days: 14
