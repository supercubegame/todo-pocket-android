name: Promote accepted explicit activation
'on':
  push:
    branches:
      - ci/shortcut-storage-preflight-4d8742
permissions:
  contents: write
  actions: write
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  activation_delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - name: Materialize reviewed bounded delivery and transport controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib
          raw=lzma.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(raw).hexdigest()=='b587d77a1ec3834346614d60f9a41ffd8f14848a38ea55585780bbe8cd3e0400'
          files=json.loads(raw)
          assert set(files)=={"deliver-accepted.py","test-deliver-accepted.py"}
          for name,text in files.items():
              (pathlib.Path(os.environ["RUNNER_TEMP"])/name).write_text(text)
          PY
      - name: Use Java17 and test delivery failure boundaries
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          python3 "$RUNNER_TEMP/test-deliver-accepted.py"
      - name: Verify accepted archive, full21 hosts, atomic product update and dispatch
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/deliver-accepted.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/product-delivery"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: activation-product-delivery
          path: ${{ runner.temp }}/product-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete original delivery receipt with exact readback
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/deliver-accepted.py" publish "$RUNNER_TEMP/product-delivery"
