plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'com.supercubegame.pockettodo'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.supercubegame.pockettodo.safe'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    buildTypes {
        debug { applicationIdSuffix '.preview' }
        // No signing configuration: release delivery is blocked until a durable key is configured.
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
