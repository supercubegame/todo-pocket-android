           void nodes(AccessibilityNodeInfo node,String value,boolean description,List<AccessibilityNodeInfo> out){
            CharSequence actual=description?node.getContentDescription():node.getText();
            if(value.contentEquals(actual==null?"":actual))out.add(node);
            for(int i=0;i<node.getChildCount();i++){AccessibilityNodeInfo child=node.getChild(i);if(child!=null)nodes(child,value,description,out);}
           }
           AccessibilityNodeInfo editWindow(boolean present)throws Exception{
            long deadline=SystemClock.elapsedRealtime()+10000;
            while(true){
             AccessibilityNodeInfo window=getUiAutomation().getRootInActiveWindow();
             if(window!=null&&getTargetContext().getPackageName().contentEquals(window.getPackageName()==null?"":window.getPackageName())){
              List<AccessibilityNodeInfo> found=new ArrayList<>();nodes(window,"编辑待办输入",true,found);
              if(present&&found.size()==1||!present&&found.isEmpty())return window;
             }
             need(SystemClock.elapsedRealtime()<deadline,"editor accessibility window deadline");SystemClock.sleep(50);
            }
