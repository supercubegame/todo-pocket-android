name: Recover original native startup failure
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  original_failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read original failed job once without rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-failure"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"original-failure"
          repo="repos/"+os.environ["GITHUB_REPOSITORY"]
          def api(path):
              return subprocess.check_output(["gh","api",repo+path],timeout=60)
          run=json.loads(api("/actions/runs/38535075337"))
          assert run["head_sha"]=="ab5162f847db4a2b88229b156c3702c31707a4ac" and run["run_attempt"]==1
          job=json.loads(api("/actions/jobs/115757274638"))
          assert job["run_id"]==38535075337 and job["conclusion"]=="failure"
          raw=api("/actions/jobs/115757274638/logs")
          assert 0<len(raw)<=10485760,"original log empty or exceeds explicit 10MiB recovery bound"
          (out/"original-host.log").write_bytes(raw)
          (out/"original-run.json").write_text(json.dumps(run))
          (out/"original-job.json").write_text(json.dumps(job))
          text=raw.decode("utf-8","strict")
          # Keep the complete original log in the artifact. Publish the complete
          # integration-to-end suffix, including its first failure and publisher.
          marker="##[group]Run set -euo pipefail"
          starts=[i for i in range(len(text)) if text.startswith(marker,i)]
          chosen=[i for i in starts if "import ast,base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request" in text[i:i+2000]]
          assert len(chosen)==1,("integration log boundary",len(chosen))
          suffix=text[chosen[0]:]
          parts=[];part=""
          for char in suffix:
              if len((part+char).encode())>40000:
                  parts.append(part);part=""
              part+=char
          if part: parts.append(part)
          assert "".join(parts)==suffix and 0<len(parts)<=20,"incomplete recovery split"
          meta={"source_commit":run["head_sha"],"source_run":run["id"],"source_attempt":1,
                "source_job":job["id"],"original_conclusion":"failure","bytes":len(raw),
                "sha256":hashlib.sha256(raw).hexdigest(),"suffix_bytes":len(suffix.encode()),
                "published_parts":len(parts),"scope":"READ_ONLY_RECOVERY_NOT_TEST_PASS_NO_RERUN_NO_PRODUCT_PUSH"}
          (out/"recovery.json").write_text(json.dumps(meta,indent=2))
          for index,part in enumerate(parts,1):
              body={"name":f"Original ab5162 failure {index}/{len(parts)}","head_sha":os.environ["GITHUB_SHA"],
                    "status":"completed","conclusion":"success","output":{"title":"Recovered original failure, not test acceptance",
                    "summary":json.dumps(meta),"text":"```text\n"+part+"\n```"}}
              sent=subprocess.run(["gh","api","--method","POST",repo+"/check-runs","--input","-"],
                  input=json.dumps(body),text=True,capture_output=True,timeout=60,check=True)
              made=json.loads(sent.stdout)
              seen=json.loads(api("/check-runs/"+str(made["id"])))
              assert seen["head_sha"]==body["head_sha"] and seen["output"]==dict(body["output"],annotations_count=0,annotations_url=seen["output"]["annotations_url"])
              print(seen["html_url"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-ab5162-failure
          path: ${{ runner.temp }}/original-failure/
          if-no-files-found: error
          retention-days: 14
