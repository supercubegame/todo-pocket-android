          NATIVE_REQUIRED='fixture_text_image cancel_unsaved_readonly explicit_save_readonly restart_no_autorestore recover_cancel_readonly recover_confirm_readonly discard_cancel_readonly discard_confirm_readonly empty_draft_saved empty_recovered_body_rejected commit_exact_one_revision restart_committed'.split()
          NATIVE_REQUIRED+='new_slot_save_readonly new_slot_restart_saved existing_slot_isolation new_slot_recover_readonly new_slot_commit_append new_slot_cleanup_readonly new_slot_restart_cleaned'.split()
          NATIVE_REQUIRED+='same_title_fixture same_title_first_saved same_title_second_saved same_title_first_recovered same_title_first_discarded same_title_second_recovered'.split()
          NATIVE_REQUIRED+='same_title_restart_discarded same_title_restart_sibling_recovered'.split()
          def validate_native(v,manifest,log,images):
              for key,expected in manifest.items():
