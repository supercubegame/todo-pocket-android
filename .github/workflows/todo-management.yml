        run: |
          set -euo pipefail
          python3 tools/verify_todo_management.py android 2>&1 | tee todo-android.log
      - name: Real native todo controls and independent database readback
        env:
          NATIVE_TODO_MODE: android
        run: *todo_native_gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: todo-device-api-${{ matrix.api }}
          path: |
            todo-apk.json
            todo-device/
            todo-native/
            todo-native-android.log
            todo-setup.log
            todo-build.log
            todo-android.log
            emulator.log
            device-schema3-registration-todo-*.txt
          if-no-files-found: error
          retention-days: 14
  todo_report:
    needs: [todo_host, todo_device]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: todo-*
          path: collected-todos
      - name: Require both devices and publish bounded failure evidence
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/verify_todo_management.py report
      - name: Require independent native UI evidence
        if: always()
        env:
          NATIVE_TODO_MODE: report
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: *todo_native_gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-todo-report
          path: |
            todo-report.json
            todo-native-report.json
            todo-native-report.log
          if-no-files-found: error
          retention-days: 14
