          b.put("revision",new ArrayList<>(Arrays.asList(row("rowid","id","value"),row("1:1","1:1","1:8"))));
          b.put("other",new ArrayList<>(Arrays.asList(row("rowid","id"),row("1:3","3:keep"))));
