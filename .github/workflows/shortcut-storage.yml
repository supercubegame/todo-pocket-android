          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/10b90458f365931e6d87df0d389fabca9a9f09d9/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r:raw=r.read(28333)
          assert len(raw)==28332 and hashlib.sha1(b"blob 28332"+bytes([0])+raw).hexdigest()=="e8c08c036b3a074c43d288aa269d01c4d72b311f"
          text=raw.decode();out=pathlib.Path(os.environ["RUNNER_TEMP"])/"crash-predecessor";out.mkdir()
          shared=None
          for job,count in {'shortcut_host': 36, 'shortcut_device': 15, 'shortcut_report': 15}.items():
              rest=text.split("  "+job+":\n",1)[1];lines=[]
              for line in rest.splitlines(keepends=True):
                  if line.startswith("  shortcut_"):break
                  lines.append(line)
              scripts=[]
              for i,line in enumerate(lines):
                  if line=="        run: |\n":
                      body=[]
                      for item in lines[i+1:]:
                          if item.strip() and not item.startswith("          "):break
                          body.append(item[10:] if item.startswith("          ") else item)
                      scripts.append("".join(body))
              if job=="shortcut_host":
                  assert "      - &ref_0\n" in rest
                  shared=scripts[0]
              else:
                  assert "".join(lines).count("      - *ref_0\n")==1
                  scripts.insert(0,shared)
              assert len(scripts)==count,(job,len(scripts))
              for i,script in enumerate(scripts):
                  assert script.startswith("set -euo pipefail\n")
                  (out/(job+"-"+str(i)+".sh")).write_text(script)
          PY
