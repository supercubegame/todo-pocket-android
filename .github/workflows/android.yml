name: V1.2 staged verification
on:
  push:
    branches: [feature/v1.2-activity-notes-ledger]
  pull_request:
    branches: [main, feature/v1.1-edit-backup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Legacy regression and V1.2 domain contracts
        run: |
          set -euo pipefail
          python3 tools/verify.py v12 2>&1 | tee core.log
      - name: Verify unfinished APK cannot be mislabeled
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee -a core.log
          import subprocess
          result = subprocess.run(['python3','tools/verify.py','build'],capture_output=True,text=True)
          assert result.returncode != 0, 'Unfinished Android build gate must fail'
          assert 'V1.2 Android phase is not wired' in result.stderr, 'Unexpected failure is not proof of release guard'
          print('PASS unfinished V1.2 build explicitly blocked before Gradle')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-evidence
          path: core.log
          if-no-files-found: error
  report:
    needs: [core]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: collected
      - name: Record explicit staged scope
        run: |
          mkdir -p collected/scope
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('collected/scope/ui-result.json').write_text(json.dumps({'status':'NOT_TESTED','scope':'V1.2_DOMAIN_CONTRACTS_ONLY','android_build':'NOT_TESTED','screenshots':'NOT_TESTED','exports':'NOT_TESTED','backup_restore':'NOT_TESTED','release_ready':False}))
          PY
      - name: Publish and read back evidence
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/verify.py report
