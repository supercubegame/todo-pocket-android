name: Explicit activation UI exact transfer repair
'on':
  push:
    branches:
      - ci/shortcut-storage-preflight-4d8742
permissions:
  contents: read
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  shortcut_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - name: Verify exact original source and repair two transport escapes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/cbbc66ec225157ace12dc56402445390beb1df66/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: data=r.read(29381)
          blob=lambda b:hashlib.sha1(b"blob "+str(len(b)).encode()+bytes([0])+b).hexdigest()
          assert len(data)==29380 and blob(data)=="b72879364d180397e06857650fd246c3644ff357"
          text=data.decode()
          pairs=[
           ('driver=driver.replace(anchor,anchor+"'+chr(92)+'n"+insert,1)', 'driver=driver.replace(anchor,anchor+"'+chr(92)*2+'n"+insert,1)'),
           ('static boolean isolatedActivationTest;")'+chr(92)+"n"+chr(92)+"'+anchor,1)", 'static boolean isolatedActivationTest;")'+chr(92)*2+"n"+chr(92)+"'+anchor,1)")
          ]
          for old,new in pairs:
           assert text.count(old)==1
           text=text.replace(old,new,1)
          fixed=text.encode()
          assert len(fixed)==29382 and blob(fixed)=="7ded9ebe7dca9e669e6dd4f6b906191f1ef957a0"
          assert hashlib.sha256(fixed).hexdigest()=="8ba546250800b9d2f752cf70446f11de83bdebd137acde6cf771621b5f576d2d"
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"exact-activation-scripts"
          folder.mkdir()
          lines=text.splitlines();scripts=[]
          for i,line in enumerate(lines):
           if line=="        run: |":
            body=[]
            for tail in lines[i+1:]:
             if tail and not tail.startswith("          "):break
             body.append(tail[10:] if tail else "")
            scripts.append("\n".join(body)+"\n")
          assert len(scripts)==11
          for i,script in enumerate(scripts):
           path=folder/(str(i)+".sh");path.write_text(script)
           subprocess.run(["bash","-n",str(path)],check=True)
          print("EXACT_REPAIRED_ORIGINAL_11_SHELL_BLOCKS_VERIFIED")
          PY
      - name: Use Java 17
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/0.sh"
      - name: Restore exact pinned backend materializer
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/1.sh"
      - name: Preserve original RED and backend host gates
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/2.sh"
      - name: Integrate default startup UI and rerun all 21 original hosts
        id: integration
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/3.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: activation-host
          path: ${{ runner.temp }}/activation-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact host outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_OUTCOME: ${{ steps.integration.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/exact-activation-scripts/4.sh"
  shortcut_device:
    needs: shortcut_host
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api:
          - 26
          - 34
    env:
      TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
