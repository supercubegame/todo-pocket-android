      - &ref_0
        name: Restore unchanged diagnostic and original budgets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/9e93888af2ed2450a6d1077379edfc3595913f04/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r:raw=r.read(24667)
          assert len(raw)==24666 and hashlib.sha1(b"blob 24666"+bytes([0])+raw).hexdigest()=="c4ebc9b185542c900c8b6b0fbc22ae04dec7a27e"
          text=raw.decode();out=pathlib.Path(os.environ["RUNNER_TEMP"])/"connection-predecessor";out.mkdir()
          shared=None
          for job,count in {'shortcut_host': 37, 'shortcut_device': 17, 'shortcut_report': 16}.items():
              rest=text.split("  "+job+":\n",1)[1];lines=[]
              for line in rest.splitlines(keepends=True):
                  if line.startswith("  shortcut_"):break
                  lines.append(line)
              scripts=[]
              for i,line in enumerate(lines):
                  if line=="        run: |\n":
                      body=[]
                      for item in lines[i+1:]:
                          if item.strip() and not item.startswith("          "):break
                          body.append(item[10:] if item.startswith("          ") else item)
                      scripts.append("".join(body))
              if job=="shortcut_host":
                  assert "      - &ref_0\n" in rest
                  shared=scripts[0]
              else:
                  assert "".join(lines).count("      - *ref_0\n")==1
                  scripts.insert(0,shared)
              assert len(scripts)==count,(job,len(scripts))
              for i,script in enumerate(scripts):
                  assert script.startswith("set -euo pipefail\n")
                  (out/(job+"-"+str(i)+".sh")).write_text(script)
          PY
