name: Pagination readiness and original timeout evidence
'on':
  push:
    branches:
      - ci/shortcut-storage-preflight-4d8742
permissions:
  contents: write
  actions: write
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  readiness_delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c9d905b37061c0f52f57be54c318ce275ef0f1fa
          persist-credentials: false
      - name: Restore pinned transport and approved test-only repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,json,lzma,os,pathlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/42f2ae2fc8bfd6de86a92aed21784da195aee31c/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as response:original=response.read(14885)
          assert len(original)==14884 and hashlib.sha256(original).hexdigest()=="968ed9265fb35f7f1614e866da37e91159ea3865eb519ec49bbb1482007d5592"
          body=original.decode().split("          python3 - <<'PY'\n",1)[1].split("          PY\n",1)[0]
          assert all(not line or line.startswith("          ") for line in body.splitlines())
          code="\n".join(line[10:] for line in body.splitlines())+"\n"
          ast.parse(code);exec(compile(code,"pinned-transport-restore","exec"),{})
          raw=lzma.decompress(base64.b64decode("",validate=True))
          assert len(raw)==36936 and hashlib.sha256(raw).hexdigest()=="9e17a32db63b37be6dad851502cd1771742866f96ecdd6e25c56089f8e488ad5"
          bundle=json.loads(raw)
          assert set(bundle)=={"repair.py","prepare.py"}
          for name,code in bundle.items():
              ast.parse(code);(pathlib.Path(os.environ["RUNNER_TEMP"])/name).write_text(code)
          PY
      - name: Java17 and actual adapted transport controls
        env:
          ORIGINAL_DRIVER_SHA: cc83f9374afd35c87252fe189c6ea7afaf7e985cc8eb9a9c9dc48ffca3fed58c
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          python3 "$RUNNER_TEMP/prepare.py"
          python3 "$RUNNER_TEMP/test-deliver-accepted.py"
      - name: Full original21 once then atomic exact product delivery
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/deliver-accepted.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/readiness-delivery"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: readiness-timeout-delivery
          path: ${{ runner.temp }}/readiness-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete delivery receipt and failure tails
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/deliver-accepted.py" publish "$RUNNER_TEMP/readiness-delivery"
