          def blob(data):return hashlib.sha1(b'blob %d\0'%len(data)+data).hexdigest()
          def candidates(root):
              patch=Path(__file__).with_name('consent.patch').read_bytes();assert len(patch)==10778 and hashlib.sha256(patch).hexdigest()=='df8a5df5587261917f99969c22c20e367b072710d74a9ff9dabe12c659a05e50'
              assert set(PINS)==set(FINAL);b={}
              for path,pin in PINS.items():
                  f=Path(root)/path;assert f.is_file() and not f.is_symlink();b[path]=f.read_bytes();assert blob(b[path])==pin
              with tempfile.TemporaryDirectory() as tmp:
                  t=Path(tmp)
                  for name,data in b.items():
                      f=t/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(data)
                  for opts in (['--check'],[]):subprocess.run(['git','apply',*opts,'-'],cwd=t,input=patch,check=True,timeout=30)
                  assert {p.relative_to(t).as_posix() for p in t.rglob('*') if p.is_file()}==set(PINS)
                  out={p:(t/p).read_bytes() for p in PINS if not (t/p).is_symlink()};assert {p:blob(data) for p,data in out.items()}==FINAL;return out
          REPAIR
          python3 - <<'CHECK'
          import repair,os
