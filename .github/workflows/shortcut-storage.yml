name: Guarded shortcut six-file delivery
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: write
  actions: read
  checks: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify original preflight bytes and publish six non-workflow files once
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          """Proposed two-commit transport. NOT EXECUTED remotely; needs changed-scope consent.
          One isolated workflow would publish six exact non-workflow files. The existing
          Personal connection would then submit the seventh file and trigger final CI.
          No product write occurs when generating or locally testing this program.
          """
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          REPO = "supercubegame/todo-pocket-android"
          BRANCH = "feature/v1.2-activity-notes-ledger"
          BASE = "4d8742d5671f915c6887d11212ad973abb2a0d63"
          PREFLIGHT_SHA = "0c84da7056a1e910675c8cc35822c3426167c64c"
          RUN = 38023020342
          ARTIFACT = 11659560223
          ARCHIVE_SHA = "4328e92d9852981696630260b368d3fd88aa4c5d039ed15bccf5715099cad321"
          WORKFLOW = ".github/workflows/shortcut-storage.yml"


          def identity(raw):
              return {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest(),
                      "blob": hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()}


          def checked_candidates(archive, expected, commands, verify_archive=True):
              if verify_archive:
                  assert len(archive) == 120510
                  assert hashlib.sha256(archive).hexdigest() == ARCHIVE_SHA, "archive identity differs"
              with zipfile.ZipFile(io.BytesIO(archive)) as source:
                  names = source.namelist()
                  assert len(names) == len(set(names)), "duplicate archive paths"
                  assert len(names) < 100 and sum(p.file_size for p in source.infolist()) < 4 * 1024 * 1024
                  for name in names:
                      assert not name.startswith("/") and ".." not in name.split("/") and "\\" not in name
                  receipt = json.loads(source.read("receipt.json"))
                  assert receipt["status"] == "PASS" and receipt["baseline"] == BASE
                  assert receipt["workflow_commit"] == PREFLIGHT_SHA
                  assert receipt["run_id"] == str(RUN) and receipt["attempt"] == "1"
                  assert receipt["completed_commands"] == receipt["passed_commands"] == 21
                  assert len(commands) == 21 and receipt["expected_commands"] == commands
                  assert [r["command"] for r in receipt["host_commands"]] == commands
                  assert receipt["candidate_files"] == expected and len(expected) == 7
                  assert receipt["product_pushes"] == 0 and receipt["device_execution"] is False
                  for index, record in enumerate(receipt["host_commands"], 1):
                      assert record["index"] == index
                      assert record["returncode"] == 0 and record["timed_out"] is False
                      assert record["attempts"] == 1 and record["budget_seconds"] == 300
                      for stream in ("stdout", "stderr"):
                          entry = record[stream]
                          assert entry["path"] == "%02d.%s" % (index, stream)
                          assert identity(source.read(entry["path"])) == {k: entry[k] for k in ("bytes", "sha256", "blob")}
                  candidates = {p: source.read("candidate/" + p) for p in expected}
                  for path, raw in candidates.items():
                      assert identity(raw) == expected[path], "candidate identity differs: " + path
                  assert {n for n in names if n.startswith("candidate/") and not n.endswith("/")} == {"candidate/" + p for p in expected}
                  return candidates, receipt


          def publish_six(api, candidates, expected):
              """The caller owns authentication. No fallback, force update, merge or retry."""
              assert set(candidates) == set(expected) and len(expected) == 7
              for path, raw in candidates.items():
                  assert identity(raw) == expected[path]
              ref = "git/refs/heads/" + BRANCH
              assert api(ref)["object"]["sha"] == BASE, "product baseline drift"
              baseline = api("git/commits/" + BASE)
              assert baseline["sha"] == BASE
              selected = {p: raw for p, raw in candidates.items() if p != WORKFLOW}
              assert len(selected) == 6 and not any(p.startswith(".github/") for p in selected)
              entries = []
              for path, raw in selected.items():
                  created = api("git/blobs", {"encoding": "base64", "content": base64.b64encode(raw).decode()})
                  assert created["sha"] == expected[path]["blob"]
                  observed = api("git/blobs/" + created["sha"])
                  assert observed["encoding"] == "base64"
                  assert base64.b64decode(observed["content"]) == raw, "remote blob differs"
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": created["sha"]})
              tree = api("git/trees", {"base_tree": baseline["tree"]["sha"], "tree": entries})
              commit = api("git/commits", {"message": "feat: stage verified opt-in shortcut storage sources (device gate pending)",
                                         "tree": tree["sha"], "parents": [BASE]})
              remote = api("git/commits/" + commit["sha"])
              assert [p["sha"] for p in remote["parents"]] == [BASE]
              assert remote["tree"]["sha"] == tree["sha"]
              comparison = api("compare/" + BASE + "..." + commit["sha"])
              assert comparison["total_commits"] == 1
              assert len(comparison["files"]) == 6
              assert {f["filename"] for f in comparison["files"]} == set(selected)
              for f in comparison["files"]:
                  assert f["sha"] == expected[f["filename"]]["blob"]
              assert api(ref)["object"]["sha"] == BASE, "product drift before publication"
              # One non-force update. A racing descendant of BASE cannot be fast-forwarded
              # to this sibling commit, so GitHub rejects it instead of overwriting it.
              api(ref, {"sha": commit["sha"], "force": False}, method="PATCH")
              assert api(ref)["object"]["sha"] == commit["sha"], "published ref readback differs"
              return {"status": "SIX_FILES_PUBLISHED_SEVENTH_WORKFLOW_PENDING_NOT_ACCEPTED",
                      "base": BASE, "commit": commit["sha"], "paths": sorted(selected),
                      "product_ref_updates": 1, "android_executed": False, "release_ready": False}


          import subprocess
          import traceback
          EXPECTED = {'src/main/java/com/supercubegame/pockettodo/Schema3Store.java': {'bytes': 34994, 'blob': '99d748cbc08fe2f122ec6cd16d2a36dac3f1edf3', 'sha256': '366e8a9495d47d262007eafb436664e077cf99e5f5457514d16c8b7e40dd7bba'}, 'AGENTS.md': {'bytes': 9656, 'blob': 'a0f3a081e6e90d2ef95b506991b69c810b5eaa81', 'sha256': '14bb2b000405ad71f12283129a410cec0058ce122d892412815ce61dcc8e3847'}, 'CLAUDE.md': {'bytes': 9656, 'blob': 'a0f3a081e6e90d2ef95b506991b69c810b5eaa81', 'sha256': '14bb2b000405ad71f12283129a410cec0058ce122d892412815ce61dcc8e3847'}, 'src/main/java/com/supercubegame/pockettodo/Schema4Store.java': {'bytes': 26697, 'blob': '939ae6b1a0ad9ca6fa4883f65119df144e40bdff', 'sha256': 'a62d9fe0e012642814addf209fc5ac55d83e26bc5bf4e3646c2c851a72aab863'}, 'src/androidTest/java/com/supercubegame/pockettodo/Schema4DeviceTest.java': {'bytes': 21033, 'blob': '939baf2c6ffcc2a87dfd58a3eb655bd39af27d40', 'sha256': '2d0bc7772e020e07027589d1b7a925f408f5b17e02e59d2d95bc9df06430465a'}, 'tools/verify_shortcuts.py': {'bytes': 48594, 'blob': '4c2e0a4a8146fe75fca93e65b0c7f1447b2ce702', 'sha256': 'd62b9bd77500a5a25d982d1e62b429d46fb6503fc1dab8b5de3b9dbc98357e3c'}, '.github/workflows/shortcut-storage.yml': {'bytes': 4219, 'blob': 'feb297e1398fd211a9d3380854eba494cc4add0e', 'sha256': 'f3353035ad996e72c90fff5220440dc82ce9af07756d627907f53ad8e66c7f94'}}
          COMMANDS = [['python3', 'tools/verify_app_catalog.py', 'selftest'], ['python3', 'tools/verify.py', 'v12'], ['python3', 'tools/verify_process_control.py', 'selftest'], ['python3', 'tools/verify_ui_observer.py', 'selftest'], ['python3', 'tools/verify_adb_transfer.py'], ['python3', 'tools/verify_evidence.py'], ['python3', 'tools/verify_schema3.py', 'selftest'], ['python3', 'tools/verify_note_drafts.py', 'selftest'], ['python3', 'tools/verify_todo_management.py', 'selftest'], ['python3', 'tools/verify_custom_fields.py', 'selftest'], ['python3', 'tools/verify_category_drag.py', 'selftest'], ['python3', '-c', 'import sys;sys.path.insert(0,"tools");import emulator_gate;emulator_gate.parser_selftest()'], ['python3', 'tools/verify_batch_exports.py', 'selftest'], ['python3', 'tools/verify_upgrade.py', 'selftest'], ['python3', 'tools/verify_upgrade.py', 'workflow-selftest'], ['python3', 'tools/verify_process_control.py', 'server-log-selftest'], ['python3', 'tools/verify_process_control.py', 'isolated-selftest'], ['python3', 'tools/verify_process_control.py', 'absence-selftest'], ['python3', 'tools/verify_paged_exports.py', 'selftest'], ['python3', 'tools/verify_note_management.py', 'selftest'], ['python3', 'tools/verify_shortcuts.py', 'selftest']]
          output = Path("delivery-evidence")
          output.mkdir()
          audit = []
          receipt = {"status":"STARTED_NO_PRODUCT_WRITE", "baseline":BASE, "source_run":RUN,
           "source_artifact":ARTIFACT, "workflow_commit":os.environ["GITHUB_SHA"],
           "run_id":os.environ["GITHUB_RUN_ID"], "attempt":os.environ["GITHUB_RUN_ATTEMPT"],
           "candidate_files":EXPECTED, "api_calls":audit, "android_executed":False, "release_ready":False}
          def save():
              (output / "receipt.json").write_text(json.dumps(receipt, indent=2))
          def api(path, data=None, method=None):
              method = method or ("POST" if data is not None else "GET")
              command = ["gh","api","--method",method,"repos/" + REPO + "/" + path]
              if data is not None:
                  command += ["--input","-"]
              entry = {"method":method,"path":path,"attempts":1,"status":"STARTED"}
              audit.append(entry)
              if method == "PATCH":
                  receipt["ref_update_attempted"] = True
              save()
              result = subprocess.run(command, input=json.dumps(data).encode() if data is not None else None,
                 stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
              entry.update(returncode=result.returncode, stdout_sha256=hashlib.sha256(result.stdout).hexdigest())
              (output / ("%02d.stderr" % len(audit))).write_bytes(result.stderr)
              entry["status"] = "PASS" if result.returncode == 0 else "FAIL"
              save()
              if result.returncode:
                  raise RuntimeError("Original API refusal: " + result.stderr.decode("utf-8","replace")[-4000:])
              return json.loads(result.stdout)
          save()
          try:
              assert os.environ["GITHUB_REF"] == "refs/heads/ci/shortcut-storage-preflight-4d8742"
              assert os.environ["GITHUB_EVENT_NAME"] == "push"
              run = api("actions/runs/" + str(RUN))
              assert run["head_sha"] == PREFLIGHT_SHA and run["run_attempt"] == 1 and run["conclusion"] == "success"
              meta = api("actions/artifacts/" + str(ARTIFACT))
              assert meta["workflow_run"]["id"] == RUN and meta["workflow_run"]["head_sha"] == PREFLIGHT_SHA
              assert meta["name"] == "shortcut-preflight-38023020342-1"
              assert meta["size_in_bytes"] == 120510 and meta["digest"] == "sha256:" + ARCHIVE_SHA and not meta["expired"]
              downloaded = subprocess.run(["gh","api","repos/" + REPO + "/actions/artifacts/" + str(ARTIFACT) + "/zip"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=90)
              (output / "artifact-download.stderr").write_bytes(downloaded.stderr)
              assert downloaded.returncode == 0, "artifact download failed: " + downloaded.stderr.decode("utf-8","replace")[-3000:]
              candidates, original = checked_candidates(downloaded.stdout, EXPECTED, COMMANDS)
              (output / "verified-original-artifact.zip").write_bytes(downloaded.stdout)
              receipt["verified_archive_sha256"] = ARCHIVE_SHA
              receipt["original_commands_verified"] = 21
              receipt["status"] = "EXACT_PREFLIGHT_VALIDATED"
              save()
              delivered = publish_six(api, candidates, EXPECTED)
              receipt.update(delivered)
          except Exception:
              receipt["status"] = "FAILED_OR_UNCERTAIN_STOPPED_NO_RETRY"
              receipt["original_error"] = traceback.format_exc()
          finally:
              save()
              print(json.dumps(receipt, indent=2), flush=True)
          if receipt["status"] != "SIX_FILES_PUBLISHED_SEVENTH_WORKFLOW_PENDING_NOT_ACCEPTED":
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: shortcut-six-file-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact delivery receipt including original failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'

          import json, os, pathlib, subprocess
          path = pathlib.Path("delivery-evidence/receipt.json")
          receipt = json.loads(path.read_text()) if path.exists() else {"status":"NO_RECEIPT", "ref_update_attempted":"unknown"}
          receipt["artifact_url"] = os.environ.get("ARTIFACT_URL","")
          receipt["artifact_digest"] = os.environ.get("ARTIFACT_DIGEST","")
          receipt["delivery_outcome"] = os.environ["DELIVERY_OUTCOME"]
          receipt["artifact_outcome"] = os.environ["ARTIFACT_OUTCOME"]
          ok = receipt["status"] == "SIX_FILES_PUBLISHED_SEVENTH_WORKFLOW_PENDING_NOT_ACCEPTED" and receipt["delivery_outcome"] == receipt["artifact_outcome"] == "success"
          body = json.dumps(receipt, indent=2)
          assert len(body.encode()) < 62000
          payload = {"name":"Shortcut six-file delivery evidence", "head_sha":os.environ["GITHUB_SHA"],
           "status":"completed","conclusion":"success" if ok else "failure",
           "external_id":os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"],
           "output":{"title":"Six-file delivery, seventh workflow and Android acceptance pending",
           "summary":receipt["status"], "text":"```json\n" + body + "\n```"}}
          endpoint = "repos/" + os.environ["GITHUB_REPOSITORY"] + "/check-runs"
          def api(args, data=None):
              p = subprocess.run(["gh","api"] + args, input=data, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
              if p.returncode:
                  raise RuntimeError(p.stderr[-3000:])
              return json.loads(p.stdout)
          posted = api(["--method","POST",endpoint,"--input","-"], json.dumps(payload))
          readback = api([endpoint + "/" + str(posted["id"])])
          for key in ("head_sha","external_id","conclusion","output"):
              if key == "output":
                  for field in ("title","summary","text"):
                      assert readback[key][field] == payload[key][field]
              else:
                  assert readback[key] == payload[key]
          print("DELIVERY_RECEIPT_EXACT_READBACK", readback["url"])
          if not ok:
              raise SystemExit(1)
          PY
