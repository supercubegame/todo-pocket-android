name: Trace original delivery worktree refusal
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  delivery_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - name: Recover exact original driver and add read-only per-command observations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,hashlib,os,pathlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/42f2ae2fc8bfd6de86a92aed21784da195aee31c/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as response:raw=response.read(14885)
          assert len(raw)==14884 and hashlib.sha256(raw).hexdigest()=="968ed9265fb35f7f1614e866da37e91159ea3865eb519ec49bbb1482007d5592"
          text=raw.decode()
          body=text.split("          python3 - <<'PY'\n",1)[1].split("          PY\n",1)[0]
          assert all(not line or line.startswith("          ") for line in body.splitlines())
          program="\n".join(line[10:] for line in body.splitlines())+"\n"
          ast.parse(program);exec(compile(program,"immutable-original-payload","exec"),{})
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          path=root/"deliver-accepted.py";source=path.read_text()
          (root/"deliver-accepted-original.py").write_text(source)
          header='    save()\n    try:\n'
          helper='''    def observe_worktree(label):
                  raw = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"], cwd=root)
                  names = raw.decode("utf-8").split("\\0")[:-1]
                  records = []
                  for name in names:
                      path = root/name
                      row = {"path": name, "symlink": path.is_symlink()}
                      if not row["symlink"] and path.is_file():
                          row.update(identity(path.read_bytes()))
                      records.append(row)
                  receipt.setdefault("worktree_observations", []).append({"after": label, "untracked": records})
                  save()
              save()
              observe_worktree("before-original-hosts")
              try:
          '''
          after='            receipt["host_commands"].append(row);save()\n'
          final='        need(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], cwd=root) == b"", "no untracked product paths")'
          stop='        need(api("git/ref/heads/"+BRANCH)["object"]["sha"] == BASE, "product changed during preflight")'
          for anchor in (header,after,final,stop):assert source.count(anchor)==1,anchor
          source=source.replace(header,helper,1)
          source=source.replace(after,after+'            observe_worktree("host-"+str(i))\n',1)
          source=source.replace(final,'        observe_worktree("original-final-guard")\n'+final,1)
          source=source.replace(stop,'        raise AssertionError("DIAGNOSTIC_ONLY_NO_PRODUCT_WRITE")\n'+stop,1)
          ast.parse(source)
          assert source.count(final)==1
          assert source.index('raise AssertionError("DIAGNOSTIC_ONLY_NO_PRODUCT_WRITE")')<source.index('api("git/blobs", "POST"')
          path.write_text(source)
          (root/"worktree-observer.py").write_text(helper.split('    save()\n    observe_worktree',1)[0])
          import subprocess,tempfile,textwrap
          observer=textwrap.dedent(helper.split('    save()\n    observe_worktree',1)[0])
          with tempfile.TemporaryDirectory() as tmp:
              repo=pathlib.Path(tmp);subprocess.run(["git","init","-q",tmp],check=True)
              receipt={};saves=[]
              scope={"root":repo,"receipt":receipt,"subprocess":subprocess,
                  "identity":lambda raw:{"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()},
                  "save":lambda:saves.append(True)}
              exec(observer,scope)
              scope["observe_worktree"]("before")
              assert receipt["worktree_observations"][-1]["untracked"]==[]
              (repo/"fixture-output.txt").write_bytes(b"exact")
              scope["observe_worktree"]("after")
              assert receipt["worktree_observations"][-1]["untracked"]==[
                  {"path":"fixture-output.txt","symlink":False,"bytes":5,"sha256":hashlib.sha256(b"exact").hexdigest()}]
              original=subprocess.check_output(["git","ls-files","--others","--exclude-standard"],cwd=repo)
              assert original!=b"" and (repo/"fixture-output.txt").read_bytes()==b"exact" and len(saves)==2
          print("REAL_GIT_OBSERVER_CONTROLS_PASS_ORIGINAL_UNTRACKED_REFUSAL_PRESERVED")
          PY
      - name: Use Java17 and retain original transport tests
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          cp "$RUNNER_TEMP/deliver-accepted.py" "$RUNNER_TEMP/deliver-diagnostic.py"
          cp "$RUNNER_TEMP/deliver-accepted-original.py" "$RUNNER_TEMP/deliver-accepted.py"
          python3 "$RUNNER_TEMP/test-deliver-accepted.py"
          cp "$RUNNER_TEMP/deliver-diagnostic.py" "$RUNNER_TEMP/deliver-accepted.py"
      - name: Original21 commands once with per-command worktree identities
        id: diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/deliver-accepted.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/product-delivery"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: activation-worktree-diagnostic
          path: ${{ runner.temp }}/product-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete original refusal and file observations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          DELIVERY_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/deliver-accepted.py" publish "$RUNNER_TEMP/product-delivery"
