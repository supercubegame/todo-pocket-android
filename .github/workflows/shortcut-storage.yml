name: Receiver acknowledgement delivery
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions: {contents: write, actions: write, checks: write}
concurrency: {group: shortcut-business-bridge-delivery, cancel-in-progress: false}
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
