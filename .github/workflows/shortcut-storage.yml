name: Native startup database independent replay
'on':
  push:
    branches:
      - ci/shortcut-storage-preflight-4d8742
permissions:
  contents: read
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  shortcut_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - name: Restore exact accepted predecessor scripts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/cc06d83314b629746ac9a5588bcd2e0f581c255d/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(21795)
          assert len(raw)==21794 and hashlib.sha1(b"blob 21794"+bytes([0])+raw).hexdigest()=="93a051e95e02d9057a35ff335ffc3e3e2714f6f1"
          text=raw.decode();out=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-predecessor";out.mkdir()
          for job,count in (("shortcut_host",15),("shortcut_device",5),("shortcut_report",4)):
              assert text.count("  "+job+":\n")==1
              rest=text.split("  "+job+":\n",1)[1]
              lines=[]
              for line in rest.splitlines(keepends=True):
                  if line.startswith("  shortcut_"):break
                  lines.append(line)
              scripts=[]
              for index,line in enumerate(lines):
                  if line=="        run: |\n":
                      body=[]
                      for item in lines[index+1:]:
                          if item.strip() and not item.startswith("          "):break
                          body.append(item[10:] if item.startswith("          ") else item)
                      scripts.append("".join(body))
              assert len(scripts)==count,(job,len(scripts))
              for i,script in enumerate(scripts):
                  assert script.startswith("set -euo pipefail\n")
                  (out/(job+"-"+str(i)+".sh")).write_text(script)
          PY
      - name: Restore hash-bound original c91 host steps
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-0.sh"
      - name: Verify exact original source and repair two transport escapes
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-1.sh"
      - name: Use Java 17
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-2.sh"
      - name: Restore exact pinned backend materializer
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-3.sh"
      - name: Preserve original RED and backend host gates
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-4.sh"
      - name: Prove and repair actual media checked-exception signature
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-5.sh"
      - name: Preserve exact parser RED and bind layered selftest witnesses
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-6.sh"
      - name: Add missing activation Android declarations with original RED and four omission controls
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-7.sh"
      - name: Use screen-space dialog touch and preserve explicit unchecked witnesses
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-8.sh"
      - name: Bind deterministic lifecycle checks to actual candidate Java members
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-9.sh"
      - name: Persist all UI label families with raw-stream identity
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-10.sh"
      - name: Collect activation database and independently replay exact history
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-11.sh"
      - name: Isolate old scripted report fixtures and verify actual report SQLite rejection
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-12.sh"
      - name: Add native startup database collection and independent replay
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,json,lzma,os,pathlib
          raw=lzma.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(raw).hexdigest()=='f485b0bc2324ae9abd1ea1e22c9818c58b16ed3535a9f565d3ffb937ad376f38'
          data=json.loads(raw)
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"exact-activation-scripts/3.sh"
          script=path.read_text();head,body=script.split("import ast",1)
          tree=ast.parse("import ast"+body.rsplit("\nPY",1)[0])
          class Patch(ast.NodeTransformer):
              count=0
              def visit_Constant(self,node):
                  if isinstance(node.value,str) and node.value.startswith("import base64,json,lzma,importlib.util"):
                      anchor="for name,content in activation_files.items(): (folder/name).write_text(content)"
                      assert node.value.count(anchor)==1
                      self.count+=1
                      hook='activation_files["activation-parser.py"] += '+repr(data["extension"])+"\n"
                      hook+='assert activation_files["integrate-activation-ui.py"].count('+repr(data["anchor"])+')==1\n'
                      hook+='activation_files["integrate-activation-ui.py"]=activation_files["integrate-activation-ui.py"].replace('+repr(data["anchor"])+','+repr(data["hook"])+',1)\n'
                      value=node.value.replace(anchor,hook+anchor,1)
                      ast.parse(value)
                      return ast.copy_location(ast.Constant(value=value),node)
                  return node
          change=Patch();tree=change.visit(tree);assert change.count==1
          path.write_text(head+ast.unparse(tree)+"\nPY\n")
          PY
      - name: Integrate default startup UI and rerun all 21 original hosts
        id: integration
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-13.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: activation-host
          path: ${{ runner.temp }}/activation-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact host outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_OUTCOME: ${{ steps.integration.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_host-14.sh"
  shortcut_device:
    needs: shortcut_host
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api:
          - 26
          - 34
    env:
      TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - name: Restore exact accepted predecessor scripts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/cc06d83314b629746ac9a5588bcd2e0f581c255d/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(21795)
          assert len(raw)==21794 and hashlib.sha1(b"blob 21794"+bytes([0])+raw).hexdigest()=="93a051e95e02d9057a35ff335ffc3e3e2714f6f1"
          text=raw.decode();out=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-predecessor";out.mkdir()
          for job,count in (("shortcut_host",15),("shortcut_device",5),("shortcut_report",4)):
              assert text.count("  "+job+":\n")==1
              rest=text.split("  "+job+":\n",1)[1]
              lines=[]
              for line in rest.splitlines(keepends=True):
                  if line.startswith("  shortcut_"):break
                  lines.append(line)
              scripts=[]
              for index,line in enumerate(lines):
                  if line=="        run: |\n":
                      body=[]
                      for item in lines[index+1:]:
                          if item.strip() and not item.startswith("          "):break
                          body.append(item[10:] if item.startswith("          ") else item)
                      scripts.append("".join(body))
              assert len(scripts)==count,(job,len(scripts))
              for i,script in enumerate(scripts):
                  assert script.startswith("set -euo pipefail\n")
                  (out/(job+"-"+str(i)+".sh")).write_text(script)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: activation-host
          path: activation-evidence
      - name: Verify exact original source and repair two transport escapes
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_device-0.sh"
      - name: Restore exact six-file host-verified candidate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_device-1.sh"
      - name: Fixed disposable Android setup
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_device-2.sh"
      - name: Build isolated runner and restore original Gradle source
        env:
          BUILD_429_EXECUTE: 'true'
          BUILD_LOG: shortcut-build.log
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_device-3.sh"
      - name: Original regressions plus actual native default startup
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_device-4.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shortcut-device-api-${{ matrix.api }}
          path: |
            shortcut-device/
            shortcut-build.json
            shortcut-build.log
            shortcut-build-driver.log
            shortcut-android.log
            shortcut-setup.log
            emulator.log
          if-no-files-found: error
          retention-days: 14
  shortcut_report:
    needs:
      - shortcut_host
      - shortcut_device
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a5a17e1fdc570c73804007cd9a4d2ef36c0966b
          persist-credentials: false
      - name: Restore exact accepted predecessor scripts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          url="https://raw.githubusercontent.com/supercubegame/todo-pocket-android/cc06d83314b629746ac9a5588bcd2e0f581c255d/.github/workflows/shortcut-storage.yml"
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(21795)
          assert len(raw)==21794 and hashlib.sha1(b"blob 21794"+bytes([0])+raw).hexdigest()=="93a051e95e02d9057a35ff335ffc3e3e2714f6f1"
          text=raw.decode();out=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-predecessor";out.mkdir()
          for job,count in (("shortcut_host",15),("shortcut_device",5),("shortcut_report",4)):
              assert text.count("  "+job+":\n")==1
              rest=text.split("  "+job+":\n",1)[1]
              lines=[]
              for line in rest.splitlines(keepends=True):
                  if line.startswith("  shortcut_"):break
                  lines.append(line)
              scripts=[]
              for index,line in enumerate(lines):
                  if line=="        run: |\n":
                      body=[]
                      for item in lines[index+1:]:
                          if item.strip() and not item.startswith("          "):break
                          body.append(item[10:] if item.startswith("          ") else item)
                      scripts.append("".join(body))
              assert len(scripts)==count,(job,len(scripts))
              for i,script in enumerate(scripts):
                  assert script.startswith("set -euo pipefail\n")
                  (out/(job+"-"+str(i)+".sh")).write_text(script)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: activation-host
          path: activation-evidence
      - name: Verify exact original source and repair two transport escapes
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_report-0.sh"
      - name: Restore exact six-file host-verified candidate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_report-1.sh"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shortcut-*
          path: collected-shortcuts
      - name: Publish both original device receipts including failures
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_report-2.sh"
      - name: Include native database evidence without truncation
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-predecessor/shortcut_report-3.sh"
          old=path.read_text();anchor='        value["status"] = "PASS"';added='        value["native_database_replay"] = {}\n        for phase in ("seed","reopen"):\n            assert verifier.replay_native_ui(root,result,phase) is True\n            entry=result["native_ui_snapshots"][phase]\n            value["native_database_replay"][phase]={\n                "status":"PASS","files":entry["files"],\n                "old_table_count":len(entry["snapshot"]["old_cells"]),\n                "old_cells_sha256":hashlib.sha256(json.dumps(entry["snapshot"]["old_cells"],sort_keys=True,ensure_ascii=False).encode()).hexdigest(),\n                "schema":entry["snapshot"]["schema"],\n                "category_shortcuts":entry["snapshot"]["category_shortcuts"]}\n        value["status"] = "PASS"'
          assert old.count(anchor)==1
          new=old.replace(anchor,added,1);assert new.replace(added,anchor,1)==old
          path.write_text(new)
          PY
      - name: Publish exact new UI checks and original seed reopen streams
        id: ui_evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/native-predecessor/shortcut_report-3.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-shortcut-report
          path: |
            shortcut-report.json
            shortcut-report.log
            ui-compact-api*.json
          if-no-files-found: error
          retention-days: 14
