      - name: Fix observer connection reentry with original RED and retained negative controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,lzma,os,pathlib
          hook=lzma.decompress(base64.b64decode('',validate=True)).decode()
          assert hashlib.sha256(hook.encode()).hexdigest()=='4e25cde1d59826a73a94ce8250e0d8527e6a48d97027da3cd60f796eda293f31'
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"exact-activation-scripts/3.sh"
          script=path.read_text();head,body=script.split("import ast",1)
          tree=ast.parse("import ast"+body.rsplit("\nPY",1)[0])
          class Patch(ast.NodeTransformer):
              count=0
              def visit_Constant(self,node):
                  if isinstance(node.value,str) and node.value.startswith("import base64,json,lzma,importlib.util"):
                      anchor="for name,content in activation_files.items(): (folder/name).write_text(content)"
                      assert node.value.count(anchor)==1
                      self.count+=1
                      value=node.value.replace(anchor,hook+"\n"+anchor,1);ast.parse(value)
                      return ast.copy_location(ast.Constant(value=value),node)
                  return node
          change=Patch();tree=change.visit(tree);assert change.count==1
          path.write_text(head+ast.unparse(tree)+"\nPY\n")
          PY
