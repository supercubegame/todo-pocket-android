plugins {
    id 'com.android.application' version '8.7.3'
}
// Materialize before AGP discovers manifest inputs. preBuild is too late for
// a manifest absent during configuration. Keep generated input outside build/
// so a subsequent clean task cannot remove it from this configured build.
def schema3Manifest = file('.gradle/pocket-test-manifest/AndroidManifest.xml')
schema3Manifest.parentFile.mkdirs()
schema3Manifest.setText('''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <instrumentation android:name="com.supercubegame.pockettodo.Schema3DeviceTest" android:targetPackage="com.supercubegame.pockettodo.v12.preview" />
</manifest>
''', 'UTF-8')
android {
    namespace 'com.supercubegame.pockettodo'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.supercubegame.pockettodo.v12'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
        testInstrumentationRunner 'com.supercubegame.pockettodo.V12DeviceTest'
    }
    buildTypes {
        debug { applicationIdSuffix '.preview' }
        release { minifyEnabled false }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
    sourceSets {
        androidTest.manifest.srcFile schema3Manifest
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
