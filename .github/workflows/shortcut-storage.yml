name: Read original be26 device failures without rerun
on:
  push:
    branches: [ci/shortcut-storage-preflight-4d8742]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: shortcut-business-bridge-delivery
  cancel-in-progress: false
jobs:
  original_device_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify original archives and publish complete seed streams
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,zipfile
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"original-device";out.mkdir()
          repo="repos/"+os.environ["GITHUB_REPOSITORY"]
          def api(path):
              return subprocess.run(["gh","api",repo+path],capture_output=True,check=True,timeout=60).stdout
          cases=[(26,11891608213,"5eb87567a0cae5b9e195e55c8001d7acde256a998320d58e91b68d43e73b3213","ceb7dda2d63402df40f7d25f87a48c5a53b9d3def74e78ef8f6b079f728704d9"),(34,11891138869,"bd8fb46f7dcfe2470d278bbf92b13102b54fb91f4959a75f300721a0004d4811","6462dd7ef97b05897094043ecff5f24cae2050fb0d9d644ff939fc3014c8f16b")]
          for api_level,artifact,archive_sha,seed_sha in cases:
              meta=json.loads(api("/actions/artifacts/"+str(artifact)))
              assert meta["workflow_run"]["id"]==38558758574 and meta["workflow_run"]["head_sha"]=="be26b10321ce46d6d9808b9e8fb9f7b6cbfde860"
              raw=api("/actions/artifacts/"+str(artifact)+"/zip")
              assert len(raw)==meta["size_in_bytes"] and hashlib.sha256(raw).hexdigest()==archive_sha
              (out/f"original-api{api_level}.zip").write_bytes(raw)
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  assert len(archive.namelist())==len(set(archive.namelist()))
                  seed=archive.read("shortcut-device/seed.log")
                  assert len(seed)==6288 and hashlib.sha256(seed).hexdigest()==seed_sha
                  result=json.loads(archive.read("shortcut-device/result.json"))
                  assert result["api"]==api_level and result["commit"]=="be26b10321ce46d6d9808b9e8fb9f7b6cbfde860"
                  assert result["run_id"]=="38558758574" and result["run_attempt"]=="1"
                  stderr=archive.read("shortcut-device/command-5-stderr.bin")
                  manifest={n:{"bytes":archive.getinfo(n).file_size,"sha256":hashlib.sha256(archive.read(n)).hexdigest()} for n in archive.namelist() if not n.endswith("/")}
              (out/f"api{api_level}-seed.log").write_bytes(seed)
              (out/f"api{api_level}-manifest.json").write_text(json.dumps(manifest,indent=2))
              text="Complete original seed stream:\n"+seed.decode("utf-8","strict")+"\nComplete original command stderr:\n"+stderr.decode("utf-8","strict")
              body={"name":f"Original be26 API{api_level} seed","head_sha":os.environ["GITHUB_SHA"],"status":"completed","conclusion":"success","output":{"title":"Verified original failure retrieval, NOT device acceptance","summary":json.dumps({"source_run":38558758574,"artifact":artifact,"archive_sha256":archive_sha,"seed_sha256":seed_sha,"source_status":result["status"],"reruns":0,"product_pushes":0}),"text":"```text\n"+text+"\n```"}}
              assert len(body["output"]["text"].encode())<60000
              sent=subprocess.run(["gh","api","--method","POST",repo+"/check-runs","--input","-"],input=json.dumps(body),text=True,capture_output=True,check=True,timeout=60)
              seen=json.loads(api("/check-runs/"+str(json.loads(sent.stdout)["id"])))
              assert seen["head_sha"]==body["head_sha"] and all(seen["output"][k]==v for k,v in body["output"].items())
              print(seen["html_url"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-be26-device-evidence
          path: ${{ runner.temp }}/original-device/
          if-no-files-found: error
          retention-days: 14
