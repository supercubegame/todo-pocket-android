  export_feedback:
    needs: export_probe
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: export-probe-api-*
          path: collected
      - name: Publish early diagnostic receipts without waiting for full regression
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,tempfile,urllib.request,urllib.error
          from pathlib import Path
          from tools.verify_evidence import initial_evidence_read
          source,run=os.environ['GITHUB_SHA'],os.environ['GITHUB_RUN_ID']
          def log_tail(path):
              try:
                  with path.open("rb") as stream:
                      stream.seek(0,2);size=stream.tell()
                      stream.seek(max(0,size-24000));raw=stream.read(24000)
                  return {"status":"OBSERVED_NOT_ACCEPTANCE","bytes":size,
                      "truncated":size>24000,"tail":raw.decode("utf-8",errors="replace")}
              except OSError as exc:
                  return {"status":"NOT_OBSERVED","error":repr(exc)}
          def log_controls():
              with tempfile.TemporaryDirectory() as folder:
                  p=Path(folder)/"log"
                  assert log_tail(p)["status"]=="NOT_OBSERVED"
                  assert log_tail(Path(folder))["status"]=="NOT_OBSERVED"
                  p.write_bytes(b"");v=log_tail(p)
                  assert v["tail"]=="" and v["bytes"]==0 and v["truncated"] is False
                  p.write_bytes(b"x"*23999+b"\xff");v=log_tail(p)
                  assert len(v["tail"])==24000 and v["tail"].endswith("\ufffd") and v["truncated"] is False
                  p.write_bytes(b"x"*24001+b"TRACEBACK_SENTINEL");v=log_tail(p)
                  assert len(v["tail"])==24000 and v["truncated"] is True and v["tail"].endswith("TRACEBACK_SENTINEL")
              return {"checks":5,"scope":"HOST_LOG_CAPTURE_NOT_DEVICE"}
          controls=log_controls()
          devices={};logs={}
          for level in (26,34):
            folder=Path('collected')/('export-probe-api-'+str(level))
            path=folder/'export-probe.json'
            logs[str(level)]={name:log_tail(folder/name) for name in (
              'export-probe-setup.log','export-probe-build.log','export-probe.log','export-probe-emulator.log')}
            try:
              assert path.stat().st_size<=2*1024*1024
              value=json.loads(path.read_bytes())
              assert value['commit']==source and value['run_id']==run and type(value['api']) is int and value['api']==level
              devices[str(level)]=value
            except (OSError,ValueError,KeyError,TypeError,AssertionError) as exc:
              devices[str(level)]={'status':'NOT_VERIFIED','error':repr(exc)}
          doc={'commit':source,'run_id':run,'scope':'EARLY_DIAGNOSTIC_NOT_ACCEPTANCE',
            'devices':devices,'logs':logs,'log_controls':controls,'release_ready':False,'durable_upgrade_ready':False}
          data=(json.dumps(doc,ensure_ascii=False,indent=2)+'\n').encode()
          endpoint='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'
          def api(path,method='GET',body=None,timeout=30):
            req=urllib.request.Request(endpoint+path,method=method,data=None if body is None else json.dumps(body).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=timeout) as response:return json.load(response)
          path='reports/export-probe-early-'+source+'-'+run+'.json'
          body={'message':'Record early export diagnostics, not acceptance','branch':'evidence','content':base64.b64encode(data).decode()}
          try:body['sha']=initial_evidence_read(api,path,emit=lambda row: print('EVIDENCE_INITIAL_READ '+json.dumps(row),flush=True))['sha']
          except urllib.error.HTTPError as exc:
            if exc.code!=404:raise
          written=api('contents/'+path,'PUT',body)
          actual=api('contents/'+path+'?ref='+written['commit']['sha'])
          assert base64.b64decode(actual['content'])==data
          print('EARLY_EXPORT_DIAGNOSTIC '+actual['html_url'],flush=True)
          PY
  database:
