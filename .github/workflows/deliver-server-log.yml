name: Batch summary viewport guarded delivery
on:
  push:
    branches: [diagnostic/server-log-delivery-20261008]
    paths: [.github/workflows/deliver-server-log.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: bounded-server-log-delivery-20261008
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'supercubegame/todo-pocket-android' && github.ref == 'refs/heads/diagnostic/server-log-delivery-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Validate and submit bounded batch summary scanner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,lzma,re,subprocess
          from pathlib import Path
          prior="5c708e768e37aa70e3dafdc3afbd9f42d8af08fa"
          raw=subprocess.check_output(["git","show",prior+":.github/workflows/deliver-server-log.yml"],timeout=30)
          assert len(raw)==16830 and hashlib.sha256(raw).hexdigest()=="3be6e67aa8b88fe0f97ec7980b55c87ff7b279a0ca085b22b273ee05fff942c7"
          match=re.findall(rb"base64.b64decode\('([^']+)',validate=True\)",raw)
          assert len(match)==1
          d=lzma.LZMADecompressor(memlimit=134217728)
          s=d.decompress(base64.b64decode(match[0],validate=True),max_length=39493)
          assert d.eof and not d.unused_data and len(s)==39492 and hashlib.sha256(s).hexdigest()=="5bad1924b58b2c22d2eebc3b19bc397031efa0e4c1a920a0cc92dad2d41cfab3"
          tree=ast.parse(s)
          assert ast.unparse(tree.body[-1])=="main(PAYLOAD)"
          tree.body.pop()
          ns={"__name__":"approved_batch_delivery"}
          exec(compile(tree,"<pinned-batch-delivery>","exec"),ns)
          """Read the actual pinned inherited host-command list, without executing delivery."""
          def preserved_commands(work):
              import ast,base64,hashlib,lzma,subprocess
              def require(condition,message):
                  if not condition: raise AssertionError(message)
              def get(ref):
                  return subprocess.check_output(
                      ["git","show",ref+":.github/workflows/deliver-server-log.yml"],cwd=work,timeout=30)
              raw=get("9e98eb5e2c28943da97c0ca5b456867d8b64019d")
              require(len(raw)==11729 and hashlib.sha256(raw).hexdigest()=="9febad8597612e5bedf83e856f1ef01bd2363c4c810b390cec383466cfc8fdf2",
                      "Previous workflow exact bytes")
              import re
              match=re.findall(rb"base64.b64decode\('([^']+)',validate=True\)",raw)
              require(len(match)==1,"Previous payload anchor")
              decoder=lzma.LZMADecompressor(memlimit=134217728)
              data=decoder.decompress(base64.b64decode(match[0],validate=True),max_length=23641)
              require(decoder.eof and not decoder.unused_data and len(data)==23640 and
                      hashlib.sha256(data).hexdigest()=="224bf65eda7211710b495e6da6b7726d4ca42a9f6b728f547d5a6c751d815e8d",
                      "Previous script exact bytes")
              tree=ast.parse(data)
              # The wrapper contains no commands assignment. Its immutable helper expands
              # the original 11-command list plus the approved parser selftest.
              names={"need","historical_source"}
              functions=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in names]
              require(len(functions)==2 and {n.name for n in functions}==names,"Historical decoder functions")
              scope=dict(ast=ast,base64=base64,hashlib=hashlib,lzma=lzma)
              exec(compile(ast.Module(body=functions,type_ignores=[]),"<pinned-historical-decoder>","exec"),scope)
              source=scope["historical_source"](get("1d030f02c5f54e65ea346cc5fcea89c971d61aa6"))
              return command_list(source)
          
          def command_list(source):
              import ast
              tree=ast.parse(source)
              mains=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="main"]
              assert len(mains)==1,"Host main missing or duplicate"
              candidates=[n.value for n in ast.walk(mains[0]) if isinstance(n,ast.Assign)
                          and any(isinstance(t,ast.Name) and t.id=="commands" for t in n.targets)]
              assert len(candidates)==1,"Host commands missing or duplicate in main"
              commands=ast.literal_eval(candidates[0])
              expected=[
                  ["python3","tools/verify_app_catalog.py","selftest"],
                  ["python3","tools/verify.py","v12"],
                  ["python3","tools/verify_process_control.py","selftest"],
                  ["python3","tools/verify_ui_observer.py","selftest"],
                  ["python3","tools/verify_adb_transfer.py"],
                  ["python3","tools/verify_evidence.py"],
                  ["python3","tools/verify_schema3.py","selftest"],
                  ["python3","tools/verify_note_drafts.py","selftest"],
                  ["python3","tools/verify_todo_management.py","selftest"],
                  ["python3","tools/verify_custom_fields.py","selftest"],
                  ["python3","tools/verify_category_drag.py","selftest"],
                  ["python3","-c",'import sys;sys.path.insert(0,"tools");import emulator_gate;emulator_gate.parser_selftest()'],
              ]
              assert commands==expected,"Original twelve commands changed"
              return commands
          
          ns["PARENT"]=prior
          ns["baseline_commands"]=preserved_commands
          ns["main"](ns["PAYLOAD"])
          PY
      - name: Preserve delivery and original host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-summary-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/catalog-forward-repair/receipt.json
            ${{ runner.temp }}/catalog-forward-repair/host-*.log
          if-no-files-found: error
          retention-days: 14
